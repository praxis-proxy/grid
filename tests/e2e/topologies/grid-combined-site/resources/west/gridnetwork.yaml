apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: grid-combined-site
  labels:
    grid.praxis.fast/auto-discover-sites: "true"
spec:
  gridId: grid-combined-site-v1
  region: west
  zone: west-1
  membership:
    mode: Swim
    swim:
      seeds:
        - "{{ captures.central.swim-lb-ip }}:7946"
        - "{{ captures.east.swim-lb-ip }}:7946"
  tls:
    caSecretRef: null
    siteSecretRef:
      name: consumer-gateway-tls
      namespace: grid-system
    swimKeySecretRef: null
