listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: json_body_field
        field: model
        header: X-Model
      - filter: headers
        response_set:
          - name: X-Grid-Static-Weighted-Consumer-Gateway
            value: "{{ cluster.name }}"
      - filter: intelligent_route
        overlay_file: /etc/praxis/routing/routing-overlay.json
        model_header: X-Model
        provider_hop_clusters:
          - vcr-provider-a-provider
          - vcr-provider-b-provider
          - vcr-provider-c-provider
        expected_overlay_scope:
          network: "{{ cluster.properties.networkName }}"
          gateway: consumer-gateway
          namespace: grid-system
          local_site: "{{ cluster.name }}"
        reload:
          enabled: true
          debounce_ms: 500
        session_affinity:
          enabled: true
          header: X-Session-Id
          ttl_secs: 3600
      - filter: load_balancer
        clusters:
          - name: vcr-provider-a-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: provider-a.grid.internal
              verify: true
            endpoints:
              - "{{ captures.provider-a.provider-gateway-ip }}:8443"
          - name: vcr-provider-b-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: provider-b.grid.internal
              verify: true
            endpoints:
              - "{{ captures.provider-b.provider-gateway-ip }}:8443"
          - name: vcr-provider-c-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: provider-c.grid.internal
              verify: true
            endpoints:
              - "{{ captures.provider-c.provider-gateway-ip }}:8443"

admin:
  address: "127.0.0.1:9901"

shutdown_timeout_secs: 5
