apiVersion: v1
kind: ConfigMap
metadata:
  name: vcr-inference-{{ cluster.name }}-config
  namespace: grid-system
data:
  config.yaml: |
    port: 8000
    model: "Qwen/Qwen3-0.6B"
    served-model-name: ["Qwen/Qwen3-0.6B"]
    mode: "echo"
    force-dummy-tokenizer: true
    fake-metrics:
      waiting-requests: 0
      kv-cache-usage: 0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcr-inference-{{ cluster.name }}
  namespace: grid-system
  labels:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/part-of: grid-static-weighted
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
      app.kubernetes.io/instance: "{{ cluster.name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-vcr
        app.kubernetes.io/instance: "{{ cluster.name }}"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: vcr-inference-{{ cluster.name }}-config
      containers:
        - name: vcr
          image: "{{ cluster.properties.vcrImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          args:
            - --config
            - /config/config.yaml
            - --logtostderr=true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
          env:
            - name: MODEL
              value: "Qwen/Qwen3-0.6B"
            - name: MOCK_PD_ROLE
              value: "both"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_PORT
              value: "8000"
            - name: MOCK_MAX_NUM_SEQS
              value: "4"
            - name: MOCK_KV_CACHE_SIZE
              value: "64"
            - name: MOCK_TOKENS_PER_BLOCK
              value: "16"
            - name: MOCK_MAX_MODEL_LEN
              value: "512"
            - name: MOCK_TTFT_MS
              value: "50"
            - name: MOCK_ITL_MS
              value: "20"
            - name: MOCK_TIME_FACTOR_UNDER_LOAD
              value: "2.0"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vcr-inference-{{ cluster.name }}
  namespace: grid-system
  labels:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/part-of: grid-static-weighted
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/instance: "{{ cluster.name }}"
  ports:
    - name: http
      port: 8000
      targetPort: 8000
