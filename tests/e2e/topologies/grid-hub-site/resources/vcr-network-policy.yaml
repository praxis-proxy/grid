apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vcr-inference-allow-grid
  namespace: model
  labels:
    app.kubernetes.io/part-of: grid-hub-site
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grid
      ports:
        - protocol: TCP
          port: 8000
