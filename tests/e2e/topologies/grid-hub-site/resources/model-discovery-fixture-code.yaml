apiVersion: v1
kind: ConfigMap
metadata:
  name: model-discovery-fixture-code
  namespace: model
  labels:
    app.kubernetes.io/part-of: grid-hub-site
data:
  server.py: |
    import http.client
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit

    BACKEND = urlsplit(os.environ["BACKEND"])
    BACKEND_MODEL = "Qwen/Qwen3-0.6B"
    HOP_HEADERS = {
        "connection", "keep-alive", "proxy-authenticate", "proxy-authorization",
        "te", "trailer", "transfer-encoding", "upgrade",
    }


    def model_names():
        padding = "x" * 246
        return [f"model-{index:03d}-{padding}" for index in range(256)]


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.send_header("Content-Length", "2")
                self.end_headers()
                self.wfile.write(b"ok")
                return
            if self.path == "/v1/models":
                try:
                    with open("/config/fixture.json", encoding="utf-8") as config_file:
                        config = json.load(config_file)
                except (OSError, json.JSONDecodeError):
                    self.send_error(503)
                    return
                if config.get("mode") == "failure":
                    self.send_error(503, "discovery fixture failure")
                    return
                names = {
                    "single": ["Qwen/Qwen3-0.6B"],
                    "empty": [],
                    "full": model_names(),
                }.get(config.get("mode"))
                if names is None:
                    self.send_error(500, "invalid discovery fixture mode")
                    return
                body = json.dumps({"object": "list", "data": [{"id": name} for name in names]}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self.forward()

        def do_POST(self):
            self.forward()

        def do_PUT(self):
            self.forward()

        def do_PATCH(self):
            self.forward()

        def do_DELETE(self):
            self.forward()

        def forward(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", "0")))
            requested_model = None
            if self.path == "/v1/chat/completions" and body:
                try:
                    request = json.loads(body)
                    requested_model = request.get("model")
                    if isinstance(requested_model, str) and requested_model != BACKEND_MODEL:
                        request["model"] = BACKEND_MODEL
                        body = json.dumps(request).encode()
                    else:
                        requested_model = None
                except (json.JSONDecodeError, AttributeError):
                    requested_model = None
            headers = {
                name: value for name, value in self.headers.items()
                if name.lower() not in HOP_HEADERS and name.lower() not in {"host", "content-length"}
            }
            headers["Host"] = BACKEND.netloc
            if body:
                headers["Content-Length"] = str(len(body))
            connection = http.client.HTTPConnection(BACKEND.hostname, BACKEND.port or 80, timeout=30)
            try:
                connection.request(self.command, self.path, body=body, headers=headers)
                response = connection.getresponse()
                response_body = response.read()
                if requested_model is not None and response.status == 200:
                    try:
                        completion = json.loads(response_body)
                        if isinstance(completion, dict) and isinstance(completion.get("model"), str):
                            completion["model"] = requested_model
                            response_body = json.dumps(completion).encode()
                    except (json.JSONDecodeError, UnicodeDecodeError):
                        pass
                self.send_response(response.status, response.reason)
                for name, value in response.getheaders():
                    if name.lower() not in HOP_HEADERS and name.lower() not in {"content-length", "connection"}:
                        self.send_header(name, value)
                self.send_header("Content-Length", str(len(response_body)))
                self.end_headers()
                self.wfile.write(response_body)
            except (OSError, http.client.HTTPException):
                self.send_error(502, "completion backend unavailable")
            finally:
                connection.close()

        def log_message(self, format_string, *args):
            print(format_string % args, flush=True)


    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
