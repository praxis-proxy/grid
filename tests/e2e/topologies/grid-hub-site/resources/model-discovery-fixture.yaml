apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-discovery-fixture
  namespace: model
  labels:
    app.kubernetes.io/name: model-discovery-fixture
    app.kubernetes.io/part-of: grid-hub-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-discovery-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-discovery-fixture
        app.kubernetes.io/part-of: grid-hub-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: docker.io/library/python:3.13.7-alpine3.22
          imagePullPolicy: IfNotPresent
          command: [python3, /fixture/server.py]
          env:
            - name: BACKEND
              value: http://vcr-inference-site.model.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: model-discovery-fixture-code
            defaultMode: 0444
        - name: config
          configMap:
            name: model-discovery-fixture
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: model-discovery-fixture
  namespace: model
  labels:
    app.kubernetes.io/name: model-discovery-fixture
    app.kubernetes.io/part-of: grid-hub-site
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-discovery-fixture
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-discovery-fixture-allow-grid
  namespace: model
  labels:
    app.kubernetes.io/part-of: grid-hub-site
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-discovery-fixture
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grid
      ports:
        - protocol: TCP
          port: 8000
