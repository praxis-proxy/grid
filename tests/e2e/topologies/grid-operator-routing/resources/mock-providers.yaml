apiVersion: v1
kind: Pod
metadata:
  name: qualification-client
  namespace: grid-system
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "sleep 86400"]
