apiVersion: forge.praxis.dev/v1alpha1
kind: Environment

metadata:
  name: grid-hub-site-llmd

spec:
  runtime:
    provider: docker
    clusterPrefix: grid-hub-site-llmd

  network:
    crossCluster: true
    dnsZone: grid-hub-site-llmd.test

  # Infrastructure and the llm-d stack only: scripts/e2e-hub-site.sh installs the grid
  # with helm under LLMD=1.
  clusters:
    - name: hub
      stacks: [metallb, gie-crds, llmd]
      properties:
        simImage: "ghcr.io/llm-d/llm-d-inference-sim:v1.0.0"
        imagePullPolicy: IfNotPresent

    - name: site
      stacks: [metallb, gie-crds, llmd]
      properties:
        simImage: "ghcr.io/llm-d/llm-d-inference-sim:v1.0.0"
        imagePullPolicy: IfNotPresent

  stacks:
    metallb:
      description: MetalLB load balancer with auto-configured address pool
      steps:
        - type: url
          url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
          sha256: 951065e85692aa106f1bb5d5a487d9306154923a794ab1d82122881cbaf588e4
        - type: wait
          resource: deployment/controller
          namespace: metallb-system
          condition: available
          timeout: "120s"
        - type: metallb-auto-pool
          name: forge-pool

    gie-crds:
      description: Gateway API Inference Extension v1.6.2 CRDs, the InferencePool the EPP serves
      steps:
        - type: url
          url: https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/v1.6.2/v1-manifests.yaml
          sha256: f410dfca474608c02903087b47f1ac081706dfb6dfe7f83d00a7cc7e00c4ad0d

    llmd:
      description: Two llm-d-inference-sim pods behind the llm-d router (Envoy and EPP) and an InferencePool
      steps:
        - type: manifest
          path: resources/llmd-namespace.yaml
        - type: template-manifest
          path: resources/sim-workload.yaml
        - type: manifest
          path: resources/router.yaml
        - type: manifest
          path: resources/router-network-policy.yaml
        - type: wait
          resource: deployment/llm-d-inference-sim
          namespace: llmd
          condition: available
          timeout: "300s"
        - type: wait
          resource: deployment/llmd-router-epp
          namespace: llmd
          condition: available
          timeout: "300s"
