# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: "inference.networking.k8s.io/v1"
kind: InferencePool
metadata:
  name: llmd-router
  namespace: llmd
  labels:
    app.kubernetes.io/name: llmd-router-epp
    app.kubernetes.io/version: "0.0.0"
spec:
  targetPorts:
  - number: 8000
  appProtocol: "http"
  selector:
    matchLabels:
      app.kubernetes.io/name: "llm-d-inference-sim"
  endpointPickerRef:
    name: llmd-router-epp
    port:
      number: 9002
    failureMode: FailOpen
