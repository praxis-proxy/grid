apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-inference-sim
  namespace: llmd
  labels:
    app.kubernetes.io/name: llm-d-inference-sim
    app.kubernetes.io/part-of: grid-hub-site-llmd
data:
  # Four concurrent requests per pod, so a load loop of eight queues at the engine.
  # Non-zero latencies keep requests running long enough for the EPP to count them.
  config.yaml: |
    port: 8000
    model: "Qwen/Qwen3-0.6B"
    served-model-name: ["Qwen/Qwen3-0.6B"]
    mode: echo
    max-num-seqs: 4
    max-model-len: 1024
    enable-kvcache: true
    kv-cache-size: 64
    block-size: 16
    latencies:
      time-to-first-token: 200ms
      inter-token-latency: 20ms
      time-factor-under-load: 2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-inference-sim
  namespace: llmd
  labels:
    app.kubernetes.io/name: llm-d-inference-sim
    app.kubernetes.io/part-of: grid-hub-site-llmd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-inference-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-inference-sim
        app.kubernetes.io/instance: "{{ cluster.name }}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: llm-d-inference-sim
      containers:
        - name: sim
          image: "{{ cluster.properties.simImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          args: ["--config", "/config/config.yaml"]
          # The simulated KV cache keys its events on the pod's address.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
