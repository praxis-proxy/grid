apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: grid-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: quota-state
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-auth
  namespace: grid-system
type: Opaque
stringData:
  # Demo-only credential; consumers receive the URL through a Secret-backed env var.
  password: token-rate-limit-demo-only
  url: redis://:token-rate-limit-demo-only@valkey.grid-system.svc.cluster.local:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: grid-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: quota-state
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: quota-state
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
          imagePullPolicy: IfNotPresent
          args: ["valkey-server", "--appendonly", "no", "--requirepass", "$(VALKEY_PASSWORD)"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
  namespace: grid-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              grid.praxis-proxy.io/quota-client: "true"
      ports:
        - protocol: TCP
          port: 6379
