apiVersion: grid.praxis.fast/v1alpha1
kind: GridSite
metadata:
  name: grid-token-rate-limit-west
  labels:
    grid.praxis.fast/network: grid-token-rate-limit
    grid.praxis.fast/auto-discovered: "true"
spec:
  gridNetworkRef: grid-token-rate-limit
  gatewayEndpoint:
    address: "{{ captures.west.swim-lb-ip }}:8443"
    tls:
      mode: Mutual
      serverName: provider-a.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_WEST_FINGERPRINT
---
apiVersion: grid.praxis.fast/v1alpha1
kind: GridSite
metadata:
  name: grid-token-rate-limit-central
  labels:
    grid.praxis.fast/network: grid-token-rate-limit
    grid.praxis.fast/auto-discovered: "true"
spec:
  gridNetworkRef: grid-token-rate-limit
  gatewayEndpoint:
    address: "{{ captures.central.swim-lb-ip }}:8443"
    tls:
      mode: Mutual
      serverName: provider-b.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_CENTRAL_FINGERPRINT
