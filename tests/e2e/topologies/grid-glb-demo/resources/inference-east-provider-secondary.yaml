apiVersion: grid.praxis.fast/v1alpha1
kind: InferenceProvider
metadata:
  name: vcr-east-provider-secondary
spec:
  gridNetworkRef: glb-demo
  providerKind: vllm-vcr
  backendKind: local
  clusterName: vcr-east-provider-secondary
  endpoint: http://vcr-inference-secondary.grid-system.svc.cluster.local:8000
  models:
    - name: Qwen/Qwen3-0.6B
      capabilities: ["text_generation"]
      contextWindow: 4096
  siteSelector:
    matchLabels:
      grid.praxis.fast/provider-site: east-provider
  accessPolicy:
    siteSelector:
      matchLabels: {}
  healthCheck:
    path: /health
    interval: "30s"
    timeout: "5s"
