apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: glb-demo
  labels:
    grid.praxis.fast/auto-discover-sites: "true"
spec:
  gridId: grid-glb-demo-v1
  region: west
  zone: west-edge-1
  seeds:
    - "{{ captures.east-edge.swim-lb-ip }}:7946"
    - "{{ captures.east-provider.swim-lb-ip }}:7946"
    - "{{ captures.west-provider.swim-lb-ip }}:7946"
  swim:
    probeInterval: "5s"
    suspicionTimeout: "15s"
    gossipNodes: 3
  consumerGateways:
    - name: edge-gateway
      namespace: grid-system
      siteName: west-edge
      praxisConfig:
        generate: false
        clusterEndpoints:
          - cluster: vcr-east-provider
            address: "{{ captures.east-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutual_tls
              sni: east-provider.grid.internal
          - cluster: vcr-east-provider-secondary
            address: "{{ captures.east-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutual_tls
              sni: east-provider.grid.internal
          - cluster: vcr-west-provider
            address: "{{ captures.west-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutual_tls
              sni: west-provider.grid.internal
  tls:
    caSecretRef:
      name: edge-gateway-tls
      namespace: grid-system
    siteSecretRef:
      name: edge-gateway-tls
      namespace: grid-system
    swimKeySecretRef: null
