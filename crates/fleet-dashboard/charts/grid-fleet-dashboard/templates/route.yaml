{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "fleet-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-dashboard.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "fleet-dashboard.fullname" . }}
    weight: 100
  port:
    targetPort: {{ if .Values.auth.oauthProxy.enabled }}https{{ else }}http{{ end }}
  tls:
    termination: {{ if .Values.auth.oauthProxy.enabled }}reencrypt{{ else }}edge{{ end }}
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
