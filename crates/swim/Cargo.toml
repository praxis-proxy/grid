[package]
name = "swim"
description = "SWIM membership protocol wrapper for the AI Grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["rust-crypto"]
# RustCrypto backend: ring ECDSA signing, aes-gcm transport AEAD, sha2 digests.
rust-crypto = ["dep:ring", "dep:aes-gcm", "dep:sha2"]
# Backwards-compatible alias for the signing-backend selection.
ring-signing = ["rust-crypto"]
# System OpenSSL backend: EVP ECDSA, symm AES-256-GCM, EVP digests.
fips = ["dep:openssl"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
bincode = { workspace = true }
crdt = { path = "../crdt" }
foca = { workspace = true }
# foca 1.x uses rand 0.9's RNG traits, which are incompatible with rand 0.10.
rand09 = { workspace = true }
ring = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
x509-parser = { workspace = true }

[lints]
workspace = true
