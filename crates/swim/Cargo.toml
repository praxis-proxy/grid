[package]
name = "swim"
description = "SWIM membership protocol wrapper for the AI Grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["ring-signing"]
ring-signing = ["dep:ring"]
# Use the host OpenSSL provider for model inventory digest verification.
fips = ["dep:openssl"]

[dependencies]
aes-gcm = { workspace = true }
bincode = { workspace = true }
crdt = { path = "../crdt" }
foca = { workspace = true }
# foca 1.x uses rand 0.9's RNG traits, which are incompatible with rand 0.10.
rand09 = { workspace = true }
ring = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
x509-parser = { workspace = true }

[lints]
workspace = true
