# cargo-deny policy for the gateway workspace. Mirrors the root deny.toml
# (licenses, bans, registry sources), plus pinned Praxis git sources and
# documented transitive advisory exceptions for the Gateway graph.

[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
  # PPE 0.6.0's default builtin bundle includes Limitador 0.14, which pulls
  # atomic-polyfill through postcard/heapless and paste through CEL 0.12.
  # Both are unmaintained with no patched versions; replacement needs an
  # upstream dependency change. Neither is in the Policy FIPS profiles.
  { id = "RUSTSEC-2023-0089", reason = "unmaintained atomic-polyfill via Limitador/postcard/heapless; no patched version" },
  { id = "RUSTSEC-2024-0436", reason = "unmaintained paste via Limitador/CEL 0.12; no patched version" },
  # rustls-pemfile is unmaintained (RUSTSEC-2025-0134); it is a transitive
  # dependency of the gateway's rustls/Pingora TLS stack with no upstream
  # replacement wired yet.
  { id = "RUSTSEC-2025-0134", reason = "transitive via rustls; no upstream fix available" },
  # The upstream Pingora header-serde release pins zstd 0.13 and zstd-safe 7;
  # no compatible release is available for the fixed zstd 0.14 / zstd-safe 8.
  { id = "RUSTSEC-2026-0391", reason = "upstream header-serde pins zstd 0.13; no compatible fixed release available" },
  { id = "RUSTSEC-2026-0398", reason = "upstream header-serde pins zstd-safe 7; no compatible fixed release available" },
  { id = "RUSTSEC-2026-0403", reason = "upstream header-serde pins zstd-safe 7; no compatible fixed release available" },
  # This allocator-shim issue is wasm32-only; grid-gateway is a native binary.
  { id = "RUSTSEC-2026-0410", reason = "wasm32-only allocator issue; grid-gateway does not target wasm32" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The gateway consumes praxis-ai (apis + filters) as a pinned git dependency;
# this is the workspace split that took the gateway out of the root graph.
allow-git = [
  "https://github.com/praxis-proxy/ai.git",
  # Temporary pin to Praxis #1516 until its Policy FIPS features are released.
  "https://github.com/praxis-proxy/praxis",
]
