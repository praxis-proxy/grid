[package]
name = "certs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["rcgen"]
rcgen = ["dep:rcgen", "dep:sha2", "dep:hmac", "x509-parser/verify"]
fips = ["dep:openssl"]
# The rustls peer-mTLS verifier (GridSpiffe{Server,Client}Verifier). Off by
# default; a consumer that dials or terminates grid mTLS enables it. rustls is
# pulled without a crypto provider: the verifier takes its signature-verification
# algorithms from the provider the consumer installs, so FIPS follows that
# provider rather than a build flag, and there is no ring path to leak.
verifier = ["dep:rustls"]

[dependencies]
pem = "4"
# x509-parser/verify is the only ring path; the rcgen feature gates it.
x509-parser = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"], optional = true }
openssl = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }
# No provider feature: algorithms come from the consumer's installed provider.
rustls = { workspace = true, optional = true }

[dev-dependencies]
# Interop tests exercise both backends, so a fips test build still needs rcgen.
rcgen = { workspace = true, features = ["x509-parser"] }
x509-parser = { workspace = true, features = ["verify"] }
# The verifier tests need a crypto provider to source algorithms; ring is test-only.
rustls = { workspace = true, features = ["ring"] }
# Integration tests decode and re-encode request PEM; a normal dep is not visible there.
pem = "4"
spiffe = { workspace = true }

[lints]
workspace = true
