# Grid Operator values for the east provider site (dedicated-edge topology).
#
# Install:
#   helm upgrade --install grid-operator ../../../../charts/grid-operator \
#     --kube-context "$EAST_PROVIDER_CONTEXT" \
#     --namespace grid-system --create-namespace \
#     --values east-provider-operator.yaml

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.0
  pullPolicy: IfNotPresent

swim:
  siteName: east-provider
  seeds: "REPLACE_EAST_CONSUMER_SWIM:7946,REPLACE_WEST_CONSUMER_SWIM:7946,REPLACE_WEST_PROVIDER_SWIM:7946"
  service:
    enabled: true
    type: LoadBalancer
    port: 7946

gateway:
  serviceName: provider-gateway
  port: "8443"
