# Praxis provider gateway values for the west provider site.
#
# Install:
#   helm upgrade --install provider-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$WEST_PROVIDER_CONTEXT" \
#     --namespace grid-system \
#     --values west-provider-gateway.yaml

fullnameOverride: provider-gateway

image:
  repository: ghcr.io/praxis-proxy/ai
  tag: 0.4.0
  pullPolicy: IfNotPresent

config:
  existingConfigMap: provider-praxis-config
  key: praxis.yaml

tls:
  enabled: true
  existingSecret: provider-tls

credentials:
  - name: mock-inference-credential
    mountPath: /etc/praxis/credentials/mock-inference
    optional: false

port:
  containerPort: 8443
  name: https

service:
  enabled: true
  type: ClusterIP
  port: 8443
