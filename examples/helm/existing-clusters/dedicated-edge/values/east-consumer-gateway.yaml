# Praxis consumer gateway values for the east consumer site.
#
# Install:
#   helm upgrade --install consumer-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$EAST_CONSUMER_CONTEXT" \
#     --namespace grid-system \
#     --values east-consumer-gateway.yaml

fullnameOverride: consumer-gateway

image:
  repository: ghcr.io/praxis-proxy/ai
  tag: 0.4.0
  pullPolicy: IfNotPresent

praxisConfig:
  configMapName: consumer-praxis-config
  key: praxis.yaml

grid:
  networkName: NETWORK   # the GridNetwork name
  siteName: east-consumer

overlay:
  # Name: grid-overlay-{GridNetwork name}-{gateway service name}
  configMapName: grid-overlay-NETWORK-consumer-gateway

gridIdentity:
  secretName: consumer-tls

service:
  enabled: true
  type: ClusterIP
  port: 8080
