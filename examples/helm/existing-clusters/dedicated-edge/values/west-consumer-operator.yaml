# Grid Operator values for the west consumer site (dedicated-edge topology).
#
# Install:
#   helm upgrade --install grid-operator ../../../../charts/grid-operator \
#     --kube-context "$WEST_CONSUMER_CONTEXT" \
#     --namespace grid-system --create-namespace \
#     --values west-consumer-operator.yaml

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.1.4
  pullPolicy: IfNotPresent

swim:
  siteName: west-consumer
  seeds: "REPLACE_EAST_CONSUMER_SWIM:7946,REPLACE_EAST_PROVIDER_SWIM:7946,REPLACE_WEST_PROVIDER_SWIM:7946"
  service:
    enabled: true
    type: LoadBalancer
    port: 7946

# Consumer-only sites have no local provider gateway to advertise.
gateway:
  discoveryEnabled: false
