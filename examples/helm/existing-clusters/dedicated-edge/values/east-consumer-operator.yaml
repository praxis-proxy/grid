# Grid Operator values for the east consumer site (dedicated-edge topology).
#
# Install:
#   helm upgrade --install grid-operator ../../../../charts/grid-operator \
#     --kube-context "$EAST_CONSUMER_CONTEXT" \
#     --namespace grid-system --create-namespace \
#     --values east-consumer-operator.yaml

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.0
  pullPolicy: IfNotPresent

swim:
  siteName: east-consumer
  # Comma-separated SWIM seed addresses of remote sites.
  # Replace with the actual reachable addresses of the other three sites.
  seeds: "REPLACE_WEST_CONSUMER_SWIM:7946,REPLACE_EAST_PROVIDER_SWIM:7946,REPLACE_WEST_PROVIDER_SWIM:7946"
  service:
    enabled: true
    type: LoadBalancer
    port: 7946

# Consumer-only sites have no local provider gateway to advertise.
gateway:
  discoveryEnabled: false
