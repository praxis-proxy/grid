# Praxis provider gateway values for the east-a site (combined topology).
# Provider credentials are mounted here and must NOT be shared with the
# consumer gateway Deployment on the same cluster.
#
# Install:
#   helm upgrade --install provider-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$EAST_A_CONTEXT" \
#     --namespace grid-system \
#     --values east-a-provider-gateway.yaml

fullnameOverride: provider-gateway

image:
  repository: ghcr.io/praxis-proxy/ai
  tag: 0.4.0
  pullPolicy: IfNotPresent

praxisConfig:
  byo:
    configMapName: provider-praxis-config
    key: praxis.yaml

grid:
  siteName: east-a

gridIdentity:
  secretName: provider-tls
  caSecretName: grid-ca

providerCredentials:
  - secretName: mock-inference-credential
    mountPath: /etc/praxis/credentials/mock-inference
    optional: false

port:
  containerPort: 8443
  name: https

service:
  enabled: true
  type: LoadBalancer
  port: 8443
