# Praxis provider gateway values for the east-b site (combined topology).
#
# Install:
#   helm upgrade --install provider-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$EAST_B_CONTEXT" \
#     --namespace grid-system \
#     --values east-b-provider-gateway.yaml

fullnameOverride: provider-gateway

image:
  repository: ghcr.io/praxis-proxy/ai
  tag: 0.4.0
  pullPolicy: IfNotPresent

praxisConfig:
  configMapName: provider-praxis-config
  key: praxis.yaml

tls:
  enabled: true
  existingSecret: provider-tls

providerCredentials:
  - secretName: mock-inference-credential
    mountPath: /etc/praxis/credentials/mock-inference
    optional: false

port:
  containerPort: 8443
  name: https

service:
  enabled: true
  type: ClusterIP
  port: 8443
