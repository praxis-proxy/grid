# Mock inference providers for the west-a combined site.
#
# Install:
#   helm upgrade --install grid-mock-providers ../../../../charts/grid-mock-providers \
#     --kube-context "$REPLACE_WEST_A_CONTEXT" \
#     --namespace grid-system \
#     --values west-a-grid-mock-providers.yaml

image:
  repository: ghcr.io/praxis-proxy/grid-mock-providers
  tag: v0.2.0
  pullPolicy: IfNotPresent

providers:
  - name: a
    credentialSecret: mock-credential-a
    credentialKey: token
    env:
      MOCK_PROVIDER_SITE: "west-a"
      MOCK_QUEUE_DEPTH: "0.10"

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
