# Praxis consumer gateway values for the west-b site (combined topology).
#
# Install:
#   helm upgrade --install consumer-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$WEST_B_CONTEXT" \
#     --namespace grid-system \
#     --values west-b-consumer-gateway.yaml

fullnameOverride: consumer-gateway

image:
  repository: ghcr.io/praxis-proxy/ai
  tag: 0.4.0
  pullPolicy: IfNotPresent

praxisConfig:
  byo:
    configMapName: consumer-praxis-config
    key: praxis.yaml

overlay:
  # Name: grid-overlay-{GridNetwork name}-{gateway service name}
  configMapName: grid-overlay-example-network-consumer-gateway

grid:
  networkName: example-network
  siteName: west-b

gridIdentity:
  tlsSecretName: consumer-tls
  caSecretName: grid-ca

service:
  enabled: true
  type: ClusterIP
  port: 8080
