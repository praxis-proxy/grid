[package]
name = "operator"
description = "AI Grid Kubernetes operator for multi-site inference orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
certs = { path = "../certs" }
crdt = { path = "../crdt" }
swim = { path = "../swim" }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
scoring = { path = "../scoring" }
k8s-openapi = { workspace = true }
kube = { workspace = true }
prometheus = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Server-side rmcp features, only for the mcp_probe integration tests, which
# spin up a real Streamable HTTP MCP server to probe against.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
tower = { workspace = true }

[lints]
workspace = true
