apiVersion: grid.praxis-proxy.io/v1alpha1
kind: InferenceProvider
metadata:
  name: openai-production
spec:
  # Link to the GridNetwork
  gridNetworkRef: example

  # Provider configuration
  providerKind: open_ai
  backendKind: api_provider
  endpoint: https://api.openai.com

  # Models served
  models:
    - name: gpt-5-mini
      capabilities: ["text_generation"]

  # Authentication (requires Secret)
  auth:
    strategy: bearer_token
    secretRef:
      name: openai-api-key
      namespace: default
      key: token

  # Site selector (matches all sites)
  siteSelector:
    matchLabels: {}

  # Access policy (allow all sites)
  accessPolicy:
    siteSelector:
      matchLabels: {}

  # Health check — enable only when the provider exposes a suitable endpoint.
  # The operator sends the provider bearer token to the same-origin HTTPS
  # endpoint when auth is managed; other probes are anonymous. Non-2xx
  # responses mark the provider Degraded.
  # healthCheck:
  #   endpoint: https://provider-health.example.com
  #   path: /healthz
  #   interval: "60s"
  #   timeout: "10s"
  #   tls:
  #     caSecretRef:
  #       name: backend-ca
  #       namespace: grid-system
  #     clientCertificateSecretRef:
  #       name: client-cert
  #       namespace: grid-system

  # Omit metricsConfig because this external API has no provider-pool metrics.
