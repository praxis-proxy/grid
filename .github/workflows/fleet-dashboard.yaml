name: Fleet Dashboard

on:
  push:
    branches: [main]
    paths:
      - "fleet-dashboard/**"
      - ".github/workflows/fleet-dashboard.yaml"
  pull_request:
    paths:
      - "fleet-dashboard/**"
      - ".github/workflows/fleet-dashboard.yaml"

permissions:
  contents: read

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fleet-dashboard/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: helm lint fleet-dashboard/charts/grid-fleet-dashboard --strict
      - name: Golden templates
        run: fleet-dashboard/hack/helm-template-test.sh

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f fleet-dashboard/Containerfile -t grid-fleet-dashboard:ci .
