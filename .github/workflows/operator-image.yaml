name: Container Images

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  OPERATOR_IMAGE_NAME: ghcr.io/praxis-proxy/grid-operator
  MOCK_PROVIDERS_IMAGE_NAME: ghcr.io/praxis-proxy/grid-mock-providers
  OVERLAY_SYNC_IMAGE_NAME: ghcr.io/praxis-proxy/grid-overlay-sync

jobs:
  # ------------------------------------------------------------------------------
  # Avoid building runtime images for documentation-only pull requests.
  # ------------------------------------------------------------------------------

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.changed.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}...${GITHUB_SHA}")"
          if printf '%s\n' "${changed_files}" | grep -qvE '(^docs/|(^|/)README[^/]*$|\.md$)'; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
          else
            echo "runtime=false" >> "${GITHUB_OUTPUT}"
          fi

  # ----------------------------------------------------------------------------
  # Build the operator container image
  # ----------------------------------------------------------------------------

  operator-image:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-operator-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-operator-
          save-always: true

      - name: Build container image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -f deploy/operator/Containerfile \
            -t "${OPERATOR_IMAGE_NAME}:sha-${SHORT_SHA}" \
            .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push SHA image
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push "${OPERATOR_IMAGE_NAME}:sha-${SHORT_SHA}"

  # ----------------------------------------------------------------------------
  # Build the mock-provider container image used by the executable demos
  # ----------------------------------------------------------------------------

  mock-providers-image:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-mock-providers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-mock-providers-
          save-always: true

      - name: Build container image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -f mock-providers/Containerfile \
            -t "${MOCK_PROVIDERS_IMAGE_NAME}:sha-${SHORT_SHA}" \
            .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push SHA image
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push "${MOCK_PROVIDERS_IMAGE_NAME}:sha-${SHORT_SHA}"

  # ----------------------------------------------------------------------------
  # Build the overlay-sync sidecar container image
  # ----------------------------------------------------------------------------

  overlay-sync-image:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-overlay-sync-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-overlay-sync-
          save-always: true

      - name: Build container image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -f overlay-sync/Containerfile \
            -t "${OVERLAY_SYNC_IMAGE_NAME}:sha-${SHORT_SHA}" \
            .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push SHA image
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push "${OVERLAY_SYNC_IMAGE_NAME}:sha-${SHORT_SHA}"
