name: Triggered Integration Test

# ------------------------------------------------------------------------------
# Maintainer-triggered integration test of a Grid pull request or main branch.
#
# Runs the GLB demo against the tested revision to verify multi-cluster
# routing, SWIM discovery, mTLS, overlay hot-reload, and provider selection
# work end-to-end.
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Grid pull-request number; leave blank to test main
        required: false
        default: ""
        type: string
      mode:
        description: Demo execution mode
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

concurrency:
  group: grid-triggered-integration-${{ inputs.pr_number || 'main' }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  KIND_VERSION: v0.32.0
  KUBECTL_VERSION: v1.32.3
  # The gateway image MUST be pinned by digest for reproducible evidence.
  # To obtain the digest for a new tag:
  #   docker pull ghcr.io/praxis-proxy/grid-ai-rollup:<tag>
  #   docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/praxis-proxy/grid-ai-rollup:<tag>
  GATEWAY_IMAGE_REF: ghcr.io/praxis-proxy/grid-ai-rollup:v0.1.3
  GATEWAY_IMAGE_DIGEST: sha256:e5bdea9071f76533ab61714eeef6067c7449d0e9d811c221aa940cf3cdf9719f
  # Pinned identity/date/message-suffix for the local PR-merge reconstruction
  # in resolve-source's "Resolve source" step and glb-e2e's "Reconstruct PR
  # merge" step (see grid#66). Both jobs build a merge commit from the same
  # base_sha/head_sha pair and must produce a byte-identical SHA, which
  # requires byte-identical author/committer identity, date, and message --
  # a fixed, meaningless-but-consistent value is fine since this commit is a
  # CI-internal integrity check, never published or citable.
  MERGE_COMMIT_NAME: grid-ci-merge-check
  MERGE_COMMIT_EMAIL: grid-ci-merge-check@users.noreply.github.com
  MERGE_COMMIT_DATE: "1970-01-01T00:00:00Z"
  MERGE_COMMIT_MESSAGE_SUFFIX: grid-ci deterministic merge check

jobs:
  # ============================================================================
  # Resolve the source revision to test
  # ============================================================================

  resolve-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_kind: ${{ steps.source.outputs.source_kind }}
      source_label: ${{ steps.source.outputs.source_label }}
      tested_sha: ${{ steps.source.outputs.tested_sha }}
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      title: ${{ steps.pr.outputs.title }}
      url: ${{ steps.pr.outputs.url }}
      author: ${{ steps.pr.outputs.author }}
      draft: ${{ steps.pr.outputs.draft }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.source.outputs.base_sha }}
    steps:
      - name: Validate PR number
        if: inputs.pr_number != ''
        env:
          PR_NUM: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUM}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive decimal integer, got: '${PR_NUM}'"
            exit 1
          fi

      - name: Query PR metadata
        if: inputs.pr_number != ''
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_JSON=""
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" 2>&1) || {
            echo "::error::Failed to fetch PR #${PR_NUM} — does the PR exist?"
            echo "::error::API response: ${PR_JSON}"
            exit 1
          }

          STATE=$(echo "${PR_JSON}" | jq -r '.state')
          if [[ "${STATE}" != "open" ]]; then
            echo "::error::PR #${PR_NUM} is '${STATE}', expected 'open'"
            exit 1
          fi

          BASE_BRANCH=$(echo "${PR_JSON}" | jq -r '.base.ref')
          if [[ "${BASE_BRANCH}" != "main" ]]; then
            echo "::error::PR #${PR_NUM} targets '${BASE_BRANCH}', expected 'main'"
            exit 1
          fi

          TITLE=$(echo "${PR_JSON}" | jq -r '.title' | head -c 200 | tr -d '\n\r')
          {
            echo "pr_number=${PR_NUM}"
            echo "title=${TITLE}"
            echo "url=$(echo "${PR_JSON}" | jq -r '.html_url')"
            echo "author=$(echo "${PR_JSON}" | jq -r '.user.login')"
            echo "draft=$(echo "${PR_JSON}" | jq -r '.draft')"
            echo "head_repo=$(echo "${PR_JSON}" | jq -r '.head.repo.full_name')"
            echo "head_branch=$(echo "${PR_JSON}" | jq -r '.head.ref')"
            echo "head_sha=$(echo "${PR_JSON}" | jq -r '.head.sha')"
          } >> "${GITHUB_OUTPUT}"

          # NOTE: intentionally not capturing `.base.sha` here as the
          # verified base — GitHub only refreshes this REST field on PR
          # synchronize events (e.g. a push to the head branch), so it can
          # lag `main`'s actual tip by hours if the PR sits idle while main
          # moves forward. The base used for verification is instead
          # re-resolved live from refs/heads/main in the "Resolve source"
          # step below (see grid#66 for why that step also stopped trusting
          # GitHub's precomputed refs/pull/<n>/merge for the same reason).
          echo "${PR_JSON}" | jq '{
            number: .number,
            title: .title,
            html_url: .html_url,
            state: .state,
            draft: .draft,
            author: .user.login,
            head_repo: .head.repo.full_name,
            head_branch: .head.ref,
            head_sha: .head.sha,
            base_branch: .base.ref,
            base_sha_at_pr_query: .base.sha
          }' > source-metadata.json

          echo "::group::PR metadata"
          cat source-metadata.json
          echo "::endgroup::"

      - name: Resolve source
        id: source
        env:
          PR_NUM: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"

          if [[ -n "${PR_NUM}" ]]; then
            # Resolve refs/heads/main live instead of trusting the PR REST
            # resource's `.base.sha` (see note in "Query PR metadata"),
            # which can lag main's actual tip by hours while a PR sits idle.
            BASE_SHA=$(git ls-remote "${REPO_URL}" refs/heads/main | awk '{print $1}')
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::error::Cannot resolve refs/heads/main for base verification"
              exit 1
            fi

            # Construct the merge locally from the two pinned commit SHAs
            # instead of trusting GitHub's asynchronously-regenerated
            # refs/pull/<n>/merge: that ref is only recomputed on a push to
            # the PR branch, a merge-base change, or a 12h max-age timer,
            # and can be observed lagging main's live tip well past the
            # window either of those give (see grid#66 for a live-reproduced
            # example -- unchanged 49+ minutes after main advanced). A full
            # (unshallow) clone guarantees `git merge` can find the true
            # merge-base between base and head regardless of how far apart
            # they are; glb-e2e's "Reconstruct PR merge" step repeats this
            # exact reconstruction (same inputs, same pinned identity/date/
            # message below) to independently arrive at the identical SHA
            # this step verifies it against.
            git clone --quiet "${REPO_URL}" merge-check
            git -C merge-check fetch --quiet origin "${BASE_SHA}" "${HEAD_SHA}"
            git -C merge-check checkout --quiet "${BASE_SHA}"

            MERGE_COMMIT_MESSAGE="Merge PR #${PR_NUM} head ${HEAD_SHA} into base ${BASE_SHA} (${MERGE_COMMIT_MESSAGE_SUFFIX})"
            if ! GIT_AUTHOR_NAME="${MERGE_COMMIT_NAME}" GIT_AUTHOR_EMAIL="${MERGE_COMMIT_EMAIL}" GIT_AUTHOR_DATE="${MERGE_COMMIT_DATE}" \
                 GIT_COMMITTER_NAME="${MERGE_COMMIT_NAME}" GIT_COMMITTER_EMAIL="${MERGE_COMMIT_EMAIL}" GIT_COMMITTER_DATE="${MERGE_COMMIT_DATE}" \
                 git -C merge-check merge --no-ff --quiet -m "${MERGE_COMMIT_MESSAGE}" "${HEAD_SHA}"; then
              echo "::error::PR #${PR_NUM} (head ${HEAD_SHA}) does not merge cleanly onto main (${BASE_SHA})"
              exit 1
            fi
            MERGE_SHA=$(git -C merge-check rev-parse HEAD)

            {
              echo "source_kind=pr"
              echo "source_label=PR #${PR_NUM}"
              echo "tested_sha=${MERGE_SHA}"
              echo "checkout_sha=${BASE_SHA}"
              echo "base_sha=${BASE_SHA}"
            } >> "${GITHUB_OUTPUT}"
            echo "Resolved refs/heads/main -> ${BASE_SHA} (base)"
            echo "Constructed deterministic merge of PR #${PR_NUM} head ${HEAD_SHA} onto ${BASE_SHA} -> ${MERGE_SHA}"
          else
            MAIN_SHA=$(git ls-remote "${REPO_URL}" refs/heads/main | awk '{print $1}')
            if [[ -z "${MAIN_SHA}" ]]; then
              echo "::error::Cannot resolve refs/heads/main"
              exit 1
            fi
            {
              echo "source_kind=main"
              echo "source_label=main"
              echo "tested_sha=${MAIN_SHA}"
              echo "checkout_sha=${MAIN_SHA}"
            } >> "${GITHUB_OUTPUT}"
            echo "Resolved refs/heads/main -> ${MAIN_SHA}"
          fi

      - name: Write main metadata
        if: inputs.pr_number == ''
        run: |
          set -euo pipefail
          jq -n \
            --arg source "main" \
            --arg repository "${{ github.repository }}" \
            --arg branch "main" \
            --arg sha "${{ steps.source.outputs.tested_sha }}" \
            '{source: $source, repository: $repository, branch: $branch, sha: $sha}' \
            > source-metadata.json
          echo "::group::Source metadata"
          cat source-metadata.json
          echo "::endgroup::"

      - name: Upload source metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-metadata
          path: source-metadata.json
          retention-days: 14

  # ============================================================================
  # GLB E2E — multi-cluster GLB demo against tested Grid revision
  # ============================================================================

  glb-e2e:
    name: ${{ needs.resolve-source.outputs.source_label }} GLB E2E
    needs: resolve-source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 120
    env:
      SOURCE_KIND: ${{ needs.resolve-source.outputs.source_kind }}
      SOURCE_LABEL: ${{ needs.resolve-source.outputs.source_label }}
      TESTED_SHA: ${{ needs.resolve-source.outputs.tested_sha }}
      PR_NUMBER: ${{ needs.resolve-source.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve-source.outputs.head_sha }}
      BASE_SHA: ${{ needs.resolve-source.outputs.base_sha }}
      MODE: ${{ inputs.mode || 'quick' }}
    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout Grid at base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve-source.outputs.checkout_sha }}
          path: grid
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct PR merge
        if: needs.resolve-source.outputs.source_kind == 'pr'
        run: |
          set -euo pipefail
          REPO="${GITHUB_WORKSPACE}/grid"
          git -C "${REPO}" fetch --quiet origin "${HEAD_SHA}"

          # Must reproduce resolve-source's "Resolve source" step exactly
          # (same base_sha/head_sha, same pinned identity/date/message) so
          # the resulting commit SHA matches TESTED_SHA byte-for-byte --
          # that match is what "Verify PR merge checkout" below asserts.
          MERGE_COMMIT_MESSAGE="Merge PR #${PR_NUMBER} head ${HEAD_SHA} into base ${BASE_SHA} (${MERGE_COMMIT_MESSAGE_SUFFIX})"
          if ! GIT_AUTHOR_NAME="${MERGE_COMMIT_NAME}" GIT_AUTHOR_EMAIL="${MERGE_COMMIT_EMAIL}" GIT_AUTHOR_DATE="${MERGE_COMMIT_DATE}" \
               GIT_COMMITTER_NAME="${MERGE_COMMIT_NAME}" GIT_COMMITTER_EMAIL="${MERGE_COMMIT_EMAIL}" GIT_COMMITTER_DATE="${MERGE_COMMIT_DATE}" \
               git -C "${REPO}" merge --no-ff --quiet -m "${MERGE_COMMIT_MESSAGE}" "${HEAD_SHA}"; then
            echo "::error::Reconstructing the merge of PR #${PR_NUMBER} head ${HEAD_SHA} onto base ${BASE_SHA} failed"
            echo "::error::This mirrors resolve-source's own merge, which already succeeded earlier in this run"
            exit 1
          fi

      - name: Verify PR merge checkout
        if: needs.resolve-source.outputs.source_kind == 'pr'
        run: |
          set -euo pipefail
          REPO="${GITHUB_WORKSPACE}/grid"
          ACTUAL=$(git -C "${REPO}" rev-parse HEAD)
          PARENT_COUNT=$(git -C "${REPO}" rev-list --parents -n 1 HEAD | awk '{print NF - 1}')
          ACTUAL_BASE=$(git -C "${REPO}" rev-parse HEAD^1)
          ACTUAL_HEAD=$(git -C "${REPO}" rev-parse HEAD^2)

          echo "::group::Verified Grid source checkout"
          echo "Repository:       ${{ github.repository }}"
          echo "Requested PR:     #${PR_NUMBER}"
          echo "PR head branch:   ${{ needs.resolve-source.outputs.head_repo }}:${{ needs.resolve-source.outputs.head_branch }}"
          echo "Expected PR head: ${HEAD_SHA}"
          echo "Expected base:    ${BASE_SHA}"
          echo "Tested merge SHA: ${TESTED_SHA}"
          echo "Checked-out HEAD: ${ACTUAL}"
          echo "Merge parent 1:   ${ACTUAL_BASE} (base)"
          echo "Merge parent 2:   ${ACTUAL_HEAD} (PR head)"
          git -C "${REPO}" status --short --branch
          git -C "${REPO}" log -1 --format='Commit: %H%nParents: %P%nSubject: %s'
          echo "::endgroup::"

          if [[ "${ACTUAL}" != "${TESTED_SHA}" ]]; then
            echo "::error::Merge SHA changed between resolve and checkout"
            echo "::error::Expected ${TESTED_SHA}, got ${ACTUAL}"
            exit 1
          fi
          if [[ "${PARENT_COUNT}" -ne 2 ]]; then
            echo "::error::Expected a two-parent PR merge commit, found ${PARENT_COUNT} parent(s)"
            exit 1
          fi
          if [[ "${ACTUAL_BASE}" != "${BASE_SHA}" || "${ACTUAL_HEAD}" != "${HEAD_SHA}" ]]; then
            echo "::error::Checked-out merge does not combine the expected base and PR head"
            echo "::error::Expected parents: ${BASE_SHA} ${HEAD_SHA}"
            echo "::error::Actual parents:   ${ACTUAL_BASE} ${ACTUAL_HEAD}"
            exit 1
          fi
          if [[ "${ACTUAL}" == "${BASE_SHA}" || "${ACTUAL}" == "${HEAD_SHA}" ]]; then
            echo "::error::Checked-out commit is not the PR merge commit"
            exit 1
          fi
          echo "::notice::PASS: testing PR #${PR_NUMBER} merge ${TESTED_SHA}, containing PR head ${HEAD_SHA}; this is not main/base ${BASE_SHA}"

      - name: Verify main checkout
        if: needs.resolve-source.outputs.source_kind == 'main'
        run: |
          set -euo pipefail
          ACTUAL=$(git -C "${GITHUB_WORKSPACE}/grid" rev-parse HEAD)

          echo "::group::Verified Grid source checkout"
          echo "Source:           main"
          echo "Expected SHA:     ${TESTED_SHA}"
          echo "Checked-out HEAD: ${ACTUAL}"
          git -C "${GITHUB_WORKSPACE}/grid" log -1 --format='Commit: %H%nSubject: %s'
          echo "::endgroup::"

          if [[ "${ACTUAL}" != "${TESTED_SHA}" ]]; then
            echo "::error::Main SHA changed between resolve and checkout"
            echo "::error::Expected ${TESTED_SHA}, got ${ACTUAL}"
            exit 1
          fi
          echo "::notice::PASS: testing main at ${ACTUAL}"

      - name: Checkout demos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: praxis-proxy/demos
          ref: main
          path: praxis-demos
          persist-credentials: false

      - name: Record demos SHA
        id: demos
        run: |
          DEMOS_SHA=$(git -C "${GITHUB_WORKSPACE}/praxis-demos" rev-parse HEAD)
          echo "sha=${DEMOS_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Demos repo SHA: ${DEMOS_SHA}"

      - name: Validate immutable gateway input
        run: |
          set -euo pipefail
          if ! [[ "${GATEWAY_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::gateway_image_digest must be a sha256 digest (sha256 followed by 64 lowercase hex characters)"
            exit 1
          fi
          echo "Gateway input: ${GATEWAY_IMAGE_REF}@${GATEWAY_IMAGE_DIGEST}"

      # ----------------------------------------------------------------------
      # Toolchain
      # ----------------------------------------------------------------------

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustc --version
          cargo --version

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-triggered-e2e-${{ hashFiles('grid/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-triggered-e2e-
          save-always: true

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Install kubectl
        run: |
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          rm /tmp/kubectl /tmp/kubectl.sha256
          kubectl version --client

      - name: Verify system tools
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          openssl version
          curl --version | head -1
          jq --version

      - name: Record tool versions
        run: |
          {
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "docker=$(docker version --format '{{.Server.Version}}')"
            echo "kind=$(kind version)"
            echo "kubectl=$(kubectl version --client -o json | jq -r '.clientVersion.gitVersion')"
            echo "openssl=$(openssl version)"
            echo "curl=$(curl --version | head -1)"
            echo "jq=$(jq --version)"
            echo "os=$(uname -sr)"
            echo "runner=${{ runner.os }}-${{ runner.arch }}"
          } | tee "${GITHUB_WORKSPACE}/versions.txt"

      # ----------------------------------------------------------------------
      # Free disk space for five Kind clusters
      # ----------------------------------------------------------------------

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      # ----------------------------------------------------------------------
      # Build images from the tested Grid revision
      # ----------------------------------------------------------------------

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${TESTED_SHA:0:7}"
          if [[ "${SOURCE_KIND}" == "pr" ]]; then
            TAG="pr-${PR_NUMBER}-${SHORT_SHA}"
            ARTIFACT_PREFIX="grid-pr-${PR_NUMBER}-${SHORT_SHA}"
          else
            TAG="main-${SHORT_SHA}"
            ARTIFACT_PREFIX="grid-main-${SHORT_SHA}"
          fi
          {
            echo "tag=${TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "artifact_prefix=${ARTIFACT_PREFIX}"
          } >> "${GITHUB_OUTPUT}"
          echo "Image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Grid Operator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: grid
          file: grid/deploy/operator/Containerfile
          push: false
          load: true
          tags: grid-operator:${{ steps.tags.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
          cache-from: type=gha,scope=triggered-e2e-operator
          cache-to: type=gha,mode=max,scope=triggered-e2e-operator

      - name: Build Grid mock-providers image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: grid
          file: grid/mock-providers/Containerfile
          push: false
          load: true
          tags: grid-mock-providers:${{ steps.tags.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
          cache-from: type=gha,scope=triggered-e2e-mock-providers
          cache-to: type=gha,mode=max,scope=triggered-e2e-mock-providers

      - name: Pull pinned gateway image
        id: gateway
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cleanup_docker_auth() { docker logout ghcr.io 2>/dev/null || true; }

          PINNED_GATEWAY="${GATEWAY_IMAGE_REF}@${GATEWAY_IMAGE_DIGEST}"
          if ! docker pull "${PINNED_GATEWAY}" 2>/dev/null; then
            echo "Anonymous pull failed — attempting authenticated pull"
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap cleanup_docker_auth EXIT
            docker pull "${PINNED_GATEWAY}"
            trap - EXIT
            docker logout ghcr.io
          fi
          docker tag "${PINNED_GATEWAY}" "${GATEWAY_IMAGE_REF}"

          RESOLVED_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${GATEWAY_IMAGE_REF}" \
            | grep -oP 'sha256:[0-9a-f]+')
          echo "digest=${RESOLVED_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Resolved gateway digest: ${RESOLVED_DIGEST}"

          if [[ "${RESOLVED_DIGEST}" != "${GATEWAY_IMAGE_DIGEST}" ]]; then
            echo "::error::Gateway image digest mismatch"
            echo "::error::Expected: ${GATEWAY_IMAGE_DIGEST}"
            echo "::error::Actual:   ${RESOLVED_DIGEST}"
            exit 1
          fi
          echo "Digest verification: PASS"

      # ----------------------------------------------------------------------
      # Image verification
      # ----------------------------------------------------------------------

      - name: Verify locally built images
        env:
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          FAILED=0

          for img in "grid-operator:${TAG}" "grid-mock-providers:${TAG}"; do
            if ! docker image inspect "${img}" > /dev/null 2>&1; then
              echo "::error::Required locally-built image missing: ${img}"
              FAILED=1
              continue
            fi
            IMAGE_REVISION=$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "${img}")
            echo "${img}: revision label ${IMAGE_REVISION}"
            if [[ "${IMAGE_REVISION}" != "${TESTED_SHA}" ]]; then
              echo "::error::${img} was not built from verified source ${TESTED_SHA}"
              FAILED=1
            fi
          done

          if ! docker image inspect "${GATEWAY_IMAGE_REF}" > /dev/null 2>&1; then
            echo "::error::Pinned gateway image missing: ${GATEWAY_IMAGE_REF}"
            FAILED=1
          fi

          for img_var in GRID_XTASK_OPERATOR_IMAGE GRID_XTASK_MOCK_PROVIDER_IMAGE; do
            img_val="grid-operator:${TAG}"
            if [[ "${img_var}" == "GRID_XTASK_MOCK_PROVIDER_IMAGE" ]]; then
              img_val="grid-mock-providers:${TAG}"
            fi
            if [[ "${img_val}" =~ ^ghcr\.io/ ]] || [[ "${img_val}" =~ :v[0-9] ]] || [[ "${img_val}" =~ :latest$ ]]; then
              echo "::error::${img_var}=${img_val} appears to be a released image, not a locally-built image"
              FAILED=1
            fi
          done

          if [[ "${FAILED}" -ne 0 ]]; then
            exit 1
          fi
          echo "All required images verified"

      - name: Write image manifest
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          RESOLVED_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "=== Image Manifest ==="
            echo ""
            echo "grid-operator:${TAG}"
            docker inspect --format='  ID: {{.Id}}' "grid-operator:${TAG}"
            docker inspect --format='  Source revision: {{index .Config.Labels "org.opencontainers.image.revision"}}' "grid-operator:${TAG}"
            echo ""
            echo "grid-mock-providers:${TAG}"
            docker inspect --format='  ID: {{.Id}}' "grid-mock-providers:${TAG}"
            docker inspect --format='  Source revision: {{index .Config.Labels "org.opencontainers.image.revision"}}' "grid-mock-providers:${TAG}"
            echo ""
            echo "${GATEWAY_IMAGE_REF}  (pinned gateway — not built by Grid)"
            docker inspect --format='  ID: {{.Id}}' "${GATEWAY_IMAGE_REF}"
            echo "  Digest: ${RESOLVED_DIGEST}"
            echo ""
            echo "=== Override Environment ==="
            echo "GRID_XTASK_OPERATOR_IMAGE=grid-operator:${TAG}"
            echo "GRID_XTASK_MOCK_PROVIDER_IMAGE=grid-mock-providers:${TAG}"
            echo "GRID_XTASK_GATEWAY_IMAGE=${GATEWAY_IMAGE_REF}"
            echo "GRID_XTASK_IMAGE_PULL_POLICY=Never"
          } | tee "${GITHUB_WORKSPACE}/image-manifest.txt"

      # ----------------------------------------------------------------------
      # Prepare workspace
      # ----------------------------------------------------------------------

      - name: Download source metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-metadata
          path: ${{ github.workspace }}

      - name: Create evidence and diagnostics directories
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/evidence" "${GITHUB_WORKSPACE}/diagnostics"

      # ----------------------------------------------------------------------
      # Run GLB demo
      # ----------------------------------------------------------------------

      - name: Run GLB demo
        id: glb
        env:
          GRID_REPO: ${{ github.workspace }}/grid
          GRID_XTASK_OPERATOR_IMAGE: grid-operator:${{ steps.tags.outputs.tag }}
          GRID_XTASK_MOCK_PROVIDER_IMAGE: grid-mock-providers:${{ steps.tags.outputs.tag }}
          GRID_XTASK_GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE_REF }}
          GRID_XTASK_IMAGE_PULL_POLICY: Never
        run: |
          set -euo pipefail
          GRID_ACTUAL=$(git -C "${GRID_REPO}" rev-parse HEAD)
          if [[ "${GRID_ACTUAL}" != "${TESTED_SHA}" ]]; then
            echo "::error::Grid checkout changed before demo: expected ${TESTED_SHA}, got ${GRID_ACTUAL}"
            exit 1
          fi
          if [[ "${SOURCE_KIND}" == "pr" ]]; then
            echo "::notice::Demo will build xtask/forge from PR merge ${GRID_ACTUAL}, not main/base ${BASE_SHA}"
          else
            echo "::notice::Demo will build xtask/forge from main at ${GRID_ACTUAL}"
          fi
          echo "Grid source:    ${GRID_REPO} (${SOURCE_LABEL})"
          echo "Operator image: ${GRID_XTASK_OPERATOR_IMAGE} (revision ${TESTED_SHA})"
          echo "Mock image:     ${GRID_XTASK_MOCK_PROVIDER_IMAGE} (revision ${TESTED_SHA})"
          echo "Gateway image:  ${GRID_XTASK_GATEWAY_IMAGE}@${GATEWAY_IMAGE_DIGEST}"
          cd "${GITHUB_WORKSPACE}/praxis-demos/demos/grid-glb-demo"
          ./run.sh "--${MODE}" --teardown --keep-on-failure \
            --evidence-dir "${GITHUB_WORKSPACE}/evidence/glb" \
            2>&1 | tee "${GITHUB_WORKSPACE}/run-glb.log"
          echo "result=success" >> "${GITHUB_OUTPUT}"

      # ----------------------------------------------------------------------
      # Diagnostics (always, even on failure)
      # ----------------------------------------------------------------------

      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          DIAG="${GITHUB_WORKSPACE}/diagnostics"
          mkdir -p "${DIAG}" "${GITHUB_WORKSPACE}/evidence"

          echo "::group::Kind clusters"
          kind get clusters > "${DIAG}/kind-clusters.txt" 2>&1 || echo "(none)" > "${DIAG}/kind-clusters.txt"
          cat "${DIAG}/kind-clusters.txt"
          echo "::endgroup::"

          for cluster in $(kind get clusters 2>/dev/null); do
            CTX="kind-${cluster}"
            CDIR="${DIAG}/${cluster}"
            mkdir -p "${CDIR}/logs"

            echo "::group::Diagnostics: ${cluster}"

            kubectl --context "${CTX}" get nodes -o wide \
              > "${CDIR}/nodes.txt" 2>&1 || true

            kubectl --context "${CTX}" get pods -A -o wide \
              > "${CDIR}/pods.txt" 2>&1 || true

            kubectl --context "${CTX}" get deployments -A -o wide \
              > "${CDIR}/deployments.txt" 2>&1 || true

            kubectl --context "${CTX}" get statefulsets -A -o wide \
              > "${CDIR}/statefulsets.txt" 2>&1 || true

            kubectl --context "${CTX}" get daemonsets -A -o wide \
              > "${CDIR}/daemonsets.txt" 2>&1 || true

            kubectl --context "${CTX}" get services -A -o wide \
              > "${CDIR}/services.txt" 2>&1 || true

            kubectl --context "${CTX}" get events -A --sort-by='.lastTimestamp' \
              > "${CDIR}/events.txt" 2>&1 || true

            kubectl --context "${CTX}" get configmaps -A \
              > "${CDIR}/configmaps.txt" 2>&1 || true

            # Grid CRDs
            for crd in gridnetworks gridsites inferenceproviders; do
              kubectl --context "${CTX}" get "${crd}" -A -o yaml \
                > "${CDIR}/${crd}.yaml" 2>&1 || true
            done

            # Pod logs from all namespaces (GLB gateway, provider, operator,
            # metallb, and system pods are spread across several namespaces).
            for ns in $(kubectl --context "${CTX}" get namespaces \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              mkdir -p "${CDIR}/logs/${ns}"
              for pod in $(kubectl --context "${CTX}" get pods -n "${ns}" \
                -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                kubectl --context "${CTX}" logs -n "${ns}" "${pod}" \
                  --all-containers --tail=2000 \
                  > "${CDIR}/logs/${ns}/${pod}.log" 2>&1 || true
              done
            done

            # Cluster info dump (sanitized)
            kubectl --context "${CTX}" cluster-info dump \
              --output-directory="${CDIR}/cluster-info" 2>&1 || true
            if [[ -d "${CDIR}/cluster-info" ]]; then
              find "${CDIR}/cluster-info" \
                \( -name "*.key" -o -name "*.pem" -o -name "*.crt" \
                   -o -name "*.cer" -o -name "*.p12" -o -name "*.pfx" \
                   -o -name "*.jks" -o -name "*secret*" \
                   -o -name "*credential*" -o -name "*token*" \) \
                -type f -exec rm -f {} + 2>/dev/null || true
            fi

            echo "::endgroup::"
          done

          echo "::group::Docker state"
          docker images > "${DIAG}/docker-images.txt" 2>&1 || true
          docker ps -a > "${DIAG}/docker-containers.txt" 2>&1 || true
          echo "::endgroup::"

          DEMO_DIR="${GITHUB_WORKSPACE}/praxis-demos/demos/grid-glb-demo"
          if [[ -d "${DEMO_DIR}/.forge" ]]; then
            cp -r "${DEMO_DIR}/.forge" "${DIAG}/forge-output" 2>/dev/null || true
            find "${DIAG}/forge-output" \
              \( -name "*.key" -o -name "*.pem" -o -name "*.crt" \
                 -o -name "*.cer" -o -name "*.p12" -o -name "*.pfx" \
                 -o -name "*.jks" -o -name "*secret*" \
                 -o -name "*credential*" -o -name "*token*" \) \
              -type f -exec rm -f {} + 2>/dev/null || true
          fi

          if [[ -d "${DEMO_DIR}/.forge/evidence" ]]; then
            cp -r "${DEMO_DIR}/.forge/evidence" \
              "${GITHUB_WORKSPACE}/evidence/forge" 2>/dev/null || true
          fi

          echo "Diagnostics collection complete"

      - name: Remove sensitive diagnostic content
        if: always()
        run: |
          set -euo pipefail

          # File-name filtering above does not catch PEM or credential material
          # embedded in logs, YAML, JSON, or ConfigMap output. Remove any file
          # containing recognizable private keys, certificates, or bearer tokens
          # before the artifact upload. Do not print matching content.
          for root in "${GITHUB_WORKSPACE}/diagnostics" "${GITHUB_WORKSPACE}/evidence"; do
            [[ -d "${root}" ]] || continue
            while IFS= read -r -d '' file; do
              if grep -aEq -- \
                '-----BEGIN ([A-Z0-9 ]+ )?(PRIVATE KEY|CERTIFICATE)-----|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{16,}|(client[_-]?secret|private[_-]?key|access[_-]?token)[[:space:]]*:[[:space:]]*[^[:space:]}]{16,}' \
                "${file}"; then
                echo "::warning::Removing sensitive diagnostic file: ${file#"${GITHUB_WORKSPACE}"/}"
                rm -f -- "${file}"
              fi
            done < <(find "${root}" -type f -print0)
          done

          echo "Sensitive diagnostic content scan complete"

      # ----------------------------------------------------------------------
      # Artifact upload
      # ----------------------------------------------------------------------

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.tags.outputs.artifact_prefix || 'grid-unknown' }}-glb-${{ env.MODE }}
          path: |
            ${{ github.workspace }}/evidence/
            ${{ github.workspace }}/diagnostics/
            ${{ github.workspace }}/run-glb.log
            ${{ github.workspace }}/image-manifest.txt
            ${{ github.workspace }}/source-metadata.json
            ${{ github.workspace }}/versions.txt
          retention-days: 14
          if-no-files-found: warn

      # ----------------------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------------------

      - name: Delete Kind clusters
        id: cleanup
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          CLEANUP_RESULT="success"

          for cluster in $(kind get clusters 2>/dev/null); do
            case "${cluster}" in
              grid-glb-*)
                echo "Deleting cluster: ${cluster}"
                if ! kind delete cluster --name "${cluster}"; then
                  echo "::warning::Failed to delete Kind cluster '${cluster}'"
                  CLEANUP_RESULT="partial"
                fi
                ;;
              *)
                echo "Skipping unrelated cluster: ${cluster}"
                ;;
            esac
          done

          for net in $(docker network ls --filter name=kind --format '{{.Name}}' 2>/dev/null); do
            case "${net}" in
              kind-grid-glb-*|grid-glb-*)
                docker network rm "${net}" 2>/dev/null || true
                ;;
            esac
          done

          rm -rf /tmp/kind-grid-glb-* 2>/dev/null || true

          echo "result=${CLEANUP_RESULT}" >> "${GITHUB_OUTPUT}"
          echo "Cleanup: ${CLEANUP_RESULT}"

      # ----------------------------------------------------------------------
      # Job summary
      # ----------------------------------------------------------------------

      - name: Write job summary
        if: always()
        env:
          TAG: ${{ steps.tags.outputs.tag || 'unknown' }}
          ARTIFACT_PREFIX: ${{ steps.tags.outputs.artifact_prefix || 'grid-unknown' }}
          DEMOS_SHA: ${{ steps.demos.outputs.sha || 'unknown' }}
          GLB_RESULT: ${{ steps.glb.outputs.result || 'not-reached' }}
          CLEANUP_RESULT: ${{ steps.cleanup.outputs.result || 'unknown' }}
          RESOLVED_DIGEST: ${{ steps.gateway.outputs.digest || 'unknown' }}
          PR_TITLE: ${{ needs.resolve-source.outputs.title }}
          PR_URL: ${{ needs.resolve-source.outputs.url }}
          PR_AUTHOR: ${{ needs.resolve-source.outputs.author }}
          PR_DRAFT: ${{ needs.resolve-source.outputs.draft }}
        run: |
          case "${GLB_RESULT}" in
            success) GLB_DISPLAY="success" ;;
            failure) GLB_DISPLAY="failure" ;;
            *) GLB_DISPLAY="${GLB_RESULT}" ;;
          esac

          {
            echo "## Triggered Integration Test: GLB Demo"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Source** | ${SOURCE_LABEL} |"
            echo "| **Tested SHA** | \`${TESTED_SHA}\` |"

            if [[ "${SOURCE_KIND}" == "pr" ]]; then
              echo "| **PR Title** | ${PR_TITLE} |"
              echo "| **PR URL** | ${PR_URL} |"
              echo "| **PR Author** | ${PR_AUTHOR} |"
              echo "| **Draft** | ${PR_DRAFT} |"
              echo "| **Head SHA** | \`${HEAD_SHA}\` |"
              echo "| **Base SHA** | \`${BASE_SHA}\` |"
              echo "| **Source verification** | PR merge verified; not base/main |"
            else
              echo "| **Source verification** | Main SHA verified |"
            fi

            echo "| **Demos SHA** | \`${DEMOS_SHA}\` |"
            echo "| **Mode** | \`${MODE}\` |"
            echo "| **GLB result** | ${GLB_DISPLAY} |"
            echo "| **Cleanup** | ${CLEANUP_RESULT} |"
            echo ""
            echo "### Images"
            echo ""
            echo "| Image | Reference |"
            echo "|-------|-----------|"
            echo "| Grid Operator | \`grid-operator:${TAG}\` |"
            echo "| Mock Providers | \`grid-mock-providers:${TAG}\` |"
            echo "| Gateway (pinned) | \`${GATEWAY_IMAGE_REF}\` (\`${RESOLVED_DIGEST}\`) |"
            echo ""
            echo "### Artifact"
            echo ""
            echo "\`${ARTIFACT_PREFIX}-glb-${MODE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
