name: Tests

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_RUSTFMT: nightly-2026-03-28

jobs:
  # ------------------------------------------------------------------------------
  # Skip the Rust jobs for documentation-only pull requests.
  # ------------------------------------------------------------------------------

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.changed.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}...${GITHUB_SHA}")"
          if grep -qvE '(^docs/|(^|/)README[^/]*$|\.md$)' <<<"${changed_files}"; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
          else
            echo "runtime=false" >> "${GITHUB_OUTPUT}"
          fi

  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy + machete)
  # ----------------------------------------------------------------------------

  lint:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly rustfmt
        run: rustup toolchain install "$NIGHTLY_RUSTFMT" --profile minimal --component rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint
        run: make lint

      - name: Check generated API types match the spec
        run: make codegen-check

      - name: Check CRD manifests match the Rust CRD types
        run: make crds-check

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check Go API types match the CRD schemas
        run: make go-types-check

      # The generator renders the chart with helm and splits it with yq; pin both so the
      # check does not follow the runner image.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize

      - name: Check generated manifests and cloud overlays
        run: make deploy-check

  # ----------------------------------------------------------------------------
  # Unit tests
  # ----------------------------------------------------------------------------

  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The enrollment store tests run against a real database, the store production uses.
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          # Test-only credential for this disposable CI database; not a production secret.
          POSTGRES_PASSWORD: test
          POSTGRES_DB: enrollment
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ENROLLMENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/enrollment
      ENROLLMENT_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit tests
        run: make test-unit

  # ----------------------------------------------------------------------------
  # FIPS build (operator + overlay-sync under system OpenSSL)
  # ----------------------------------------------------------------------------

  fips:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fips feature dynamically links libssl/libcrypto.
      - name: Install system OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --manifest-path: overlay-sync resolves as its own workspace, so
      # -p ... --features is rejected. Scope to lib+bins (operator has a lib,
      # overlay-sync is bin-only) to skip the test-only ServerName warnings in
      # operator tls_probe.rs.
      - name: Clippy (fips)
        run: |
          cargo clippy -p certs --no-default-features --features fips --all-targets -- -D warnings
          cargo clippy -p enrollment --no-default-features --features fips --all-targets -- -D warnings
          cargo clippy -p enrollment --no-default-features --features fips,sar,bootstrap --bins -- -D warnings
          cargo clippy --manifest-path crates/operator/Cargo.toml --no-default-features --features fips --lib --bins -- -D warnings
          cargo clippy --manifest-path crates/overlay-sync/Cargo.toml --no-default-features --features fips --bins -- -D warnings

      - name: Unit tests (fips)
        run: |
          cargo test -p certs --no-default-features --features fips
          cargo test -p enrollment --no-default-features --features fips
          cargo test -p enrollment --no-default-features --features fips,sar,bootstrap --bins
          cargo test --manifest-path crates/operator/Cargo.toml --no-default-features --features fips
          cargo test --manifest-path crates/overlay-sync/Cargo.toml --no-default-features --features fips

      # fips must exclude rustls: TLS routes through system OpenSSL. ring stays
      # present at the operator level (swim gossip), outside the TLS boundary, so
      # it is asserted per-crate for certs, not operator-wide.
      # Asserted on the printed tree, not on `-i rustls` exiting non-zero: that
      # matches a declared-but-inactive optional dependency, and exits 0 either
      # way on a current cargo. The openssl check is the positive control that
      # the matcher can see a crate that really is linked.
      - name: Assert fips build excludes rustls
        run: |
          set -eu
          for m in crates/operator/Cargo.toml crates/overlay-sync/Cargo.toml; do
            tree="$(cargo tree --manifest-path "$m" --no-default-features --features fips -e normal --target all --prefix none --format '{p}')"
            if printf '%s\n' "$tree" | grep -qE '^rustls '; then
              echo "fips build of $m unexpectedly links rustls" >&2
              exit 1
            fi
            printf '%s\n' "$tree" | grep -qE '^openssl ' || {
              echo "positive control failed: openssl is not in the $m fips tree" >&2
              exit 1
            }
          done
          echo "no rustls in fips builds"

      # certs is the crypto identity crate: its fips build must carry no ring and
      # no sha2 (EVP keygen/sign, no rcgen, x509-parser verify off, OpenSSL EVP
      # digest). Match on tree content, not exit code: certs' own dev-deps keep
      # both in the resolve, so `-i` exits 0 even when no non-dev edge reaches them.
      - name: Assert fips build of certs excludes ring and sha2
        run: |
          for pkg in ring sha2; do
            if cargo tree -p certs --no-default-features --features fips -e no-dev 2>/dev/null | grep -q "$pkg v"; then
              echo "fips build of certs unexpectedly links $pkg"
              cargo tree -p certs --no-default-features --features fips -e no-dev -i "$pkg"
              exit 1
            fi
          done
          echo "no ring or sha2 in certs fips build"

      # enrollment is the production CA signer: its fips build routes TLS (listener
      # and Postgres transport), keygen/signing, RNG, and the token digest through
      # system openssl, so it carries no ring and no rustls. sqlx-postgres still
      # links sha2/md-5 for Postgres password auth, unused under client-cert auth.
      # Also checked with sar,bootstrap, the shipped image features, which pull kube.
      # Proves a FIPS build is possible; it does not mean a FIPS image ships.
      # Capture the tree so a cargo failure aborts the step instead of passing on
      # empty output, and require openssl so an empty tree cannot pass.
      - name: Assert fips build of enrollment excludes ring, rustls and aws-lc-rs
        run: |
          for features in fips fips,sar,bootstrap; do
            tree=$(cargo tree --locked -p enrollment --no-default-features --features "$features" -e no-dev)
            grep -qE "(^|[ ─])openssl v" <<<"$tree" || { echo "enrollment build with $features has no openssl"; exit 1; }
            for pkg in ring rustls aws-lc-rs aws-lc-sys aws-lc-fips-sys; do
              if grep -qE "(^|[ ─])$pkg v" <<<"$tree"; then
                echo "enrollment build with $features unexpectedly links $pkg"
                cargo tree -p enrollment --no-default-features --features "$features" -e no-dev -i "$pkg"
                exit 1
              fi
            done
          done
          echo "no ring, rustls or aws-lc-rs in enrollment fips builds"

      # The default image build (sar,bootstrap) uses ring; kube's rustls must not add aws-lc-rs.
      - name: Assert enrollment image build excludes aws-lc-rs
        run: |
          tree=$(cargo tree --locked -p enrollment --features sar,bootstrap -e normal)
          grep -qE "(^|[ ─])kube-client v" <<<"$tree" || { echo "enrollment build with sar,bootstrap has no kube-client"; exit 1; }
          for pkg in aws-lc-rs aws-lc-sys aws-lc-fips-sys; do
            if grep -qE "(^|[ ─])$pkg v" <<<"$tree"; then
              echo "enrollment build with sar,bootstrap unexpectedly links $pkg"
              cargo tree -p enrollment --features sar,bootstrap -e normal -i "$pkg"
              exit 1
            fi
          done
          echo "no aws-lc-rs in enrollment image build"

      # A vendored openssl (openssl-src) statically links a NON-validated module while
      # every ring/rustls assertion above still passes, silently breaking FIPS. The
      # openssl crate must link the system libssl/libcrypto, so openssl-src must be
      # absent from every fips build.
      - name: Assert fips builds link no vendored openssl
        run: |
          for pkg in certs enrollment; do
            if cargo tree -p "$pkg" --no-default-features --features fips -e no-dev 2>/dev/null | grep -q 'openssl-src'; then
              echo "fips build of $pkg unexpectedly vendors openssl (openssl-src)"
              exit 1
            fi
          done
          for m in crates/operator/Cargo.toml crates/overlay-sync/Cargo.toml; do
            if cargo tree --manifest-path "$m" --no-default-features --features fips -e no-dev 2>/dev/null | grep -q 'openssl-src'; then
              echo "fips build of $m unexpectedly vendors openssl (openssl-src)"
              exit 1
            fi
          done
          echo "no vendored openssl in fips builds"
