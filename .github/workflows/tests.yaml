name: Tests

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_RUSTFMT: nightly-2026-03-28

jobs:
  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy + machete)
  # ----------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly rustfmt
        run: rustup toolchain install "$NIGHTLY_RUSTFMT" --profile minimal --component rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-cargo-
          save-always: true

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint
        run: make lint

      - name: Check generated API types match the spec
        run: make codegen-check

  # ----------------------------------------------------------------------------
  # Unit tests
  # ----------------------------------------------------------------------------

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-cargo-
          save-always: true

      - name: Unit tests
        run: make test-unit

  # ----------------------------------------------------------------------------
  # FIPS build (operator + overlay-sync under system OpenSSL)
  # ----------------------------------------------------------------------------

  fips:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fips feature dynamically links libssl/libcrypto.
      - name: Install system OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.96.0-cargo-fips-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-cargo-fips-
          save-always: true

      # --manifest-path: overlay-sync resolves as its own workspace, so
      # -p ... --features is rejected. Scope to lib+bins (operator has a lib,
      # overlay-sync is bin-only) to skip the test-only ServerName warnings in
      # operator tls_probe.rs.
      - name: Clippy (fips)
        run: |
          cargo clippy -p certs --no-default-features --features fips --all-targets -- -D warnings
          cargo clippy -p enrollment --no-default-features --features fips --all-targets -- -D warnings
          cargo clippy --manifest-path operator/Cargo.toml --no-default-features --features fips --lib --bins -- -D warnings
          cargo clippy --manifest-path overlay-sync/Cargo.toml --no-default-features --features fips --bins -- -D warnings

      - name: Unit tests (fips)
        run: |
          cargo test -p certs --no-default-features --features fips
          cargo test -p enrollment --no-default-features --features fips
          cargo test --manifest-path operator/Cargo.toml --no-default-features --features fips
          cargo test --manifest-path overlay-sync/Cargo.toml --no-default-features --features fips

      # fips must exclude rustls: TLS routes through system OpenSSL. ring stays
      # present at the operator level (swim gossip), outside the TLS boundary, so
      # it is asserted per-crate for certs, not operator-wide.
      - name: Assert fips build excludes rustls
        run: |
          for m in operator/Cargo.toml overlay-sync/Cargo.toml; do
            if cargo tree --manifest-path "$m" --no-default-features --features fips -e normal -i rustls >/dev/null 2>&1; then
              echo "fips build of $m unexpectedly links rustls"
              exit 1
            fi
          done
          echo "no rustls in fips builds"

      # certs is the crypto identity crate: its fips build must carry no ring and
      # no sha2 (EVP keygen/sign, no rcgen, x509-parser verify off, OpenSSL EVP
      # digest). Match on tree content, not exit code: certs' own dev-deps keep
      # both in the resolve, so `-i` exits 0 even when no non-dev edge reaches them.
      - name: Assert fips build of certs excludes ring and sha2
        run: |
          for pkg in ring sha2; do
            if cargo tree -p certs --no-default-features --features fips -e no-dev 2>/dev/null | grep -q "$pkg v"; then
              echo "fips build of certs unexpectedly links $pkg"
              cargo tree -p certs --no-default-features --features fips -e no-dev -i "$pkg"
              exit 1
            fi
          done
          echo "no ring or sha2 in certs fips build"

      # enrollment is the production CA signer: its fips build routes TLS (listener
      # and Postgres transport), keygen/signing, RNG, and the token digest through
      # system openssl, so it carries no ring and no rustls. sqlx-postgres still
      # links sha2/md-5 for Postgres password auth, unused under client-cert auth.
      - name: Assert fips build of enrollment excludes ring and rustls
        run: |
          for pkg in ring rustls; do
            if cargo tree -p enrollment --no-default-features --features fips -e no-dev 2>/dev/null | grep -q "$pkg v"; then
              echo "fips build of enrollment unexpectedly links $pkg"
              cargo tree -p enrollment --no-default-features --features fips -e no-dev -i "$pkg"
              exit 1
            fi
          done
          echo "no ring or rustls in enrollment fips build"

      # A vendored openssl (openssl-src) statically links a NON-validated module while
      # every ring/rustls assertion above still passes, silently breaking FIPS. The
      # openssl crate must link the system libssl/libcrypto, so openssl-src must be
      # absent from every fips build.
      - name: Assert fips builds link no vendored openssl
        run: |
          for pkg in certs enrollment; do
            if cargo tree -p "$pkg" --no-default-features --features fips -e no-dev 2>/dev/null | grep -q 'openssl-src'; then
              echo "fips build of $pkg unexpectedly vendors openssl (openssl-src)"
              exit 1
            fi
          done
          for m in operator/Cargo.toml overlay-sync/Cargo.toml; do
            if cargo tree --manifest-path "$m" --no-default-features --features fips -e no-dev 2>/dev/null | grep -q 'openssl-src'; then
              echo "fips build of $m unexpectedly vendors openssl (openssl-src)"
              exit 1
            fi
          done
          echo "no vendored openssl in fips builds"
