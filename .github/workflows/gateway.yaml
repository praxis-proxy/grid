name: Gateway

# ------------------------------------------------------------------------------
# The gateway is its own Cargo workspace (gateway/Cargo.toml), so the root
# Tests/Supply Chain jobs (cargo ... --workspace, cargo audit, cargo deny at the
# root) do not cover gateway/src. This workflow keeps the gateway workspace under
# the same fmt/clippy/test/audit/deny gates, scoped to gateway/** so it only runs
# when the gateway changes.
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yaml'
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_RUSTFMT: nightly-2026-03-28

jobs:
  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy + machete), gateway workspace
  # ----------------------------------------------------------------------------

  gateway-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly rustfmt
        run: rustup toolchain install "$NIGHTLY_RUSTFMT" --profile minimal --component rustfmt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gateway -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Clippy
        run: cargo clippy --manifest-path gateway/Cargo.toml --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo +"$NIGHTLY_RUSTFMT" fmt --manifest-path gateway/Cargo.toml --all -- --check

      - name: Machete (unused dependencies)
        run: cargo machete gateway

      # The binary's TLS must come from the OpenSSL provider Praxis installs, so ring stays test-only.
      # openssl-sys is the positive control: an empty or failed tree must not pass.
      - name: No ring in the gateway binary
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --manifest-path gateway/Cargo.toml -p gateway -e normal --target all --prefix none --format '{p}')
          grep -q '^openssl-sys ' <<<"$tree" || { echo "positive control failed: openssl-sys is not in the tree"; exit 1; }
          if grep '^ring ' <<<"$tree"; then echo "ring is in the gateway's normal dependency tree"; exit 1; fi

  # ----------------------------------------------------------------------------
  # Unit tests, gateway workspace
  # ----------------------------------------------------------------------------

  gateway-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gateway -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit tests
        run: cargo test --manifest-path gateway/Cargo.toml

  # ----------------------------------------------------------------------------
  # Security audit, gateway lockfile
  # ----------------------------------------------------------------------------

  gateway-security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-audit

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --file gateway/Cargo.lock

  # ----------------------------------------------------------------------------
  # License & dependency check, gateway workspace (root deny.toml policy)
  # ----------------------------------------------------------------------------

  gateway-dependency-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-deny

      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny --manifest-path gateway/Cargo.toml --config gateway/deny.toml check
