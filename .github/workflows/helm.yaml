      #   id: cargo-sources
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ${{ runner.temp }}/cargo-sources
      #     key: ${{ steps.cargo-cache.outputs.sources }}-${{ steps.cargo-cache.outputs.source-revision }}-${{ matrix.name }}
      #     restore-keys: |
      #       ${{ steps.cargo-cache.outputs.sources }}-
      #
      # - name: Restore Cargo downloads (PRs and merge queue)
      #   if: github.ref != 'refs/heads/main'
      #   uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ${{ runner.temp }}/cargo-sources
      #     key: ${{ steps.cargo-cache.outputs.sources }}-${{ steps.cargo-cache.outputs.source-revision }}-${{ matrix.name }}
      #     restore-keys: |
      #       ${{ steps.cargo-cache.outputs.sources }}-
      #
      # # Target artifacts must match the image's Alpine toolchain and workspace.
      # # A new key per commit lets immutable GHA caches retain source build updates.
      # - name: Cache Cargo target (main)
