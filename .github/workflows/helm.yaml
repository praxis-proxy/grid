      #     TOOLCHAIN: ${{ hashFiles(matrix.file, 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'crates/gateway/Cargo.toml') }}
      #     LOCKFILES: ${{ hashFiles('Cargo.lock', 'crates/gateway/Cargo.lock') }}
      #   run: |
      #     echo "sources=helm-cargo-sources-v1-${PLATFORM}-${LOCKFILES}" >> "${GITHUB_OUTPUT}"
      #     echo "source-revision=${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
      #     echo "target=helm-cargo-target-v1-${PLATFORM}-${IMAGE}-${CARGO_PROFILE}-${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"
      #     echo "locked-target=helm-cargo-target-v1-${PLATFORM}-${IMAGE}-${CARGO_PROFILE}-${TOOLCHAIN}-${LOCKFILES}" >> "${GITHUB_OUTPUT}"
      #
      # # Each image writes a distinct key; fallback shares downloads across images.
      # # Register saves before cache-dance so its post step extracts mounts first.
      # - name: Cache Cargo downloads (main)
