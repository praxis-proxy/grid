name: Helm

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  HELM_VERSION: v3.17.3
  KIND_VERSION: v0.32.0
  KUBECONFORM_VERSION: 0.6.7
  # v1.x's plugin.yaml uses the platformCommand/platformHooks manifest
  # schema, which the pinned Helm v3.17.3 cannot load. v0.8.2 is the last
  # release using the command/hooks schema Helm 3.17 supports.
  HELM_UNITTEST_VERSION: v0.8.2
  HELM_SHA256: ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
  # The charts' documented floor (Helm >= 3.12).
  HELM_FLOOR_VERSION: v3.12.3
  HELM_FLOOR_SHA256: 1b2313cd198d45eab00cc37c38f6b1ca0a948ba279c29e322bdf426d406129b5
  # Informational Helm 4 leg only. Helm 4 refuses unsigned plugins, so it
  # installs the helm-unittest release tarball pinned by digest.
  HELM4_UNITTEST_VERSION: 1.1.2
  HELM4_UNITTEST_SHA256: f3f6e4bcfbb73bf573434444af4ea506caaeb6f71dbb9891b499758574dd3161

jobs:
  # ------------------------------------------------------------------------------
  # Avoid building runtime images for documentation-only pull requests.
  # ------------------------------------------------------------------------------

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.changed.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}...${GITHUB_SHA}")"
          if grep -qvE '(^docs/|(^|/)README[^/]*$|\.md$)' <<<"${changed_files}"; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
          else
            echo "runtime=false" >> "${GITHUB_OUTPUT}"
          fi

  # ----------------------------------------------------------------------------
  # Static chart validation (lint, template, schema, CRD sync, package)
  # ----------------------------------------------------------------------------

  validate:
    name: validate (helm ${{ matrix.helm }}${{ matrix.informational && ', informational' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The charts support Helm 3 only; the Helm 4 leg reports forward
    # compatibility and never fails the run.
    continue-on-error: ${{ matrix.informational == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v3.17.3
          - helm: v3.12.3
          - helm: v4.3.0
            informational: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c
          tar xz -C /usr/local/bin kubeconform < /tmp/kubeconform.tar.gz
          rm /tmp/kubeconform.tar.gz
          kubeconform -v

      - name: Install helm-unittest
        env:
          HELM: ${{ matrix.helm }}
        run: |
          if [[ "${HELM}" == v3.* ]]; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"
          else
            curl -fsSL -o /tmp/unittest.tgz \
              "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM4_UNITTEST_VERSION}/unittest-${HELM4_UNITTEST_VERSION}.tgz"
            echo "${HELM4_UNITTEST_SHA256}  /tmp/unittest.tgz" | sha256sum -c
            helm plugin install /tmp/unittest.tgz --verify=false
          fi

      - name: Chart template unit tests
        run: |
          mapfile -t charts < <(find charts -mindepth 2 -maxdepth 2 -name tests -type d -printf '%h\n' | sort)
          helm unittest "${charts[@]}"

      - name: Managed-cluster lifecycle templates
        run: |
          python3 -m venv /tmp/grid-policy-tests
          /tmp/grid-policy-tests/bin/pip install 'PyYAML==6.0.3'
          /tmp/grid-policy-tests/bin/python charts/grid-enrollment/tests/managed_clusters_test.py

      - name: Validate charts (static)
        env:
          RENDER_DIR: ${{ runner.temp }}/helm-rendered
        run: ./scripts/verify-helm-chart.sh

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          for chart in charts/grid-operator charts/praxis-gateway; do
            echo "--- Validating $chart ---"
            EXTRA_ARGS=()
            if [ "$chart" = "charts/praxis-gateway" ]; then
              EXTRA_ARGS=(--set praxisConfig.byo.configMapName=schema-check --set image.tag=v0.1.0-ci)
            fi
            helm template validate-schema "$chart" --namespace grid-system "${EXTRA_ARGS[@]}" \
              | kubeconform -strict -kubernetes-version 1.30.0 -skip CustomResourceDefinition -summary
          done
          echo "--- Validating charts/praxis-gateway (standalone, no values) ---"
          helm template validate-schema charts/praxis-gateway --namespace praxis \
            | kubeconform -strict -kubernetes-version 1.30.0 -summary

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifests-${{ matrix.helm }}
          path: ${{ runner.temp }}/helm-rendered/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Build each image once per commit; every kind job loads it from an artifact.
  # Artifacts work for fork PRs, which cannot push to a registry. Only main
  # writes the image layer cache, so a PR cannot seed caches main reads.
  # ----------------------------------------------------------------------------

  images:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE: dev
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: operator, file: deploy/operator/Containerfile}
          - {name: gateway, file: deploy/gateway/Containerfile}
          - {name: enrollment, file: deploy/enrollment/Containerfile}
          - {name: mock-providers, file: crates/mock-providers/Containerfile}
          - {name: overlay-sync, file: crates/overlay-sync/Containerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Temporarily disabled until the organization Actions allowlist permits:
      # reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
      # Once allowed, uncomment the Cargo cache steps below.
      # - name: Define Cargo cache keys
      #   id: cargo-cache
      #   env:
      #     PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      #     IMAGE: ${{ matrix.name }}
