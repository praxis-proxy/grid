      #   id: cargo-target
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ${{ runner.temp }}/cargo-target
      #     key: ${{ steps.cargo-cache.outputs.locked-target }}-${{ github.sha }}
      #     restore-keys: |
      #       ${{ steps.cargo-cache.outputs.locked-target }}-
      #       ${{ steps.cargo-cache.outputs.target }}-
      #
      # - name: Restore Cargo target (PRs and merge queue)
      #   if: github.ref != 'refs/heads/main'
      #   uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: ${{ runner.temp }}/cargo-target
      #     key: ${{ steps.cargo-cache.outputs.locked-target }}-${{ github.sha }}
      #     restore-keys: |
      #       ${{ steps.cargo-cache.outputs.locked-target }}-
      #       ${{ steps.cargo-cache.outputs.target }}-
      #
      # # The GHA layer exporter omits RUN cache mounts; persist them separately.
      # # Keep cache data and scratch files outside the whole-tree build context.
      # - name: Inject Cargo downloads into BuildKit
      #   uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      #   with:
      #     builder: ${{ steps.buildx.outputs.name }}
      #     cache-map: |
      #       {
      #         "${{ runner.temp }}/cargo-sources/registry": "/usr/local/cargo/registry",
      #         "${{ runner.temp }}/cargo-sources/git": "/usr/local/cargo/git"
      #       }
      #     scratch-dir: ${{ runner.temp }}/cargo-sources-dance
      #     skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.cargo-sources.outputs.cache-hit == 'true' }}
      #
      # - name: Inject Cargo target into BuildKit
      #   uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      #   with:
      #     builder: ${{ steps.buildx.outputs.name }}
      #     cache-map: |
      #       {
      #         "${{ runner.temp }}/cargo-target": "${{ matrix.name == 'gateway' && '/src/crates/gateway/target' || '/src/target' }}"
      #       }
      #     scratch-dir: ${{ runner.temp }}/cargo-target-dance
      #     skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.cargo-target.outputs.cache-hit == 'true' }}
      #

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          push: false
          tags: ghcr.io/praxis-proxy/grid-${{ matrix.name }}:ci
          outputs: type=docker,dest=/tmp/grid-${{ matrix.name }}.tar
          cache-from: type=gha,scope=img-${{ matrix.name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=img-{0}', matrix.name) || '' }}

      - name: Upload ${{ matrix.name }} image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: /tmp/grid-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Publish the tested images as sha-<short> tags. Push and dispatch only: this is
  # the one job with packages:write, and it runs no build steps.
  # ----------------------------------------------------------------------------

  publish:
    needs: [images, kind, kind-enrollment, kind-local-membership, kind-hub-site, upgrade]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push sha-<short> tags
        run: |
          for name in operator gateway enrollment mock-providers overlay-sync; do
            docker load -i "/tmp/images/grid-${name}.tar"
            ref="ghcr.io/praxis-proxy/grid-${name}"
            docker tag "${ref}:ci" "${ref}:sha-${GITHUB_SHA::7}"
            docker push "${ref}:sha-${GITHUB_SHA::7}"
          done

  # ----------------------------------------------------------------------------
  # Kind chart lifecycle test (install/upgrade/uninstall wiring with pause:3.9;
  # real Praxis runtime behavior is proven by gateway-standalone and the GLB demo)
  # ----------------------------------------------------------------------------

  kind:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      # Every image the kind path installs, as the hub-site legs download them. The operator
      # alone was not enough: the enrollment chart then installed its published default, which
      # on a release branch is a tag that does not exist yet, so its pods waited out a pull
      # that could not succeed and the job hung on helm test.
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for name in operator enrollment; do
            docker load -i "/tmp/images/grid-${name}.tar"
          done

      - name: Run Kind lifecycle tests
        run: |
          KIND=1 GRID_IMAGE_TAG=ci ./scripts/verify-helm-chart.sh

      - name: Verify cert-manager enrollment and CA retention
        run: bash charts/grid-enrollment/tests/cert-manager-e2e.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-test-logs
          path: /tmp/helm-kind-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Chart upgrade: install from the base ref, `helm upgrade` to this commit;
  # CRDs and CRs must survive. 3.17.3 adopts CRDs with --take-ownership; the
  # 3.12 floor predates the flag and runs the documented manual adoption.
  # ----------------------------------------------------------------------------

  upgrade:
    name: upgrade (helm ${{ matrix.helm }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {helm: v3.17.3, take_ownership: "1"}
          - {helm: v3.12.3, take_ownership: "0"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        env:
          HELM: ${{ matrix.helm }}
        run: |
          case "${HELM}" in
            "${HELM_VERSION}") sha="${HELM_SHA256}" ;;
            "${HELM_FLOOR_VERSION}") sha="${HELM_FLOOR_SHA256}" ;;
            *) echo "no pinned digest for ${HELM}"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM}-linux-amd64.tar.gz"
          echo "${sha}  /tmp/helm.tgz" | sha256sum -c
          tar xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind

      - name: Run chart upgrade e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          TAKE_OWNERSHIP: ${{ matrix.take_ownership }}
        run: |
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MQ_BASE}" ;;
            *) base="${PUSH_BEFORE}" ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD^)"; fi
          BASE_REF="${base}" KEEP=1 CLUSTER=grid-helm-upgrade ./scripts/e2e-helm-upgrade.sh

      - name: Export Kind logs
        if: failure()
        run: kind export logs /tmp/helm-upgrade-logs --name grid-helm-upgrade || true

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-upgrade-logs-${{ matrix.helm }}
          path: /tmp/helm-upgrade-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # The upstream CLI must accept Grid's actual topology files from any cwd.
  # ----------------------------------------------------------------------------

  forge-configs:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      - name: Cache pinned Forge installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools/forge
          key: forge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/forge-revision', 'scripts/forge.sh', 'rust-toolchain.toml') }}

      - name: Install pinned upstream Forge
        run: ./scripts/forge.sh install
      - name: Check out the retired Grid CLI baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: praxis-proxy/grid
          ref: a4a7d7168ec36e59f31bcb9be0d11d6dd69c4974
          path: target/forge-baseline-source
          persist-credentials: false
      - name: Build the retired Grid CLI
        run: cargo build --locked --manifest-path target/forge-baseline-source/Cargo.toml --target-dir target/forge-baseline-build -p forge --bin praxis-forge
      - name: Compare both CLIs against every topology from two directories
        env:
          FORGE_BASELINE_BIN: ${{ github.workspace }}/target/forge-baseline-build/debug/praxis-forge
        run: ./scripts/check-forge-topologies.sh
      - name: Install Kind for migration lifecycle checks
        run: |
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: Verify state migration and lifecycle compatibility
        env:
          FORGE_BASELINE_BIN: ${{ github.workspace }}/target/forge-baseline-build/debug/praxis-forge
        run: ./scripts/check-forge-lifecycle.sh
      - name: Upload Forge compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-compatibility
          path: target/forge-compatibility/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Standalone praxis-gateway e2e: Forge brings up a Kind cluster with no Grid
  # components, installs the chart with no values, reconfigures it several
  # ways, and checks real requests through Praxis after every change.
  # ----------------------------------------------------------------------------

  gateway-standalone:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache pinned Forge installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools/forge
          key: forge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/forge-revision', 'scripts/forge.sh', 'rust-toolchain.toml') }}

      - name: Install pinned upstream Forge
        run: ./scripts/forge.sh install

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Run the standalone gateway e2e through Forge
        run: ./scripts/e2e-praxis-gateway.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-standalone-e2e
          path: |
            target/forge/praxis-gateway-standalone/verify.log
            target/forge/praxis-gateway-standalone/diagnostics/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Enrollment e2e: helm reproducibility plus the real enroll flow (mint, CSR,
  # signed cert with the pinned SPIFFE name), against the deployed service.
  # ----------------------------------------------------------------------------

  kind-enrollment:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        authz: [local, kube]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Download enrollment image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-enrollment
          path: /tmp/images

      - name: Load enrollment image
        run: docker load -i /tmp/images/grid-enrollment.tar

      - name: Run enrollment e2e (helm reproducibility and the enroll flow)
        env:
          AUTHZ: ${{ matrix.authz }}
        run: |
          IMAGE_REPO=ghcr.io/praxis-proxy/grid-enrollment IMAGE_TAG=ci \
            ./scripts/e2e-enrollment.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrollment-e2e-logs-${{ matrix.authz }}
          path: /tmp/helm-kind-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Hub and site install e2e: forge creates a hub and a site cluster, helm
  # installs the grid, then SWIM, mTLS serving, peer trust, and log health.
  # ----------------------------------------------------------------------------

  # Local membership with its records delivered from outside the grid, which is what an Open
  # Cluster Management hub does on a real fleet. The leg applies the records itself rather
  # than running OCM, so this proves the grid's side of that contract and not the delivery
  # mechanism. A leg that runs OCM is separate and much slower.
  kind-local-membership:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Download operator image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-operator
          path: /tmp/images

      - name: Load operator image
        run: docker load -i /tmp/images/grid-operator.tar

      - name: Run the delivered-records e2e (records applied as OCM would deliver them)
        run: |
          IMAGE_REPO=ghcr.io/praxis-proxy/grid-operator IMAGE_TAG=ci \
            ./scripts/e2e-acm-path.sh

      - name: Export cluster logs
        if: failure()
        run: |
          for site in east west; do
            kind export logs "/tmp/local-membership-logs/${site}" --name "grid-acm-${site}" || true
          done

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-membership-logs
          path: /tmp/local-membership-logs/
          if-no-files-found: ignore
          retention-days: 5

  kind-hub-site:
    name: kind-hub-site (${{ matrix.leg }})
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - peer-trust-mode: pin
            leg: pin, rotation off
          - peer-trust-mode: spiffe
            leg: spiffe, certificate rotation
          - peer-trust-mode: spiffe
            hub-router: operator
            leg: spiffe, operator gridSiteRoute
          - peer-trust-mode: pin
            ha: "1"
            leg: pin, HA faults
          - peer-trust-mode: local
            leg: Local membership, no SWIM seed
          - peer-trust-mode: pin
            signed-state: enforce
            leg: pin, signed state
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache pinned Forge installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools/forge
          key: forge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/forge-revision', 'scripts/forge.sh', 'rust-toolchain.toml') }}

      - name: Install pinned upstream Forge
        run: ./scripts/forge.sh install

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for name in operator gateway enrollment; do
            docker load -i "/tmp/images/grid-${name}.tar"
          done

      - name: Check the HA verdicts against synthetic logs
        if: matrix.ha
        run: ./scripts/e2e-hub-site.sh selftest

      - name: Run hub and site e2e (${{ matrix.leg }})
        env:
          MODES: ${{ matrix.peer-trust-mode }}
          HUB_ROUTER: ${{ matrix.hub-router || 'render' }}
          HA: ${{ matrix.ha || '0' }}
          SIGNED_STATE: ${{ matrix.signed-state || 'off' }}
          GRID_FEEDBACK_CONTRACT_TEST: ${{ matrix.peer-trust-mode == 'pin' && '1' || '0' }}
          # The spiffe leg rotates 8 minute identities; pin trust does not rotate.
          ROTATION_LIFETIME: "480"
          SKIP_BUILD: "1"
          IMAGE_PREFIX: ghcr.io/praxis-proxy/grid-
          IMAGE_TAG: ci
          ARTIFACTS: /tmp/grid-hub-site-e2e
        run: ./scripts/e2e-hub-site.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-site-e2e-logs-${{ matrix.peer-trust-mode }}${{ matrix.hub-router && format('-{0}', matrix.hub-router) || '' }}${{ matrix.ha && '-ha' || '' }}-${{ matrix.signed-state || 'off' }}
          path: /tmp/grid-hub-site-e2e/
          if-no-files-found: ignore
          retention-days: 5
