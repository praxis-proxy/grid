name: Helm

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  HELM_VERSION: v3.17.3
  KIND_VERSION: v0.32.0
  KUBECONFORM_VERSION: 0.6.7
  # v1.x's plugin.yaml uses the platformCommand/platformHooks manifest
  # schema, which the pinned Helm v3.17.3 cannot load. v0.8.2 is the last
  # release using the command/hooks schema Helm 3.17 supports.
  HELM_UNITTEST_VERSION: v0.8.2
  HELM_SHA256: ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
  # The charts' documented floor (Helm >= 3.12).
  HELM_FLOOR_VERSION: v3.12.3
  HELM_FLOOR_SHA256: 1b2313cd198d45eab00cc37c38f6b1ca0a948ba279c29e322bdf426d406129b5
  # Informational Helm 4 leg only. Helm 4 refuses unsigned plugins, so it
  # installs the helm-unittest release tarball pinned by digest.
  HELM4_UNITTEST_VERSION: 1.1.2
  HELM4_UNITTEST_SHA256: f3f6e4bcfbb73bf573434444af4ea506caaeb6f71dbb9891b499758574dd3161

jobs:
  # ------------------------------------------------------------------------------
  # Avoid building runtime images for documentation-only pull requests.
  # ------------------------------------------------------------------------------

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.changed.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}...${GITHUB_SHA}")"
          if grep -qvE '(^docs/|(^|/)README[^/]*$|\.md$)' <<<"${changed_files}"; then
            echo "runtime=true" >> "${GITHUB_OUTPUT}"
          else
            echo "runtime=false" >> "${GITHUB_OUTPUT}"
          fi

  # ----------------------------------------------------------------------------
  # Static chart validation (lint, template, schema, CRD sync, package)
  # ----------------------------------------------------------------------------

  validate:
    name: validate (helm ${{ matrix.helm }}${{ matrix.informational && ', informational' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The charts support Helm 3 only; the Helm 4 leg reports forward
    # compatibility and never fails the run.
    continue-on-error: ${{ matrix.informational == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v3.17.3
          - helm: v3.12.3
          - helm: v4.3.0
            informational: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c
          tar xz -C /usr/local/bin kubeconform < /tmp/kubeconform.tar.gz
          rm /tmp/kubeconform.tar.gz
          kubeconform -v

      - name: Install helm-unittest
        env:
          HELM: ${{ matrix.helm }}
        run: |
          if [[ "${HELM}" == v3.* ]]; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"
          else
            curl -fsSL -o /tmp/unittest.tgz \
              "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM4_UNITTEST_VERSION}/unittest-${HELM4_UNITTEST_VERSION}.tgz"
            echo "${HELM4_UNITTEST_SHA256}  /tmp/unittest.tgz" | sha256sum -c
            helm plugin install /tmp/unittest.tgz --verify=false
          fi

      - name: Chart template unit tests
        run: |
          mapfile -t charts < <(find charts -mindepth 2 -maxdepth 2 -name tests -type d -printf '%h\n' | sort)
          helm unittest "${charts[@]}"

      - name: Validate charts (static)
        run: ./scripts/verify-helm-chart.sh

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          for chart in charts/grid-operator charts/praxis-gateway; do
            echo "--- Validating $chart ---"
            EXTRA_ARGS=()
            if [ "$chart" = "charts/praxis-gateway" ]; then
              EXTRA_ARGS=(--set config.existingConfigMap=schema-check --set image.tag=v0.1.0-ci)
            fi
            helm template validate-schema "$chart" --namespace grid-system "${EXTRA_ARGS[@]}" \
              | kubeconform -strict -kubernetes-version 1.30.0 -skip CustomResourceDefinition -summary
          done

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-manifests-${{ matrix.helm }}
          path: /tmp/helm-rendered-*.yaml
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Build each image once per commit; every kind job loads it from an artifact.
  # Artifacts work for fork PRs, which cannot push to a registry. Only main
  # writes the layer cache, so a PR cannot seed layers that main reads.
  # ----------------------------------------------------------------------------

  images:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: operator, file: deploy/operator/Containerfile}
          - {name: gateway, file: deploy/gateway/Containerfile}
          - {name: enrollment, file: deploy/enrollment/Containerfile}
          - {name: mock-providers, file: mock-providers/Containerfile}
          - {name: overlay-sync, file: overlay-sync/Containerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ghcr.io/praxis-proxy/grid-${{ matrix.name }}:ci
          outputs: type=docker,dest=/tmp/grid-${{ matrix.name }}.tar
          cache-from: type=gha,scope=img-${{ matrix.name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=img-{0}', matrix.name) || '' }}

      - name: Upload ${{ matrix.name }} image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: /tmp/grid-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Publish the tested images as sha-<short> tags. Push and dispatch only: this is
  # the one job with packages:write, and it runs no build steps.
  # ----------------------------------------------------------------------------

  publish:
    needs: [images, kind, kind-enrollment, kind-hub-site, upgrade]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push sha-<short> tags
        run: |
          for name in operator gateway enrollment mock-providers overlay-sync; do
            docker load -i "/tmp/images/grid-${name}.tar"
            ref="ghcr.io/praxis-proxy/grid-${name}"
            docker tag "${ref}:ci" "${ref}:sha-${GITHUB_SHA::7}"
            docker push "${ref}:sha-${GITHUB_SHA::7}"
          done

  # ----------------------------------------------------------------------------
  # Kind chart lifecycle test (install/upgrade/uninstall wiring with pause:3.9;
  # real Praxis runtime behavior is proven by the GLB demo)
  # ----------------------------------------------------------------------------

  kind:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Download operator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-operator
          path: /tmp/images

      - name: Load operator image
        run: docker load -i /tmp/images/grid-operator.tar

      - name: Run Kind lifecycle tests
        run: |
          KIND=1 GRID_OPERATOR_CI_TAG=ci ./scripts/verify-helm-chart.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-test-logs
          path: /tmp/helm-kind-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Chart upgrade: install from the base ref, `helm upgrade` to this commit;
  # CRDs and CRs must survive. 3.17.3 adopts CRDs with --take-ownership; the
  # 3.12 floor predates the flag and runs the documented manual adoption.
  # ----------------------------------------------------------------------------

  upgrade:
    name: upgrade (helm ${{ matrix.helm }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {helm: v3.17.3, take_ownership: "1"}
          - {helm: v3.12.3, take_ownership: "0"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        env:
          HELM: ${{ matrix.helm }}
        run: |
          case "${HELM}" in
            "${HELM_VERSION}") sha="${HELM_SHA256}" ;;
            "${HELM_FLOOR_VERSION}") sha="${HELM_FLOOR_SHA256}" ;;
            *) echo "no pinned digest for ${HELM}"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM}-linux-amd64.tar.gz"
          echo "${sha}  /tmp/helm.tgz" | sha256sum -c
          tar xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind

      - name: Run chart upgrade e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          TAKE_OWNERSHIP: ${{ matrix.take_ownership }}
        run: |
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MQ_BASE}" ;;
            *) base="${PUSH_BEFORE}" ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD^)"; fi
          BASE_REF="${base}" KEEP=1 CLUSTER=grid-helm-upgrade ./scripts/e2e-helm-upgrade.sh

      - name: Export Kind logs
        if: failure()
        run: kind export logs /tmp/helm-upgrade-logs --name grid-helm-upgrade || true

      - name: Upload Kind logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-upgrade-logs-${{ matrix.helm }}
          path: /tmp/helm-upgrade-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Enrollment e2e: helm reproducibility plus the real enroll flow (mint, CSR,
  # signed cert with the pinned SPIFFE name), against the deployed service.
  # ----------------------------------------------------------------------------

  kind-enrollment:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        authz: [local, kube]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Download enrollment image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-enrollment
          path: /tmp/images

      - name: Load enrollment image
        run: docker load -i /tmp/images/grid-enrollment.tar

      - name: Run enrollment e2e (helm reproducibility and the enroll flow)
        env:
          AUTHZ: ${{ matrix.authz }}
        run: |
          IMAGE_REPO=ghcr.io/praxis-proxy/grid-enrollment IMAGE_TAG=ci \
            ./scripts/e2e-enrollment.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enrollment-e2e-logs-${{ matrix.authz }}
          path: /tmp/helm-kind-logs/
          if-no-files-found: ignore
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Hub and site install e2e: forge creates a hub and a site cluster, helm
  # installs the grid, then SWIM, mTLS serving, peer trust, and log health.
  # ----------------------------------------------------------------------------

  kind-hub-site:
    needs: [changes, images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        peer-trust-mode: [pin, spiffe]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm /tmp/kind
          kind version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      # Per-job key, dependencies only; PRs restore main's cache and never save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build forge
        run: cargo build -p forge --bin praxis-forge

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for name in operator gateway enrollment; do
            docker load -i "/tmp/images/grid-${name}.tar"
          done

      - name: Run hub and site install e2e
        env:
          MODES: ${{ matrix.peer-trust-mode }}
          SKIP_BUILD: "1"
          IMAGE_PREFIX: ghcr.io/praxis-proxy/grid-
          IMAGE_TAG: ci
          FORGE_BIN: ${{ github.workspace }}/target/debug/praxis-forge
          ARTIFACTS: /tmp/grid-hub-site-e2e
        run: ./scripts/e2e-hub-site.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-site-e2e-logs-${{ matrix.peer-trust-mode }}
          path: /tmp/grid-hub-site-e2e/
          if-no-files-found: ignore
          retention-days: 5
