openapi: 3.1.0
info:
  title: Grid Enrollment API
  version: 1.0.0
  description: |
    Lets an inference provider join a grid.

    A grid-admin mints a single-use token that pins a site name. The site
    presents the token and a certificate signing request and receives a signed
    certificate, the grid CA certificate, and an enrollment id in the same
    response. There is no approval queue and no request lifecycle.

    The grid assigns the name. The token pins it at mint, so a request only
    carries a signing request and cannot name itself. Enrollment grants an
    identity and nothing else.
  contact:
    name: AI Grid
    url: https://github.com/praxis-proxy/grid
servers:
  - url: https://grid.example/enrollment/v1alpha1
    description: A grid's enrollment endpoint.

tags:
  - name: enrollment
    description: Redeeming a token for a grid identity.
  - name: administration
    description: Minting and revoking tokens. Requires a grid-admin credential.

paths:
  /enrollmenttokens:
    post:
      operationId: mintEnrollmentToken
      tags: [administration]
      summary: Mint a single-use enrollment token
      description: |
        Mints a one-time token that pins a site name. The token is returned
        once; only its digest is stored. Minting is not self-service. A name
        holds at most one live token, and a name an enrollment holds cannot be
        minted, so revoke the outstanding token or delete the enrollment first.
      security:
        - gridAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentTokenRequest'
      responses:
        '201':
          description: The minted token, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            An enrollment holds the name (name_taken), its enrollment was
            deleted and allowDeletedName is not set (name_deleted), or an
            unredeemed, unexpired token already pins it (token_outstanding).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /enrollmenttokens/{tokenId}:
    delete:
      operationId: revokeEnrollmentToken
      tags: [administration]
      summary: Revoke an unredeemed token
      description: |
        Revokes a token that has not been redeemed, a kill switch for one that
        leaked. A redeemed token's row stays as issuance provenance, so revoking
        it reports not found.
      security:
        - gridAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /enrollments:
    post:
      operationId: enroll
      tags: [enrollment]
      summary: Redeem a token for a certificate
      description: |
        Redeems a single-use token, presented in the Authorization Bearer
        header, together with a certificate signing request. Returns the signed
        certificate, the grid CA certificate, and an enrollment id. The token is
        spent if and only if the certificate is issued.
      security:
        - siteTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: The issued certificate and the grid CA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The token is missing, unknown, expired, or already redeemed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The pinned name is already held by an issued member (name_taken), or
            the signing request's key was enrolled before (key_reused); the
            token stays unspent. The name's enrollment was deleted and the token
            does not opt in (name_deleted); that spends the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /enrollments/{siteName}:
    get:
      operationId: getEnrollment
      tags: [administration]
      summary: Read a site's enrollment
      description: |
        The enrollment record that holds a site name, to diagnose a rotation
        refusal or a freeze. Key digests only, never key material.
      security:
        - gridAdminAuth: []
      parameters:
        - name: siteName
          in: path
          required: true
          description: The site name the enrollment holds.
          schema:
            type: string
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No enrollment holds that site name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteEnrollment
      tags: [administration]
      summary: Delete a site's enrollment
      description: |
        Deletes the enrollment record that holds a site name. The site can no
        longer rotate, and its current certificate stays valid until it expires.
        The name is recorded as deleted: enrolling it again takes a token minted
        with allowDeletedName. Every key the name enrolled stays refused under
        any name. This is also how a site frozen after a rotation fork recovers,
        with a new key. A reserved name's record comes from the enrollment
        bootstrap and is refused here.
      security:
        - gridAdminAuth: []
      parameters:
        - name: siteName
          in: path
          required: true
          description: The site name the enrollment holds.
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No enrollment holds that site name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The name is reserved for the enrollment bootstrap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rotations:
    post:
      operationId: rotate
      tags: [enrollment]
      summary: Rotate a site identity with its current certificate
      description: |
        The site authenticates over mutual TLS with its current, unexpired grid
        certificate and submits a signing request for a new key. Returns a new
        certificate for the name the presented certificate carries. No token is
        involved. A name with no enrollment record, a key that is not the site's
        current one, or a request for any key ever enrolled is refused. A grid
        with rotations turned off refuses every rotation with 503.
      security:
        - siteCertificateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '200':
          description: The rotated certificate and the grid CA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: No client certificate, or one this grid did not issue to a site or that is outside its validity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The enrollment record does not admit this certificate's key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Rotation is turned off for this grid (rotation_disabled). Issued certificates stay valid until they expire.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    gridAdminAuth:
      type: http
      scheme: bearer
      description: A grid-admin credential. Minting and revoking are not self-service.
    siteTokenAuth:
      type: http
      scheme: bearer
      description: A single-use site token, minted by a grid-admin.
    siteCertificateAuth:
      type: mutualTLS
      description: The site's current grid certificate, presented in the TLS handshake.

  parameters:
    TokenId:
      name: tokenId
      in: path
      required: true
      description: Identifier returned when the token was minted.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was malformed or the signing request unusable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No credential, or one that is not accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but not permitted the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such outstanding token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    EnrollmentTokenRequest:
      type: object
      description: What a grid-admin submits to mint a token.
      required: [siteName, gridNetworkRef]
      properties:
        siteName:
          type: string
          description: |
            The name the token pins. The grid-admin chooses it, so the site
            never names itself.
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        gridNetworkRef:
          type: string
          description: The grid the site joins.
          minLength: 1
          maxLength: 253
        expiresInSecs:
          type: integer
          description: |
            How long the token stays usable, in seconds. A default applies when
            unset. An explicit value must be greater than zero and at most
            604800 (seven days).
          minimum: 1
          maximum: 604800
        allowDeletedName:
          type: boolean
          default: false
          description: |
            Lets the token enroll a name whose enrollment a grid-admin deleted.
            Without it, a deleted name is refused at mint and at enroll. Keys
            the deleted enrollment held stay refused either way. Setting it also
            needs the right to delete enrollments.

    EnrollmentToken:
      type: object
      description: |
        The token a grid-admin hands to a site. Returned once, at mint; only its
        digest is stored after that.
      required: [tokenId, token, siteName, expiresAt]
      properties:
        tokenId:
          type: string
          format: uuid
          description: Identifier, for revoking the token before it is redeemed.
        token:
          type: string
          description: The one-time token, presented once at enroll.
        siteName:
          type: string
          description: The name the token pins.
        expiresAt:
          type: string
          format: date-time
          description: When the token stops being usable.

    EnrollmentRequest:
      type: object
      description: |
        What a site submits to enroll: a certificate signing request and nothing
        else. The token pins the name, so a submission cannot assert one.
      required: [csr]
      properties:
        csr:
          type: string
          description: |
            PKCS#10 certificate signing request, PEM encoded. The private key
            stays with the requester and is never sent. The key must be an EC
            key on P-256 or P-384.
          maxLength: 16384

    Enrollment:
      type: object
      description: The certificate issued to a site, returned inline from enroll.
      required: [id, certificate, caCertificate, spiffeId, publicKeySha256]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The issued-enrollment row identifier. Additive: a future retrieval or
            idempotent-replay lookup can key on it.
        certificate:
          type: string
          description: The issued certificate, PEM encoded.
        caCertificate:
          type: string
          description: |
            The grid CA certificate, PEM encoded. Returned with the leaf so a
            site holds the trust anchor without a separate fetch.
        spiffeId:
          type: string
          description: |
            The name the grid assigned, carried as a URI SAN on the certificate.
          examples: ['spiffe://grid.internal/site/site-d']
        publicKeySha256:
          type: string
          description: |
            Lowercase hex SHA-256 over the request's public key.
          pattern: '^[0-9a-f]{64}$'

    EnrollmentStatus:
      type: object
      description: A site's enrollment record. Digests only, never key material.
      required: [siteName, id, state, publicKeySha256, incarnationStartedAt, reserved]
      properties:
        siteName:
          type: string
          description: The site name the record holds.
        id:
          type: string
          format: uuid
          description: The record identifier.
        state:
          type: string
          enum: [active, frozen]
          description: |
            frozen after a rotation fork. A frozen site cannot rotate until a
            grid-admin deletes its enrollment and it enrolls again.
        publicKeySha256:
          type: string
          description: Lowercase hex SHA-256 of the key the latest issued certificate carries.
        previousPublicKeySha256:
          type: [string, 'null']
          description: The key that one replaced, which may only retry a lost rotation.
        incarnationStartedAt:
          type: string
          format: date-time
          description: When this record began, at enrollment or a bootstrap seed reset.
        rotatedAt:
          type: [string, 'null']
          format: date-time
          description: When the record last took a new key, by rotation or a bootstrap seed. Null if it never has.
        notAfter:
          type: [string, 'null']
          format: date-time
          description: |
            When the latest certificate this service issued expires. Null for a
            reserved name's bootstrap certificate until its first rotation.
        reserved:
          type: boolean
          description: A name bootstrap issues, such as the hub's.
    Error:
      type: object
      description: |
        A failure, described so a caller can act on it. Clients act on the HTTP
        status and treat an unrecognized code by its status class, so codes can
        be added without breaking them. Retry after a 503 or a 408, waiting for
        Retry-After when present, and stop on 401 and 403.

        | Code | Status | Meaning |
        |---|---|---|
        | invalid_csr | 400 | The signing request does not parse or verify, or its key is not EC P-256 or P-384. |
        | invalid_site_name | 400 | The site name is not a DNS label. |
        | invalid_token_ttl | 400 | The token lifetime is out of range. |
        | missing_grid_network | 400 | The token request names no grid. |
        | unauthorized | 401 | No grid-admin credential, or one not accepted. |
        | invalid_token | 401 | The site token is unknown, spent, or expired. |
        | identity_required | 401 | Rotation needs the site's current grid certificate. |
        | forbidden | 403 | The grid-admin may not perform the action. |
        | identity_refused | 403 | The record does not admit this certificate, or the site is frozen. |
        | not_found | 404 | No such token or enrollment. |
        | timeout | 408 | The request ran past the server's limit. |
        | name_taken | 409 | Another enrollment holds the site name. |
        | reserved_site | 409 | The name is the enrollment bootstrap's. |
        | token_outstanding | 409 | A live token already pins the site name. |
        | name_deleted | 409 | The name's enrollment was deleted; mint with allowDeletedName. |
        | key_reused | 409 | The signing request's key was enrolled before. |
        | internal | 500 | The service could not complete the request. |
        | rotation_disabled | 503 | Rotation is turned off for the grid. Issued certificates stay valid. |
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code, from the table above.
          enum:
            - invalid_csr
            - invalid_site_name
            - invalid_token_ttl
            - missing_grid_network
            - unauthorized
            - invalid_token
            - identity_required
            - forbidden
            - identity_refused
            - not_found
            - timeout
            - name_taken
            - reserved_site
            - token_outstanding
            - name_deleted
            - key_reused
            - internal
            - rotation_disabled
        message:
          type: string
          description: What went wrong, and what would fix it.
