apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: production
spec:
  membership:
    mode: Swim
    swim:
      seeds:
        - site-a.example.com:7946
        - site-b.example.com:7946
  selectionPolicy:
    mode: roundRobin
  scoringPolicy:
    strategy: queueDepth
  peerTrust:
    mode: pin
  tls:
    caSecretRef:
      name: grid-ca
      namespace: grid-system
    siteSecretRef:
      name: grid-site-cert
      namespace: grid-system
