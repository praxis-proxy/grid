[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
  # Temporary acceptance of unmaintained notices, not a vulnerability waiver.
  # chrono is transitive through schema/MCP/query dependencies; no patched
  # version is listed. Migration: https://github.com/praxis-proxy/grid/issues/604
  { id = "RUSTSEC-2026-0543", reason = "chrono is transitively required; all versions unmaintained; migration tracked in grid#604" },
  # bincode 2.x is unmaintained (RUSTSEC-2025-0141); SWIM uses it
  # directly for broadcasts, and foca also requires it for membership messages.
  { id = "RUSTSEC-2025-0141", reason = "SWIM and foca require bincode 2.x; no compatible upstream fix" },
  # chrono is transitive through Kubernetes, PromQL, and MCP dependencies.
  # The advisory marks every version unmaintained and provides no safe upgrade.
  { id = "RUSTSEC-2026-0543", reason = "transitive chrono dependency; no safe upgrade available" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# foca uses MPL-2.0; allowed as a scoped exception rather than globally
# permitting copyleft licenses.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "foca"
version = "*"

# typify's code-generation backend uses MPL-2.0 version-ranges. Keep the
# permission scoped to this dependency rather than allowing MPL globally.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "version-ranges"
version = "=0.1.3"

# typify's JSON Schema resolver uses this MIT No Attribution dependency.
[[licenses.exceptions]]
allow = ["MIT-0"]
name = "borrow-or-share"
version = "=0.2.4"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
