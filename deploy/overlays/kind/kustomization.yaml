apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generated from charts/grid-operator by scripts/generate-deployment-operator.sh.
# Objects carry their namespaces: one RoleBinding lives outside grid-system.

resources:
  - namespace.yaml
  - clusterrole-crd.yaml
  - clusterrole-metrics-scraper.yaml
  - clusterrole-resources.yaml
  - clusterrolebinding-crd.yaml
  - clusterrolebinding-metrics-scraper.yaml
  - deployment.yaml
  - role-metrics-scraper-token.yaml
  - rolebinding-metrics-scraper-token.yaml
  - rolebinding-resources-default.yaml
  - rolebinding-resources.yaml
  - service-metrics.yaml
  - service-swim.yaml
  - serviceaccount-metrics-scraper.yaml
  - serviceaccount.yaml

labels:
  - pairs:
      app.kubernetes.io/name: grid-operator
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/version: "v0.2.2"
