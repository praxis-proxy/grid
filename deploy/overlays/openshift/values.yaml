# The OpenShift flavor of deploy/operator: a delta on deploy/operator/values.yaml.
# Metrics TLS from the service CA, and a NetworkPolicy that admits the platform's
# monitoring namespaces to the metrics port.
metrics:
  tls:
    source: serviceCA
networkPolicy:
  enabled: true
# AWS load balancer annotations on every OpenShift install: the default AWS load balancer
# carries no UDP, and other clouds ignore the aws- annotations, so no cloud detection is needed.
platform: aws
