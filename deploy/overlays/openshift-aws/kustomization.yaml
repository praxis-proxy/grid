apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../openshift

patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: grid-operator-swim
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: grid-operator-signals
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
