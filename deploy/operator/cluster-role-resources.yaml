apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-operator-resources
  labels:
    app.kubernetes.io/managed-by: grid-operator
rules:
  # ── Secrets (namespaced) ────────────────────────────────────────────
  #
  # Read paths:
  #   - TLS site certificate (tls.crt, tls.key for mTLS client auth)
  #   - SWIM encryption key (swimKeyRef)
  #   - Credential Secrets (existence + key validation only)
  #   - Metrics TLS CA and client certificate Secrets
  #
  # Write paths:
  #   - Grid CA certificate Secret (ca.crt, ca.key)
  #   - Grid site certificate Secret (tls.crt, tls.key)
  #
  # The operator reads Secrets by explicit namespace/name during
  # reconciliation — no cluster-wide list or watch.  TLS material
  # rotation is detected by bounded requeue (60s for TLS-configured
  # providers).
  #
  # All writes use server-side apply (patch).  SSA on a non-existent
  # resource requires create permission, so both create and patch are
  # granted.  The namespace for each Secret is declared in the CRD
  # spec (SecretRef.namespace).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]

  # ── Services (namespaced) ───────────────────────────────────────────
  #
  # Read paths:
  #   - Provider gateway LoadBalancer Service (self-discovery of the
  #     external address advertised via SWIM state broadcast)
  #
  # Only get is required; no write, list, or watch.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

  # ── Events (namespaced) ────────────────────────────────────────────
  #
  # Write paths:
  #   - Kubernetes Events emitted by the GridSite controller on
  #     phase transitions and gateway probe state changes.
  #
  # Only create and patch are required (initial publish and series
  # deduplication).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # ── ConfigMaps (namespaced) ─────────────────────────────────────────
  #
  # Write paths:
  #   - Routing overlay ConfigMap (grid-overlay-{network}-{gateway})
  #   - Consumer Praxis config ConfigMap (consumerConfig.configMapName)
  #   - SWIM revision reservation (read and resourceVersion update)
  #
  # Overlay/config writes use server-side apply. The revision reservation uses
  # get plus update so concurrent starts receive a resourceVersion conflict
  # instead of reusing a published revision range.
  # The namespace is the GatewayRef namespace declared in the
  # GridNetwork spec.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
