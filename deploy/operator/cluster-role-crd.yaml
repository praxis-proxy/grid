apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-operator-crd
  labels:
    app.kubernetes.io/managed-by: grid-operator
rules:
  # ── Grid CRDs (cluster-scoped) ──────────────────────────────────────
  #
  # The operator watches the Grid CRD types via kube-rs Controller::new
  # (requires list + watch).  It reads individual resources with get and
  # writes spec and status via server-side apply (patch).  Auto-discovery
  # of SWIM peers requires create + update on gridsites, and delete to
  # collect auto-discovered ones gone past staleCandidateTtlSeconds.
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoolproviders
      - gridnetworks
      - inferenceproviders
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - gridsites
    verbs: ["get", "list", "watch", "patch", "create", "update", "delete"]

  # Status subresources are authorized separately.
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoolproviders/status
      - gridnetworks/status
      - gridsites/status
      - inferenceproviders/status
    verbs: ["get", "patch"]
