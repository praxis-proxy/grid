apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-operator
  namespace: grid-system
  labels:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/managed-by: grid-operator
spec:
  replicas: 1
  # One SWIM identity per site: a surge pod would gossip a second one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-operator
    spec:
      serviceAccountName: grid-operator
      # Service link env vars would collide with the operator's GRID_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Project-owned image pinned to an immutable digest.
          # For Kind validation, xtask loads grid-operator:latest locally
          image: ghcr.io/praxis-proxy/grid-operator@sha256:8c8271aa589fbd81e346b75ae580be9e8085c3b283b4e6a99e2b9adcea73e12d
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRID_SWIM_BIND_ADDR
              value: "0.0.0.0:7946"
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_ADVERTISE_FALLBACK
              value: "$(POD_IP):7946"
            - name: GRID_GATEWAY_NAMESPACE
              value: "grid-system"
            - name: GRID_GATEWAY_PORT
              value: "8080"
            - name: GRID_METRICS_ADDR
              value: "0.0.0.0:9090"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: swim-udp
              containerPort: 7946
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
