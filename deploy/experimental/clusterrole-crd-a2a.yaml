apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-operator-crd-a2a
  labels:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/part-of: grid
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoagentproviders
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - agenttoagentproviders/status
    verbs: ["get", "patch"]

