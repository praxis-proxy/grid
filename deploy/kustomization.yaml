apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Complete standalone Grid deployment: CRDs + the kind operator overlay.
# deploy/operator is the platform base and carries no Namespace; a platform vendors it.

resources:
  # CRDs must be applied first
  - crds/
  # Operator resources, the standalone shape with its own Namespace
  - overlays/kind/

labels:
  - pairs:
      app.kubernetes.io/part-of: grid
