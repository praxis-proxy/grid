{{- include "grid-bootstrap.validate" . }}
{{- if .Values.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.issuer.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "grid-bootstrap.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.ca.secretName | quote }}
{{- end }}
