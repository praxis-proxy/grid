# -- Enable bootstrap after cert-manager is installed in the cluster.
enabled: false

issuer:
  # -- Namespaced Issuer used by the enroll flow. Certificates must be in the release namespace.
  name: grid-ca

ca:
  # -- Existing references an existing CA without modifying it. Generate creates a CA for a new grid.
  mode: Existing
  # -- TLS Secret containing the CA certificate and private key, in the release namespace.
  secretName: grid-ca-key
  # -- Certificate name when ca.mode is Generate. Retained when the release is removed.
  certificateName: grid-root-ca
  # -- SelfSigned Issuer name when ca.mode is Generate. Retained with the CA Certificate.
  bootstrapIssuerName: grid-root-selfsigned
  # -- CA subject common name when ca.mode is Generate.
  commonName: grid-root-ca
  # -- CA certificate lifetime in hours when ca.mode is Generate. Renewal keeps the signing key.
  durationHours: 87600
  # -- Renew the CA certificate this many hours before expiry. Must be less than durationHours.
  renewBeforeHours: 8760
