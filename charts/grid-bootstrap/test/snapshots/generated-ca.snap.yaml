---
# Source: grid-bootstrap/templates/ca.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "grid-root-ca"
  namespace: "default"
  labels:
    app.kubernetes.io/name: grid-bootstrap
    app.kubernetes.io/instance: "release-test"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: "grid-root-ca"
  secretName: "grid-ca-key"
  duration: "87600h"
  renewBefore: "8760h"
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    # Replacing the signing key would split the grid's trust domain.
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  secretTemplate:
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  issuerRef:
    name: "grid-root-selfsigned"
    kind: Issuer
    group: cert-manager.io
---
# Source: grid-bootstrap/templates/ca.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: "grid-root-selfsigned"
  namespace: "default"
  labels:
    app.kubernetes.io/name: grid-bootstrap
    app.kubernetes.io/instance: "release-test"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selfSigned: {}
---
# Source: grid-bootstrap/templates/issuer.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: "grid-ca"
  namespace: "default"
  labels:
    app.kubernetes.io/name: grid-bootstrap
    app.kubernetes.io/instance: "release-test"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
spec:
  ca:
    secretName: "grid-ca-key"
