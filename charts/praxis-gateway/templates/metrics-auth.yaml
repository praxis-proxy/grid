{{- include "praxis-gateway.normalize" . }}
{{- if .Values.metricsListener.enabled }}
{{- $base := include "praxis-gateway.fullname" . }}
{{- $gatewaySA := printf "%s-metrics-auth" ($base | trunc 49 | trimSuffix "-") }}
{{- $scraperSA := printf "%s-metrics-scraper" ($base | trunc 45 | trimSuffix "-") }}
{{- $scraperToken := printf "%s-metrics-token" ($base | trunc 45 | trimSuffix "-") }}
{{- $clusterAuthName := printf "%s-metrics-auth-%s" ($base | trunc 32 | trimSuffix "-") (sha256sum (printf "%s/%s" .Release.Namespace $base) | trunc 8) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $gatewaySA }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $scraperSA }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $scraperToken }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $scraperSA | quote }}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterAuthName }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterAuthName }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterAuthName }}
subjects:
  - kind: ServiceAccount
    name: {{ $gatewaySA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-metrics-scrape" ($base | trunc 45 | trimSuffix "-") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [metrics.grid.praxis-proxy.io]
    resources: [scrapes]
    resourceNames: [{{ $base | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-metrics-scrape" ($base | trunc 45 | trimSuffix "-") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-metrics-scrape" ($base | trunc 45 | trimSuffix "-") }}
subjects:
  - kind: ServiceAccount
    name: {{ $scraperSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
