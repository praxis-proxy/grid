{{- include "praxis-gateway.validateDigest" . }}
{{- include "praxis-gateway.validateConfig" . }}
{{- include "praxis-gateway.validateMounts" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praxis-gateway.fullname" . }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "praxis-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels := include "praxis-gateway.selectorLabels" . | fromYaml }}
        {{- $podLabels := mustMergeOverwrite (dict) (.Values.podLabels | default dict) $selectorLabels }}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- if .Values.overlay.configMapName }}
      serviceAccountName: {{ include "praxis-gateway.fullname" . }}-overlay-sync
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.overlay.configMapName }}
      initContainers:
        - name: overlay-sync-init
          image: {{ include "praxis-gateway.overlaySyncImage" . }}
          imagePullPolicy: {{ .Values.overlay.sidecar.image.pullPolicy | quote }}
          args:
            - "--namespace"
            - {{ .Release.Namespace | quote }}
            - "--config-map"
            - {{ .Values.overlay.configMapName | quote }}
            - "--data-key"
            - {{ .Values.overlay.sidecar.dataKey | quote }}
            - "--output"
            - {{ printf "%s/%s" .Values.overlay.mountPath .Values.overlay.sidecar.dataKey | quote }}
            - "--expected-network"
            - {{ .Values.grid.networkName | quote }}
            - "--expected-gateway"
            - {{ include "praxis-gateway.fullname" . | quote }}
            - "--expected-local-site"
            - {{ .Values.grid.siteName | quote }}
            - "--once"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          {{- with .Values.overlay.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: false
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      {{- end }}
      containers:
        {{- if .Values.overlay.configMapName }}
        - name: overlay-sync
          image: {{ include "praxis-gateway.overlaySyncImage" . }}
          imagePullPolicy: {{ .Values.overlay.sidecar.image.pullPolicy | quote }}
          args:
            - "--namespace"
            - {{ .Release.Namespace | quote }}
            - "--config-map"
            - {{ .Values.overlay.configMapName | quote }}
            - "--data-key"
            - {{ .Values.overlay.sidecar.dataKey | quote }}
            - "--output"
            - {{ printf "%s/%s" .Values.overlay.mountPath .Values.overlay.sidecar.dataKey | quote }}
            - "--expected-network"
            - {{ .Values.grid.networkName | quote }}
            - "--expected-gateway"
            - {{ include "praxis-gateway.fullname" . | quote }}
            - "--expected-local-site"
            - {{ .Values.grid.siteName | quote }}
            - "--health-addr"
            - "0.0.0.0:9091"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 9091
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- with .Values.overlay.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: false
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
        - name: praxis
          image: {{ include "praxis-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $validateCA := .Values.praxisConfig.render.auth.validateCA }}
          {{- $withCA := and (eq .Values.praxisConfig.source "render") (eq .Values.praxisConfig.render.auth.mode "api-key") (or $validateCA.configMapName $validateCA.secretName) }}
          {{- if or .Values.env $withCA }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $withCA }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" $validateCA.mountPath $validateCA.key | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: {{ include "praxis-gateway.portName" . }}
              containerPort: {{ .Values.port.containerPort }}
              protocol: {{ .Values.port.protocol | quote }}
          {{- with .Values.health.readiness }}
          readinessProbe:
            {{- include "praxis-gateway.probe" (list . $) | nindent 12 }}
          {{- end }}
          {{- with .Values.health.liveness }}
          livenessProbe:
            {{- include "praxis-gateway.probe" (list . $) | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            {{- if .Values.overlay.configMapName }}
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.gridIdentity.secretName }}
            - name: tls
              mountPath: {{ .Values.gridIdentity.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.upstreamCA.secretName }}
            - name: upstream-ca
              mountPath: {{ .Values.upstreamCA.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.praxisConfig.source "render" }}
            {{- range $i, $backend := .Values.praxisConfig.render.backends }}
            {{- if (.transport).ca }}
            - name: backend-ca-{{ $i }}
              mountPath: /etc/praxis/backend-ca/{{ $i }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.listenerTls.secretName }}
            - name: listener-tls
              mountPath: {{ .Values.listenerTls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $withCA }}
            - name: validate-ca
              mountPath: {{ $validateCA.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.providerCredentials }}
            - name: credential-{{ .secretName }}
              mountPath: {{ include "praxis-gateway.providerCredentialPath" . | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            {{- if eq .Values.praxisConfig.source "render" }}
            name: {{ include "praxis-gateway.configMapName" . }}
            items:
              - key: "praxis.yaml"
                path: "praxis.yaml"
              {{- if eq (.Values.praxisConfig.render.auth.mode | default "none") "api-key" }}
              - key: "policy.yaml"
                path: "policy.yaml"
              {{- end }}
            {{- else }}
            name: {{ include "praxis-gateway.configMapName" . | quote }}
            items:
              {{- /* The Grid operator always writes the praxis.yaml key. */}}
              - key: {{ ternary "praxis.yaml" (.Values.praxisConfig.key | default "praxis.yaml") (eq .Values.praxisConfig.source "operator") | quote }}
                path: "praxis.yaml"
            {{- end }}
        {{- if .Values.overlay.configMapName }}
        - name: overlay
          emptyDir:
            sizeLimit: "10Mi"
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if .Values.gridIdentity.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.gridIdentity.secretName | quote }}
        {{- end }}
        {{- if .Values.upstreamCA.secretName }}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.upstreamCA.secretName | quote }}
        {{- end }}
        {{- if eq .Values.praxisConfig.source "render" }}
        {{- range $i, $backend := .Values.praxisConfig.render.backends }}
        {{- with (.transport).ca }}
        - name: backend-ca-{{ $i }}
          {{- if .configMapName }}
          configMap:
            name: {{ .configMapName | quote }}
          {{- else }}
          secret:
            secretName: {{ .secretName | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- $validateCA := .Values.praxisConfig.render.auth.validateCA }}
        {{- $apiKeyRender := and (eq .Values.praxisConfig.source "render") (eq .Values.praxisConfig.render.auth.mode "api-key") }}
        {{- if and $apiKeyRender $validateCA.configMapName }}
        - name: validate-ca
          configMap:
            name: {{ $validateCA.configMapName | quote }}
        {{- else if and $apiKeyRender $validateCA.secretName }}
        - name: validate-ca
          secret:
            secretName: {{ $validateCA.secretName | quote }}
        {{- end }}
        {{- if .Values.listenerTls.secretName }}
        - name: listener-tls
          secret:
            secretName: {{ .Values.listenerTls.secretName | quote }}
        {{- end }}
        {{- range .Values.providerCredentials }}
        - name: credential-{{ .secretName }}
          secret:
            secretName: {{ .secretName | quote }}
            optional: {{ .optional | default false }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
