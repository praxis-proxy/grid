{{- include "praxis-gateway.validateDigest" . }}
{{- include "praxis-gateway.validateConfig" . }}
{{- include "praxis-gateway.validateMounts" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praxis-gateway.fullname" . }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "praxis-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels := include "praxis-gateway.selectorLabels" . | fromYaml }}
        {{- $podLabels := mustMergeOverwrite (dict) (.Values.podLabels | default dict) $selectorLabels }}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if and .Values.overlay.enabled .Values.overlay.sidecar.enabled }}
      serviceAccountName: {{ include "praxis-gateway.fullname" . }}-overlay-sync
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.overlay.enabled .Values.overlay.sidecar.enabled }}
      initContainers:
        - name: overlay-sync-init
          image: {{ include "praxis-gateway.overlaySyncImage" . }}
          imagePullPolicy: {{ .Values.overlay.sidecar.image.pullPolicy | quote }}
          args:
            - "--namespace"
            - {{ .Release.Namespace | quote }}
            - "--config-map"
            - {{ .Values.overlay.existingConfigMap | quote }}
            - "--data-key"
            - {{ .Values.overlay.sidecar.dataKey | quote }}
            - "--output"
            - {{ printf "%s/%s" .Values.overlay.mountPath .Values.overlay.sidecar.dataKey | quote }}
            - "--expected-network"
            - {{ .Values.overlay.sidecar.expectedNetwork | quote }}
            - "--expected-gateway"
            - {{ include "praxis-gateway.fullname" . | quote }}
            - "--expected-local-site"
            - {{ .Values.overlay.sidecar.expectedLocalSite | quote }}
            - "--once"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          {{- with .Values.overlay.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: false
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      {{- end }}
      containers:
        {{- if and .Values.overlay.enabled .Values.overlay.sidecar.enabled }}
        - name: overlay-sync
          image: {{ include "praxis-gateway.overlaySyncImage" . }}
          imagePullPolicy: {{ .Values.overlay.sidecar.image.pullPolicy | quote }}
          args:
            - "--namespace"
            - {{ .Release.Namespace | quote }}
            - "--config-map"
            - {{ .Values.overlay.existingConfigMap | quote }}
            - "--data-key"
            - {{ .Values.overlay.sidecar.dataKey | quote }}
            - "--output"
            - {{ printf "%s/%s" .Values.overlay.mountPath .Values.overlay.sidecar.dataKey | quote }}
            - "--expected-network"
            - {{ .Values.overlay.sidecar.expectedNetwork | quote }}
            - "--expected-gateway"
            - {{ include "praxis-gateway.fullname" . | quote }}
            - "--expected-local-site"
            - {{ .Values.overlay.sidecar.expectedLocalSite | quote }}
            - "--health-addr"
            - "0.0.0.0:9091"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 9091
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- with .Values.overlay.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: false
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
        - name: praxis
          image: {{ include "praxis-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: {{ .Values.port.name }}
              containerPort: {{ .Values.port.containerPort }}
              protocol: {{ .Values.port.protocol | quote }}
          {{- with .Values.health.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.health.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            {{- if .Values.overlay.enabled }}
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.credentials }}
            - name: credential-{{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap | quote }}
            items:
              - key: {{ .Values.config.key | quote }}
                path: "praxis.yaml"
        {{- if .Values.overlay.enabled }}
        {{- if .Values.overlay.sidecar.enabled }}
        - name: overlay
          emptyDir:
            sizeLimit: "10Mi"
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- else }}
        - name: overlay
          configMap:
            name: {{ .Values.overlay.existingConfigMap | quote }}
            {{- with .Values.overlay.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
        {{- end }}
        {{- range .Values.credentials }}
        - name: credential-{{ .name }}
          secret:
            secretName: {{ .name | quote }}
            optional: {{ .optional | default false }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
