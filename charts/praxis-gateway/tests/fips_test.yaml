suite: fips mode
templates:
  - templates/deployment.yaml
release:
  name: praxis-gateway
  namespace: praxis
tests:
  - it: leaves the gateway env unset by default so the pod template does not change on upgrade
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "praxis")].env

  - it: renders PRAXIS_REQUIRE_FIPS when required
    set:
      fips.required: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "praxis")].env
          content: {name: PRAXIS_REQUIRE_FIPS, value: "1"}

  - it: keeps the env unset when required is explicitly false
    set:
      fips.required: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "praxis")].env

  - it: leaves PRAXIS_REQUIRE_FIPS to a user env entry, without a duplicate
    set:
      fips.required: true
      env:
        - {name: PRAXIS_REQUIRE_FIPS, value: "0"}
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "praxis")].env
          content: {name: PRAXIS_REQUIRE_FIPS, value: "0"}
      - notContains:
          path: spec.template.spec.containers[?(@.name == "praxis")].env
          content: {name: PRAXIS_REQUIRE_FIPS, value: "1"}

  - it: sets the variable only on the praxis container
    set:
      fips.required: true
      grid: {networkName: grid, siteName: a}
      overlay: {configMapName: ov, sidecar: {enabled: true}}
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "praxis")].env
          content: {name: PRAXIS_REQUIRE_FIPS, value: "1"}
      - notExists:
          path: spec.template.spec.containers[?(@.name == "overlay-sync")].env
      - notExists:
          path: spec.template.spec.initContainers[?(@.name == "overlay-sync-init")].env
      - equal:
          path: spec.template.spec.containers[?(@.name == "praxis")].env
          value:
            - name: PRAXIS_REQUIRE_FIPS
              value: "1"

  - it: rejects a value that is not a boolean
    set:
      fips.required: maybe
    asserts:
      - failedTemplate: {}
