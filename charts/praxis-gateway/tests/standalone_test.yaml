suite: standalone install
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/gateway-config.yaml
  - templates/networkpolicy.yaml
  - templates/serviceaccount.yaml
  - templates/role.yaml
  - templates/rolebinding.yaml
  - templates/NOTES.txt
release:
  name: praxis-gateway
  namespace: praxis
tests:
  - it: stores the built-in Praxis config in a chart-managed ConfigMap
    template: templates/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: praxis-gateway-config
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'address: "0\.0\.0\.0:8080"'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '"server": "praxis"'

  - it: mounts the chart-managed config and rolls pods when it changes
    template: templates/deployment.yaml
    set:
      praxisConfig.byo.inline: 'listeners: [{name: default, address: "0.0.0.0:8080"}]'
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "config")].configMap.name
          value: praxis-gateway-config
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: a57d7f9e283ac1782f59ef0fdd09f136e368b10093eef3bb5be3ab463a1fb779

  - it: keeps user pod annotations next to the config checksum
    template: templates/deployment.yaml
    set:
      podAnnotations:
        example.com/team: edge
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: edge
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: renders only the proxy workload, with no operator, RBAC, or Grid resources
    asserts:
      - hasDocuments:
          count: 0
        template: templates/gateway-config.yaml
      - hasDocuments:
          count: 0
        template: templates/networkpolicy.yaml
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: templates/role.yaml
      - hasDocuments:
          count: 0
        template: templates/rolebinding.yaml
      - isKind:
          of: Service
        template: templates/service.yaml
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: templates/deployment.yaml

  - it: prefers an existing ConfigMap over praxisConfig.byo.inline
    set:
      praxisConfig.byo.configMapName: my-praxis
      praxisConfig.byo.key: gateway.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap.yaml
      - equal:
          path: spec.template.spec.volumes[?(@.name == "config")].configMap.name
          value: my-praxis
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.volumes[?(@.name == "config")].configMap.items[0].key
          value: gateway.yaml
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
        template: templates/deployment.yaml

  - it: leaves the config to praxisConfig.render when source is render
    template: templates/configmap.yaml
    set:
      praxisConfig.source: render
      praxisConfig.render.localSite: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends:
        - cluster: a
          endpoints: ["10.0.0.1:8000"]
          transport: { mode: plaintext }
    asserts:
      - hasDocuments:
          count: 0

  - it: fails backends set while the source is not render
    template: templates/deployment.yaml
    set:
      praxisConfig.source: byo
      praxisConfig.render.localSite: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.source is byo, which ignores it

  - it: fails a blank praxisConfig.byo.inline
    template: templates/deployment.yaml
    set:
      praxisConfig.byo.inline: "  "
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.byo.inline is empty

  - it: fails a praxisConfig.byo.inline that is not a YAML mapping
    template: templates/deployment.yaml
    set:
      praxisConfig.byo.inline: not-a-mapping
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.byo.inline is not a valid YAML mapping

  - it: fails a praxisConfig.byo.inline with no listener on port.containerPort
    template: templates/deployment.yaml
    set:
      port.containerPort: 9090
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.byo.inline has no listener on port.containerPort 9090

  - it: accepts a praxisConfig.byo.inline listener on a custom port.containerPort
    template: templates/deployment.yaml
    set:
      port.containerPort: 9090
      praxisConfig.byo.inline: 'listeners: [{name: default, address: "[::]:9090"}]'
    asserts:
      - notFailedTemplate: {}

  - it: fails grid settings that praxisConfig.byo.inline would ignore
    template: templates/deployment.yaml
    set:
      praxisConfig.render.localSite: hub
      praxisConfig.render.model: qwen3
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.render.localSite is set but praxisConfig.source is byo

  - it: fails a model while the source is not render
    template: templates/deployment.yaml
    set:
      praxisConfig.render.model: qwen3
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.render.model is set but praxisConfig.source is byo

  - it: writes install notes that stand on their own without Grid
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "Config:    praxisConfig.byo.inline \\(ConfigMap praxis-gateway-config\\)"
      - matchRegexRaw:
          pattern: port-forward service/praxis-gateway 8080:8080
      - notMatchRegexRaw:
          pattern: (?i)grid|\bAGN\b|operator|temporary

  - it: tells existing ConfigMap users how to load an edited config
    template: templates/NOTES.txt
    set:
      praxisConfig.byo.configMapName: my-praxis
    asserts:
      - matchRegexRaw:
          pattern: rollout restart deployment/praxis-gateway
