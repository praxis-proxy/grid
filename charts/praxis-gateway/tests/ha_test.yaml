suite: more than one replica
templates:
  - templates/deployment.yaml
  - templates/poddisruptionbudget.yaml
release:
  name: grid-gateway
  namespace: grid
tests:
  - it: renders one replica as today, with no strategy, spread or budget
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: templates/deployment.yaml
      - notExists:
          path: spec.strategy
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.affinity
        template: templates/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/poddisruptionbudget.yaml

  - it: rolls one surge pod at a time with none unavailable above one replica
    template: templates/deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: prefers a spread across nodes above one replica
    template: templates/deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: praxis-gateway
                  app.kubernetes.io/instance: grid-gateway

  - it: lets your own constraints replace the default spread
    template: templates/deployment.yaml
    set:
      replicaCount: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: grid-gateway
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: renders a budget of one for more than one replica by default
    template: templates/poddisruptionbudget.yaml
    set:
      replicaCount: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: metadata.name
          value: grid-gateway-praxis-gateway
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: praxis-gateway
            app.kubernetes.io/instance: grid-gateway
