# -- Number of gateway replicas.
replicaCount: 1

# -- Gateway container image settings.
image:
  # -- Image repository.
  repository: ghcr.io/praxis-proxy/ai
  # -- Image tag. Used when digest is empty.
  tag: "0.4.0"
  # -- Immutable image digest (sha256:<64 hex>). When set, tag is ignored.
  digest: ""
  # -- Image pull policy.
  pullPolicy: "IfNotPresent"

# -- Pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified app name. Left empty so naming stays release-based;
# a grid install pins it (fullnameOverride at install) for the operator's discovery.
fullnameOverride: ""
# -- Labels added to all chart-managed resources.
commonLabels: {}
# -- Additional labels on the gateway pod template. Selector labels cannot
# be overridden.
podLabels: {}
# -- Annotations on the gateway pod template.
podAnnotations: {}

# -- Extra pod-level securityContext fields (e.g. runAsUser, runAsGroup).
# runAsNonRoot and seccompProfile are always set by the chart.
podSecurityContext: {}
# runAsUser: 100
# runAsGroup: 101

# -- Container arguments. Defaults to the config file path.
args:
  - "--config"
  - "/etc/praxis/praxis.yaml"

# -- Environment variables passed to the Praxis container. Use valueFrom for
# -- credentials and other deployment-managed secrets.
env: []

# -- Praxis configuration (praxis.yaml).
praxisConfig:
  # -- Who writes praxis.yaml:
  # byo: you create the ConfigMap named in configMapName.
  # operator: the Grid operator creates it, from a GridNetwork gatewayRef with
  #   consumerConfig.enabled. configMapName must match the one in the GridNetwork.
  # render: this chart creates it from praxisConfig.render. configMapName is not used.
  source: byo
  # -- Name of the ConfigMap containing praxis.yaml. Required for source byo.
  # For source operator, leave empty to use praxis-consumer-config, the operator's
  # default; set it only when the GridNetwork uses another configMapName.
  # The chart does not create or manage this ConfigMap.
  configMapName: ""
  # -- Key within the ConfigMap that holds praxis.yaml. Only for source byo;
  # change it only when your ConfigMap uses a different key. Source operator
  # always uses praxis.yaml.
  key: "praxis.yaml"
  # -- Secure-by-default gateway config, used only when source is render. The chart
  # emits praxis.yaml + policy.yaml (the auth chain) and never emits insecure_options;
  # endpoints are values.
  render:
    # -- Local site name for intelligent_route locality scoring.
    localSite: "hub"
    # -- Model advertised on the routing candidates.
    model: ""
    auth:
      # -- Caller authentication, required when praxisConfig.source is render. api-key validates the
      # caller's key against validateUrl and needs an image whose policy engine registers
      # identity/api-key (praxis-policy 0.4 or later); the render refuses it on the default
      # ai:0.4.0 image. none
      # renders no policy filter and belongs only behind an authenticating front.
      # TODO: default to api-key once the default image carries praxis-policy 0.4.
      mode: ""
      # -- With mode none, allow a LoadBalancer or NodePort Service. Without it the render
      # fails, since that exposes unauthenticated inference. The guard only sees this chart's
      # Service; see networkPolicy for exposure created outside the chart.
      allowUnauthenticatedExposure: false
      # -- Remove the caller's Authorization header before routing, in either mode. The
      # key authenticates this hop only. Forwarded grid hops authenticate by mTLS identity.
      # false forwards the caller's key or bearer to every backend and cross-site peer; use
      # it only when the backend validates that same credential.
      stripAuthorization: true
      # -- identity/validate endpoint URL (a backend answering the validate contract: POST {"key":...} returns {"valid":...}). Must be https, or the render fails, since a plaintext validate call ships the credential in the clear.
      validateUrl: ""
      # -- Let the validate call reach a private address (an in-cluster Service). Sets the
      # policy filter's allow_private_idp, which is engine-wide: every policy callout may then
      # reach any private, loopback, or link-local address, not only validateUrl.
      allowPrivateEndpoint: false
      # -- CA that signs the validate endpoint's certificate (for example the OpenShift
      # service CA). Mounted and set as SSL_CERT_FILE, which REPLACES the platform trust
      # store for the process: the validate call and https backends without a per-backend CA
      # or upstreamCA use it; mutual_tls backends and upstreamCA do not. Build the bundle as
      # the image's /etc/ssl/certs/ca-certificates.crt plus the service CA, or set upstreamCA
      # for public https backends. Set configMapName or secretName, not both. Empty keeps the
      # platform store.
      validateCA:
        # -- ConfigMap holding the bundle (for example one annotated
        # service.beta.openshift.io/inject-cabundle, key service-ca.crt).
        configMapName: ""
        # -- Secret holding the bundle.
        secretName: ""
        # -- Key holding the PEM bundle.
        key: "ca.crt"
        # -- Mount path for the bundle.
        mountPath: "/etc/praxis/validate-ca"
      # -- Credential prefix the resolver strips before lookup.
      prefix: "Bearer "
      # -- Validate call timeout (seconds).
      timeoutSecs: 5
    # -- Backend clusters. Each renders a health_check so a literal ClusterIP routes without
    # allow_private_upstreams, plus an explicit transport. A backend omitting transport
    # defaults to mutual_tls when the grid identity is mounted (gridIdentity.secretName), else plaintext.
    # mutual_tls presents that identity (gridIdentity.mountPath tls.crt/tls.key, verified against its
    # ca.crt) and needs a sni naming the peer. tls verifies the backend's server cert with
    # no client cert: sni defaults to the endpoint host. Its trust, first match wins:
    # transport.ca (a ConfigMap or Secret), then upstreamCA (upstream_ca_file), then the
    # process store. With auth.validateCA set, SSL_CERT_FILE replaces the process store,
    # so such a backend then trusts only that bundle. An in-cluster hostname
    # resolves to a private address, which praxis refuses, so use the ClusterIP endpoint
    # with sni set to the Service DNS name. plaintext is cleartext.
    # The health_check type defaults to tcp for TLS transports (the active http probe is
    # plaintext and cannot reach a TLS peer) and http for plaintext. Override per backend
    # with healthCheck.type.
    backends: []
    #  - cluster: site-a
    #    endpoints: ["172.30.202.42:8000"]
    #    healthCheck: { type: http, path: /health, intervalMs: 5000, timeoutMs: 2000 }
    #    transport: { mode: mutual_tls, sni: site-a.grid.internal }  # or { mode: plaintext }
    #  - cluster: local-qwen3            # KServe LLMInferenceService on OpenShift, HTTPS :8000
    #    endpoints: ["172.30.12.34:8000"]  # the workload Service ClusterIP
    #    transport:
    #      mode: tls
    #      sni: qwen3-kserve-workload-svc.llm.svc
    #      ca: { configMapName: openshift-service-ca.crt, key: service-ca.crt }

# -- CA bundle the gateway uses to verify backend TLS certs (outbound), for backends
# without a per-cluster CA. Empty secretName keeps the system trust store. It replaces
# the system trust store for proxied upstreams, and does not apply to the api-key
# validate call (use praxisConfig.render.auth.validateCA for that).
#   render:   create the Secret and set secretName. The chart mounts it and writes
#             upstream_ca_file into praxis.yaml.
#   byo:      you must do all three:
#             1. create the Secret, with the PEM bundle under `key`:
#                kubectl create secret generic my-ca --from-file=ca.crt=./ca.crt
#             2. set secretName: my-ca. The chart mounts it at mountPath.
#             3. in your praxis.yaml, set
#                runtime.upstream_ca_file: /etc/praxis/upstream-ca/ca.crt
#                (mountPath/key). Without this the mount is not used.
#   operator: not supported. Setting secretName fails the install.
upstreamCA:
  # -- Existing Secret holding the CA bundle. The chart does not create it.
  # Empty (the default) turns upstreamCA off.
  secretName: ""
  # -- Key within the Secret that holds the PEM bundle.
  key: "ca.crt"
  # -- Mount path for the CA bundle.
  mountPath: "/etc/praxis/upstream-ca"

# -- Server cert for TLS on the gateway listener (inbound). Empty secretName keeps a
# plaintext listener, for when an inbound TLS front (an OpenShift Route or a Gateway)
# terminates TLS. Setting secretName also names the container port https; the probes
# and Service follow it.
#   render:   create the Secret and set secretName. The chart mounts it and writes
#             the listener cert paths into praxis.yaml.
#   byo:      you must do all three:
#             1. create the Secret, with tls.crt and tls.key:
#                kubectl create secret tls my-listener-cert --cert=tls.crt --key=tls.key
#             2. set secretName: my-listener-cert. The chart mounts it at mountPath.
#             3. in your praxis.yaml, give the listener a tls block with
#                cert_path: /etc/praxis/listener-tls/tls.crt
#                key_path:  /etc/praxis/listener-tls/tls.key
#                Without this the gateway serves plaintext on the https port.
#   operator: not supported. Setting secretName fails the install.
# On OpenShift, the service CA can issue the cert: set service.annotations
# service.beta.openshift.io/serving-cert-secret-name to the Secret name.
listenerTls:
  # -- Existing Secret holding the server certificate (tls.crt) and key (tls.key).
  # The chart does not create it. Empty (the default) turns listener TLS off.
  secretName: ""
  # -- Mount path for the listener certificate.
  mountPath: "/etc/praxis/listener-tls"

# -- Primary listener port configuration.
port:
  # -- Container port number.
  containerPort: 8080
  # -- Port name. Empty: https when listenerTls.secretName is set, else http.
  name: ""
  # -- Port protocol.
  protocol: "TCP"

# -- NetworkPolicy that limits which pods can reach the listener port, where the CNI
# enforces NetworkPolicy. It is not authentication. With auth.mode none it narrows
# exposure the Service guard cannot see (oc expose, another Service, an HTTPRoute): list
# only the authenticating front. Node and host-network traffic handling is CNI-specific
# (OVN-Kubernetes: the policy-group.network.openshift.io/host-network namespace label), and
# a LoadBalancer with externalTrafficPolicy Cluster can SNAT clients to node IPs.
networkPolicy:
  # -- Render the NetworkPolicy.
  enabled: false
  # -- NetworkPolicyPeer entries allowed to reach the listener. Required when enabled.
  # {podSelector: {}} admits every pod in this namespace. An empty namespaceSelector and an
  # ipBlock of 0.0.0.0/0 or ::/0 admit everyone and fail the render.
  from: []
  # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: redhat-ai-gateway-infra}}
  #   podSelector: {matchLabels: {app: authenticating-front}}

# -- Gateway Service configuration.
service:
  # -- Create a Service for the gateway.
  enabled: true
  # -- Service type.
  type: "ClusterIP"
  # -- Service port number.
  port: 8080
  # -- Service annotations.
  annotations: {}
  # -- Static IP for LoadBalancer type.
  loadBalancerIP: ""

# -- Optional operator-produced overlay ConfigMap mount (edge gateways).
overlay:
  # -- Name of the existing overlay ConfigMap. The operator creates it.
  # Empty (the default) turns the overlay mount off.
  configMapName: ""
  # -- Mount path for overlay files.
  mountPath: "/etc/praxis/routing"
  # -- Items to project from the ConfigMap (used when sidecar is disabled).
  items:
    - key: "routing-overlay.json"
      path: "routing-overlay.json"
  # -- Overlay sync sidecar settings. When enabled, the sidecar watches the
  # ConfigMap via the Kubernetes API and writes validated overlays to a shared
  # emptyDir, replacing the kubelet volume sync.
  sidecar:
    # -- Enable the overlay-sync sidecar.
    enabled: false
    # -- Sidecar container image.
    image:
      # -- Image repository.
      repository: ghcr.io/praxis-proxy/grid-overlay-sync
      # -- Image tag. Defaults to the chart appVersion when empty.
      tag: ""
      # -- Image pull policy.
      pullPolicy: IfNotPresent
    # -- ConfigMap data key containing the overlay envelope.
    dataKey: "routing-overlay.json"
    # -- Expected GridNetwork name for scope validation.
    expectedNetwork: ""
    # -- Expected local site name for scope validation.
    expectedLocalSite: ""
    # -- Sidecar resource requests and limits.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

# -- Grid identity: the gateway's client cert for mTLS to backends and cross-site
# peers. The Secret holds tls.crt, tls.key and ca.crt. You create it; the chart
# only mounts it at mountPath. Works with every praxisConfig.source. What uses
# it depends on who writes praxis.yaml:
#   operator: each GridNetwork consumerConfig.clusterEndpoints[] entry sets
#             transport.mode (MutualTls or Plaintext). MutualTls clusters use
#             this mount. Set secretName if any cluster uses MutualTls.
#   byo:      up to you. Point the cluster tls block of your praxis.yaml at
#             mountPath (ca.crt, tls.crt, tls.key).
#   render:   each render.backends[] entry picks transport.mode: mutual_tls
#             (uses this mount), tls (server cert only) or plaintext. A backend
#             with no mode gets mutual_tls when secretName is set, else plaintext.
gridIdentity:
  # -- Existing Secret with the grid identity. The chart does not create it.
  # Empty (the default) turns the grid identity off.
  secretName: ""
  # -- Mount path for TLS files.
  mountPath: "/etc/praxis/tls"

# -- Provider credential Secrets (API keys, tokens) mounted into the gateway, for
# provider gateways. List here every Secret referenced in an InferenceProvider CR's
# spec.auth.secretRef. You create each Secret, in this release's namespace (a pod
# can only mount Secrets from its own namespace); the chart only mounts it.
# praxis.yaml reads the key from a file under mountPath:
#   operator: the operator writes <credentialMountBase>/<secret>/<key> into
#             praxis.yaml. The default mountPath matches the default
#             credentialMountBase (/run/secrets/grid-credentials).
#   byo:      set mountPath to the path your praxis.yaml uses.
#   render:   not read; the chart's renderer has no credential injection.
providerCredentials: []
# - secretName: openai-api-key   # = InferenceProvider CR spec.auth.secretRef.name
#   # mountPath defaults to /run/secrets/grid-credentials/openai-api-key
# - secretName: mock-inference-credential
#   mountPath: /etc/praxis/credentials/mock-inference
#   optional: true

# -- Probe configuration.
health:
  # -- Readiness probe settings. Set to null to disable.
  # A tcpSocket without a port targets the listener port.
  readiness:
    tcpSocket: {}
    initialDelaySeconds: 3
    periodSeconds: 5
  # -- Liveness probe settings. Set to null to disable.
  liveness:
    tcpSocket: {}
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Container resource requests and limits.
resources: {}
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Pod affinity rules.
affinity: {}
# -- Pod tolerations.
tolerations: []
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class for the gateway pod.
priorityClassName: ""
