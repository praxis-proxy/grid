{{- if and (eq .Values.enrollment.authz "local") .Values.enrollment.gridAdminTokens.generate (not .Values.enrollment.gridAdminTokens.existingSecretRef) }}
{{/*
Generated grid-admin token (a name:token line the binary parses), created once
and preserved across upgrades via lookup so an upgrade never rotates it out from
under issued admins. Mounted as a file; the binary reads the env as a path.
*/}}
{{- $name := printf "%s-grid-admin-tokens" (include "grid-enrollment.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $tokens := "" }}
{{- if $existing }}
{{- $tokens = index $existing.data "tokens" }}
{{- else }}
{{- $tokens = printf "admin:%s\n" (randAlphaNum 40) | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
    app.kubernetes.io/component: enrollment
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  tokens: {{ $tokens }}
{{- end }}
