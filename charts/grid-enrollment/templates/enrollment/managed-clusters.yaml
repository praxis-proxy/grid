{{- if .Values.managedClusters.enabled }}
{{- if ne .Values.mode "external" }}
{{- fail "managedClusters.enabled requires mode=external" }}
{{- end }}
{{- include "grid-enrollment.external.validate" . }}
{{- $cfg := .Values.managedClusters }}
{{- $name := include "grid-enrollment.membership.name" . }}
{{- $role := include "grid-enrollment.membership.clusterRoleName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $role }}
rules:
- apiGroups: [cluster.open-cluster-management.io]
  resources: [managedclusters]
  verbs: [get, list, watch]
# Hub templates can resolve before the hub policy creates observers. Keep their
# read permission in the release so inventory additions need no RBAC round trip.
- apiGroups: [work.open-cluster-management.io]
  resources: [manifestworks]
  resourceNames: [{{ $cfg.workName | quote }}]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $role }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
{{- if $cfg.createClusterSetBinding }}
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: {{ $cfg.clusterSet | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterSet: {{ $cfg.clusterSet | quote }}
{{- end }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterSets: [{{ $cfg.clusterSet | quote }}]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          {{ $cfg.clusterLabel | quote }}: {{ $cfg.clusterLabelValue | quote }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: {{ $name }}
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: {{ $name }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: {{ $name }}
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: {{ $name }}
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # Only remote peer records are managed here. The local GridSite remains
        # authoritative and is never copied back onto its source cluster.
        pruneObjectBehavior: DeleteAll
        object-templates-raw: |
          {{ printf "{{hub $network := %q hub}}" $cfg.networkName }}
          {{ printf "{{hub $label := %q hub}}" $cfg.clusterLabel }}
          {{ printf "{{hub $labelValue := %q hub}}" $cfg.clusterLabelValue }}
          {{ printf "{{hub $workName := %q hub}}" $cfg.workName }}
          {{ printf "{{hub $namespace := %q hub}}" .Values.external.delivery.namespace }}
          {{ printf "{{hub $clusterSet := %q hub}}" $cfg.clusterSet }}
          {{- .Files.Get "files/managed-cluster-peers.yaml" | nindent 10 }}
{{- end }}
