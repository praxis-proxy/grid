suite: bootstrap Job and RBAC
templates:
  - templates/certs/ca-bootstrap-job.yaml
  - templates/certs/ca-bootstrap-rbac.yaml
  - templates/enrollment/auth-rbac.yaml
tests:
  - it: runs the enrollment bootstrap subcommand
    template: templates/certs/ca-bootstrap-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["enrollment", "bootstrap"]

  - it: passes the CA, serving, and DB cert secrets but no gossip flag
    template: templates/certs/ca-bootstrap-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --db-serving-secret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --serving-secret
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --gossip-key-secret

  - it: scopes bootstrap get/update to exactly the managed cert secrets, no gossip
    template: templates/certs/ca-bootstrap-rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules[1].resourceNames
          value:
            - grid-ca-key
            - grid-ca-bundle
            - enrollment-serving-tls
            - grid-db-serving-tls

  - it: binds the enrollment SA to system:auth-delegator under authz=kube
    template: templates/enrollment/auth-rbac.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: system:auth-delegator

  - it: omits the auth-delegator binding under authz=local
    template: templates/enrollment/auth-rbac.yaml
    set:
      enrollment.authz: local
    asserts:
      - hasDocuments:
          count: 0
