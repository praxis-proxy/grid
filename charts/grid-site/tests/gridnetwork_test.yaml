suite: GridNetwork template
templates:
  - templates/gridnetwork.yaml
tests:
  - it: renders as a GridNetwork resource with no budgetPolicy by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: GridNetwork
      - equal:
          path: metadata.name
          value: prod-grid
      - notExists:
          path: spec.budgetPolicy

  - it: renders a non-null spec when only the required name fields are set
    # Regression test: every optional field used to be gated behind `with`,
    # so `spec:` rendered as YAML null when all of them were left at their
    # falsy chart defaults. A real API server rejects that with
    # "spec: Required value" on both create and update; helm-unittest
    # can't reproduce server-side CRD validation, so this asserts the
    # concrete symptom instead: gridId must always be present.
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - equal:
          path: spec.gridId
          value: ""

  - it: renders a GridNetwork with no grid ID by default
    # The operator never writes spec. An empty gridId serves only an install without an
    # operator config site section, where the operator mints one; a site that enrolls sets
    # gridId, as the hub-site e2e does.
    set:
      gridSite.name: prod-site
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: grid
      - equal:
          path: spec.gridId
          value: ""

  - it: renders the grid ID the install sets
    set:
      gridSite.name: prod-site
      gridNetwork.gridId: lab-7
    asserts:
      - equal:
          path: spec.gridId
          value: lab-7

  - it: defaults a new GridNetwork to roundRobin selection
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - equal:
          path: spec.selectionPolicy.mode
          value: roundRobin

  - it: omits selectionPolicy when unset, leaving the CRD default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.selectionPolicy: null
    asserts:
      - notExists:
          path: spec.selectionPolicy

  - it: renders the configured selectionPolicy
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.selectionPolicy.mode: random
    asserts:
      - equal:
          path: spec.selectionPolicy.mode
          value: random

  - it: renders placementPolicy without scoringPolicy
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.selectionPolicy.mode: weightedRandom
      gridNetwork.placementPolicy.strategy: static
    asserts:
      - equal:
          path: spec.placementPolicy.strategy
          value: static
      - notExists:
          path: spec.scoringPolicy

  - it: renders budgetPolicy.tenants verbatim when set
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.budgetPolicy:
        tenants:
          - tenantId: tenant-a
            capUsd: 100
          - tenantId: tenant-b
            capUsd: 250
    asserts:
      - equal:
          path: spec.budgetPolicy.tenants
          value:
            - tenantId: tenant-a
              capUsd: 100
            - tenantId: tenant-b
              capUsd: 250

  - it: renders budgetPolicy with an empty tenants list without erroring
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.budgetPolicy:
        tenants: []
    asserts:
      - equal:
          path: spec.budgetPolicy.tenants
          value: []

  - it: omits peerTrust by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - notExists:
          path: spec.peerTrust

  - it: renders peerTrust
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.peerTrust.mode: spiffe
    asserts:
      - equal:
          path: spec.peerTrust.mode
          value: spiffe

  - it: opts the network into site discovery
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.autoDiscoverSites: true
    asserts:
      - equal:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]
          value: "true"

  - it: leaves discovery off by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - notExists:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]

  - it: translates legacy gateway values to current CRD fields
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.gatewayRefs:
        - name: legacy-gateway
          namespace: grid
          localSiteName: legacy-site
          consumerConfig:
            enabled: true
            credentialMountBase: /run/legacy
      gridNetwork.tls.swimKeyRef:
        name: legacy-key
        namespace: grid
    asserts:
      - equal:
          path: spec.consumerGateways[0].siteName
          value: legacy-site
      - equal:
          path: spec.consumerGateways[0].praxisConfig.generate
          value: true
      - equal:
          path: spec.consumerGateways[0].praxisConfig.credentialMountPath
          value: /run/legacy
      - equal:
          path: spec.tls.swimKeySecretRef.name
          value: legacy-key
      - notExists:
          path: spec.gatewayRefs

  - it: drops an empty legacy gateway list beside current values
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.gatewayRefs: []
      gridNetwork.consumerGateways:
        - name: current-gateway
          namespace: grid
    asserts:
      - equal:
          path: spec.consumerGateways[0].name
          value: current-gateway
      - notExists:
          path: spec.gatewayRefs
