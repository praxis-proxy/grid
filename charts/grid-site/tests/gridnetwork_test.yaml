suite: GridNetwork template
templates:
  - templates/gridnetwork.yaml
tests:
  - it: renders as a GridNetwork resource with no budgetPolicy by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: GridNetwork
      - equal:
          path: metadata.name
          value: prod-grid
      - notExists:
          path: spec.budgetPolicy

  - it: renders a non-null spec when only the required name fields are set
    # Regression test: every optional field used to be gated behind `with`,
    # so `spec:` rendered as YAML null when all of them were left at their
    # falsy chart defaults. A real API server rejects that with
    # "spec: Required value" on both create and update — helm-unittest
    # can't reproduce server-side CRD validation, so this asserts the
    # concrete symptom instead: gridId must always be present.
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - equal:
          path: spec.gridId
          value: ""

  - it: defaults a new GridNetwork to roundRobin selection
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - equal:
          path: spec.selectionPolicy.mode
          value: roundRobin

  - it: omits selectionPolicy when unset, leaving the CRD default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.selectionPolicy: null
    asserts:
      - notExists:
          path: spec.selectionPolicy

  - it: renders the configured selectionPolicy
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.selectionPolicy.mode: random
    asserts:
      - equal:
          path: spec.selectionPolicy.mode
          value: random

  - it: renders budgetPolicy.tenants verbatim when set
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.budgetPolicy:
        tenants:
          - tenantId: tenant-a
            capUsd: 100
          - tenantId: tenant-b
            capUsd: 250
    asserts:
      - equal:
          path: spec.budgetPolicy.tenants
          value:
            - tenantId: tenant-a
              capUsd: 100
            - tenantId: tenant-b
              capUsd: 250

  - it: renders budgetPolicy with an empty tenants list without erroring
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.budgetPolicy:
        tenants: []
    asserts:
      - equal:
          path: spec.budgetPolicy.tenants
          value: []

  - it: omits peerTrust by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - notExists:
          path: spec.peerTrust

  - it: renders peerTrust
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.peerTrust.mode: spiffe
    asserts:
      - equal:
          path: spec.peerTrust.mode
          value: spiffe

  - it: opts the network into site discovery
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
      gridNetwork.autoDiscoverSites: true
    asserts:
      - equal:
          path: metadata.labels["grid.praxis-proxy.io/auto-discover-sites"]
          value: "true"

  - it: leaves discovery off by default
    set:
      gridNetwork.name: prod-grid
      gridSite.name: prod-site
    asserts:
      - notExists:
          path: metadata.labels["grid.praxis-proxy.io/auto-discover-sites"]
