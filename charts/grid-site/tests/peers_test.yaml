suite: peer GridSites
templates:
  - templates/peers.yaml
  - templates/gridnetwork.yaml
release:
  namespace: grid
set:
  gridSite.name: site-a
tests:
  - it: renders no peer by default
    template: templates/peers.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one GridSite per peer in name order with its pins and probe target
    template: templates/peers.yaml
    set:
      peers.site-b.address: 203.0.113.21:8080
      peers.hub.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      peers.hub.nextDigest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      peers.hub.region: us-east
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: grid-hub
        documentIndex: 0
      - equal:
          path: spec
          value:
            gridNetworkRef: grid
            region: us-east
            trust:
              canonicalFingerprints:
                - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        documentIndex: 0
      - equal:
          path: spec
          value:
            gridNetworkRef: grid
            gatewayEndpoint:
              address: 203.0.113.21:8080
              tls:
                mode: Mutual
                serverName: site-b.grid.internal
        documentIndex: 1

  - it: keeps an explicit probe server name that is the peer's own in another case
    template: templates/peers.yaml
    set:
      peers.site-b.address: 203.0.113.21:8080
      peers.site-b.serverName: Site-B.grid.internal
    asserts:
      - equal:
          path: spec.gatewayEndpoint.tls.serverName
          value: Site-B.grid.internal

  - it: refuses a malformed pin
    template: templates/peers.yaml
    set:
      peers.hub.digest: AB:CD
    asserts:
      - failedTemplate: {}

  - it: refuses this site as its own peer
    template: templates/peers.yaml
    set:
      peers.site-a.address: 203.0.113.21:8080
    asserts:
      - failedTemplate:
          errorPattern: this site's own gridSite.name

  - it: names the GridSite as the operator names a discovered peer
    template: templates/peers.yaml
    set:
      gridNetwork.name: Prod.Grid
      peers.hub.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.name
          value: prod-grid-hub

  - it: names a peer's GridSite under Local membership after the peer, with nothing to discover it
    template: templates/peers.yaml
    set:
      grid.membership.source: Local
      gridNetwork.name: Prod.Grid
      peers.hub.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.name
          value: hub

  - it: refuses a peer serverName that is not the peer's own name
    template: templates/peers.yaml
    set:
      peers.site-b.address: 203.0.113.21:8080
      peers.site-b.serverName: site-c.grid.internal
    asserts:
      - failedTemplate:
          errorPattern: peers.site-b.serverName must be site-b.grid.internal

  - it: declares no signals endpoint, which the operator derives from the gateway
    template: templates/peers.yaml
    set:
      peers.site-b.address: 203.0.113.21:8080
    asserts:
      - notExists:
          path: spec.signalsEndpoint

  - it: refuses the removed signals address
    template: templates/peers.yaml
    set:
      peers.site-b.signalsAddress: 203.0.113.21:9091
    asserts:
      - failedTemplate: {}

  - it: listing peers turns on discovery and the operator's TLS Secrets
    template: templates/gridnetwork.yaml
    set:
      peers.hub.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]
          value: "true"
      - equal:
          path: spec.tls
          value:
            siteSecretRef: { name: grid-site-identity, namespace: grid }
            caSecretRef: { name: grid-ca, namespace: grid }
            swimKeySecretRef: { name: grid-swim-key, namespace: grid }

  - it: keeps explicit discovery and TLS settings when peers are listed
    template: templates/gridnetwork.yaml
    set:
      peers.hub.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      gridNetwork.autoDiscoverSites: false
      gridNetwork.tls.swimKeySecretRef: { name: k, namespace: other }
    asserts:
      - notExists:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]
      - equal:
          path: spec.tls
          value:
            swimKeySecretRef: { name: k, namespace: other }

  - it: without peers, sets no TLS and no discovery
    template: templates/gridnetwork.yaml
    asserts:
      - notExists:
          path: spec.tls
      - notExists:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]

  - it: renders a peer's declared signals endpoint
    template: templates/peers.yaml
    set:
      peers:
        east:
          address: 203.0.113.20:8080
          signalsEndpoint:
            address: signals.east.example.com:9443
            serverName: east-signals.example.com
    asserts:
      - equal:
          path: spec.signalsEndpoint
          value:
            address: signals.east.example.com:9443
            serverName: east-signals.example.com

  - it: renders no signals endpoint when none is declared, so it is derived
    template: templates/peers.yaml
    set:
      peers:
        east:
          address: 203.0.113.20:8080
    asserts:
      - notExists:
          path: spec.signalsEndpoint

