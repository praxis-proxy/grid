{{- include "grid-site.normalize" . }}
{{- if .Values.gridNetwork.name }}
apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: {{ .Values.gridNetwork.name }}
  labels:
    {{- include "grid-site.labels" . | nindent 4 }}
    {{- if .Values.gridNetwork.autoDiscoverSites }}
    grid.praxis.fast/auto-discover-sites: "true"
    {{- end }}
spec:
  {{- /*
  gridId is always rendered (even when empty) so `spec` is never a null
  YAML value. The CRD schema requires `spec` to be present, and a bare
  `spec:` with no children renders as null when every other field below
  is also left at its falsy chart default, which the API server rejects
  with "spec: Required value" on both create and update.
  */}}
  gridId: {{ .Values.gridNetwork.gridId | quote }}
  {{- with .Values.gridNetwork.region }}
  region: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridNetwork.zone }}
  zone: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridNetwork.seeds }}
  seeds:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.routingPolicy }}
  routingPolicy: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridNetwork.scoringPolicy }}
  {{- if .strategy }}
  scoringPolicy:
    strategy: {{ .strategy | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.gridNetwork.placementPolicy }}
  placementPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.admissionPolicy }}
  admissionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.selectionPolicy }}
  {{- if .mode }}
  selectionPolicy:
    mode: {{ .mode | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.gridNetwork.signalTransport }}
  {{- if .mode }}
  signalTransport:
    mode: {{ .mode | quote }}
  {{- end }}
  {{- end }}
  {{- with (.Values.gridNetwork.peerTrust).mode }}
  peerTrust:
    mode: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridNetwork.metricsRefreshInterval }}
  {{- if . }}
  metricsRefreshInterval: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.gridNetwork.budgetPolicy }}
  budgetPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.swim }}
  swim:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridNetwork.gatewayRefs }}
  gatewayRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
