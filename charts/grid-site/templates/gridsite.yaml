{{- include "grid-site.normalize" . }}
{{- if .Values.gridSite.name }}
apiVersion: grid.praxis.fast/v1alpha1
kind: GridSite
metadata:
  name: {{ .Values.gridSite.name }}
  labels:
    {{- include "grid-site.labels" . | nindent 4 }}
    {{- if .Values.gridSite.providerSiteLabel }}
    grid.praxis.fast/provider-site: {{ .Values.gridSite.providerSiteLabel | quote }}
    {{- end }}
spec:
  gridNetworkRef: {{ required "gridNetwork.name is required when gridSite is defined" .Values.gridNetwork.name }}
  {{- with .Values.gridSite.region }}
  region: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridSite.zone }}
  zone: {{ . | quote }}
  {{- end }}
  {{- with .Values.gridSite.gatewayEndpoint }}
  gatewayEndpoint:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gridSite.local }}
  {{- $local := deepCopy . }}
  {{- $signer := get $local "signerEndpoint" }}
  {{- /* Pin peer trust refuses a renewed leaf, so a signer renews only under spiffe unless told otherwise. */}}
  {{- if and (kindIs "map" $signer) (not (hasKey $signer "rotation")) (ne (dig "peerTrust" "mode" "" $.Values.gridNetwork) "spiffe") }}
  {{- $_ := set $signer "rotation" "Disabled" }}
  {{- end }}
  local:
    {{- toYaml $local | nindent 4 }}
  {{- end }}
{{- end }}
