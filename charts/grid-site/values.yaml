gridNetwork:
  name: grid
  gridId: ""
  # -- Create a GridSite for each SWIM peer and route to them. Unset, it is on when peers
  # are listed, else off, which keeps the clusterName overlay of existing networks.
  # autoDiscoverSites: true
  region: ""
  zone: ""
  seeds: []
  swim: {}
  tls: {}
  # New chart installations use stabilized admission parameters. Pressure
  # transitions require an active scoringPolicy and matching provider metrics
  # signalNames; otherwise admission remains new_and_existing. Omit this block
  # only for legacy instantaneous mode.
  admissionPolicy:
    mode: stabilized
    pressure:
      enterThreshold: 0.85
      exitThreshold: 0.70
      failureThreshold: 2
      successThreshold: 3
      minimumStateDuration: 10s
      recoveryHoldDown: 30s
    missingMetrics: existingOnly
  # -- Local selection mode. Set to null to leave it to the gateway default, deterministic.
  selectionPolicy:
    mode: roundRobin
  # -- Grid-wide signal propagation mode: gossip (default) or poll. Omit for
  # gossip (SWIM and CRDT overlay). poll propagates by direct mTLS pull. The
  # operator applies it at startup and restarts itself when it changes.
  # signalTransport:
  #   mode: poll
  # -- Grid-wide peer trust: pin (default) or spiffe. The operator applies it at
  # startup and, under poll, restarts itself when it changes.
  # peerTrust:
  #   mode: spiffe

gridSite:
  name: ""
  region: ""
  zone: ""
  providerSiteLabel: ""
  # -- This cluster's own site, rendered as spec.local: signerEndpoint names the signer it
  # enrolls and renews through, with caBundleRef ({kind: Secret|ConfigMap, name, key: ca.crt})
  # pinning the signer, required with an invite, gridCaBundleRef anchoring the grid CA when
  # it differs, and rotation (Enabled or Disabled) saying whether the operator renews through
  # it; inviteSecretRef names the Secret holding its invite token (key: token). Unset,
  # rotation renders Disabled unless gridNetwork.peerTrust.mode is spiffe, since pin peer
  # trust refuses a renewed leaf. Set on this cluster's own site only. To use the example,
  # remove the empty `local: {}` and uncomment the block below it.
  local: {}
  # local:
  #   signerEndpoint:
  #     url: https://enroll.grid.example.com:8443
  #     caBundleRef: {kind: Secret, name: grid-ca-bundle}
  #   inviteSecretRef:
  #     name: grid-invite-site-a

# -- Remote sites this site trusts, keyed by site name, one GridSite <network>-<name>
# each, the name the operator gives a peer it discovers. Listing peers also turns on
# site discovery and the TLS Secrets the operator writes, unless those are set.
# address is the peer gateway the operator probes, verifying serverName (default
# <name>.grid.internal). digest pins the peer's leaf. To rotate, set nextDigest to the
# new digest, then move it to digest once the peer is Active.
peers: {}
#   site-a:
#     address: 203.0.113.20:8080
#     digest: <64 lowercase hex>

# -- InferenceProviders keyed by name. model defaults to the name, providerKind to vllm,
# and backendKind to local_model. The older list of full InferenceProvider specs still
# renders.
# inferenceProviders:
#   my-model:
#     endpoint: http://10.96.0.20:8000

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
