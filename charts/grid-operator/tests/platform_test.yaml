suite: platform load balancers
templates:
  - templates/service-swim.yaml
  - templates/service-signals.yaml
release:
  name: grid
  namespace: grid-system
# The objects a platform install creates: the platform base and the OpenShift flavor, which
# sets platform aws.
values:
  - ../../../deploy/operator/values.yaml
  - ../../../deploy/overlays/openshift/values.yaml
tests:
  - it: exposes SWIM on an internal network load balancer that carries UDP
    template: templates/service-swim.yaml
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports
          value:
            - name: swim-udp
              port: 7946
              targetPort: swim-udp
              protocol: UDP
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "true"

  - it: spreads SWIM and signals across zones so a peer never reaches a zone with no target
    asserts:
      - template: templates/service-signals.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled"]
          value: "true"
      - template: templates/service-swim.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled"]
          value: "true"

  - it: health checks SWIM over HTTP on the health check node port, which needs Local
    template: templates/service-swim.yaml
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: exposes signals on an internal network load balancer that carries TCP
    template: templates/service-signals.yaml
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.ports[0].port
          value: 9091
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "true"

  - it: makes both load balancers internet-facing when the scope is external
    set:
      loadBalancerScope: external
    asserts:
      - template: templates/service-swim.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "false"
      - template: templates/service-signals.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "false"
      - template: templates/service-swim.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb
      - template: templates/service-signals.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb

  - it: lets a Service's own annotation override the platform's
    set:
      swim.service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    template: templates/service-swim.yaml
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "false"

  - it: adds no AWS annotations without the aws platform
    set:
      platform: ""
    asserts:
      - template: templates/service-swim.yaml
        equal:
          path: spec.type
          value: LoadBalancer
      - template: templates/service-signals.yaml
        equal:
          path: spec.type
          value: LoadBalancer
      - template: templates/service-swim.yaml
        notExists:
          path: metadata.annotations
      - template: templates/service-signals.yaml
        notExists:
          path: metadata.annotations

  - it: carries every cloud's internal keys with platform any
    template: templates/service-swim.yaml
    set:
      platform: any
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "true"
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/azure-load-balancer-internal"]
          value: "true"
      - equal:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]
          value: Internal
      - equal:
          path: metadata.annotations["networking.gke.io/internal-load-balancer-allow-global-access"]
          value: "true"

  - it: drops the Azure and GCP internal keys and sets AWS false with platform any and scope external
    template: templates/service-swim.yaml
    set:
      platform: any
      loadBalancerScope: external
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]
          value: "false"
      - notExists:
          path: metadata.annotations["service.beta.kubernetes.io/azure-load-balancer-internal"]
      - notExists:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]

  - it: carries only Azure's key with platform azure
    template: templates/service-swim.yaml
    set:
      platform: azure
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/azure-load-balancer-internal"]
          value: "true"
      - notExists:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
      - notExists:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]

  - it: carries only GCP's keys with platform gcp
    template: templates/service-swim.yaml
    set:
      platform: gcp
    asserts:
      - equal:
          path: metadata.annotations["networking.gke.io/load-balancer-type"]
          value: Internal
      - equal:
          path: metadata.annotations["networking.gke.io/internal-load-balancer-allow-global-access"]
          value: "true"
      - notExists:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
      - notExists:
          path: metadata.annotations["service.beta.kubernetes.io/azure-load-balancer-internal"]
