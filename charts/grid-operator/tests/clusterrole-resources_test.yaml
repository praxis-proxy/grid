suite: resources ClusterRole
templates:
  - templates/clusterrole-resources.yaml
release:
  name: grid-operator
tests:
  - it: lets auto-enroll read the token and write the identity Secrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "patch"]
  - it: grants exactly the Secret, Service, gateway roll, Event, and ConfigMap rules by default
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "create", "patch"]
            - apiGroups: [""]
              resources: ["services"]
              resourceNames: ["provider-gateway", "grid-operator-swim", "grid-operator-signals"]
              verbs: ["get"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              resourceNames: ["provider-gateway"]
              verbs: ["get", "patch"]
            - apiGroups: ["events.k8s.io"]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "create", "patch", "update"]
  - it: grants no Deployment access of its own
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "patch"]
  - it: lets rotation roll only the gateway Deployment
    set:
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            resourceNames: ["grid-gateway"]
            verbs: ["get", "patch"]
      - notContains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "patch"]
  - it: grants the gateway roll without enrollment, since any identified site renews
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            resourceNames: ["provider-gateway"]
            verbs: ["get", "patch"]
