suite: grid values
templates:
  - templates/gridnetwork.yaml
  - templates/gridsite.yaml
  - templates/deployment.yaml
  - templates/service-swim.yaml
  - templates/inferenceprovider.yaml
tests:
  - it: renders no grid resources without grid.id
    templates:
      - templates/gridnetwork.yaml
      - templates/gridsite.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the GridNetwork from the flat grid values, after the CRDs
    template: templates/gridnetwork.yaml
    set:
      site.name: east
      grid.id: lab
      grid.peerTrust: spiffe
      grid.signals: poll
      grid.seeds: ["192.0.2.10:7946"]
    release:
      namespace: grid
    asserts:
      - equal:
          path: metadata.labels["grid.praxis.fast/auto-discover-sites"]
          value: "true"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true
      - equal:
          path: spec
          value:
            gridId: lab
            seeds: ["192.0.2.10:7946"]
            signalTransport: {mode: poll}
            peerTrust: {mode: spiffe}
            consumerGateways:
              - {name: grid-gateway, namespace: grid, siteName: east}
            tls:
              siteSecretRef: {name: grid-site-identity, namespace: grid}
              caSecretRef: {name: grid-ca, namespace: grid}
              swimKeySecretRef: {name: grid-swim-key, namespace: grid}

  - it: passes gateway.praxisConfig through to the site gateway reference
    template: templates/gridnetwork.yaml
    set:
      site.name: east
      grid.id: lab
      gateway.praxisConfig:
        generate: true
        deriveTopology:
          fromProviders: [qwen3]
    release:
      namespace: grid
    asserts:
      - equal:
          path: spec.consumerGateways
          value:
            - name: grid-gateway
              namespace: grid
              siteName: east
              praxisConfig:
                generate: true
                deriveTopology:
                  fromProviders: [qwen3]

  - it: renders this site's GridSite named after it
    template: templates/gridsite.yaml
    set:
      site: {name: east, region: us-east, zone: us-east-1a}
      grid.id: lab
    asserts:
      - equal:
          path: metadata.name
          value: east
      - equal:
          path: metadata.labels["grid.praxis.fast/provider-site"]
          value: east
      - equal:
          path: spec
          value: {gridNetworkRef: grid, region: us-east, zone: us-east-1a}

  - it: maps the flat values onto the SWIM and signals knobs
    template: templates/deployment.yaml
    set:
      site.name: east
      grid.id: lab
      grid.signals: poll
      grid.seeds: ["192.0.2.10:7946", "192.0.2.11:7946"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SITE_NAME, value: east}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SEEDS, value: "192.0.2.10:7946,192.0.2.11:7946"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SIGNALS_LOCAL_ADDR, value: "RELEASE-NAME-grid-operator-signals.$(POD_NAMESPACE).svc:9091"}

  - it: leaves signals off until grid.id is set
    template: templates/deployment.yaml
    set:
      site.name: east
      grid.signals: poll
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SIGNALS_LOCAL_ADDR, value: "RELEASE-NAME-grid-operator-signals.$(POD_NAMESPACE).svc:9091"}

  - it: keeps the old keys when both are set
    template: templates/deployment.yaml
    set:
      site.name: east
      swim.siteName: legacy
      swim.seeds: "198.51.100.1:7946"
      grid.seeds: ["192.0.2.10:7946"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SITE_NAME, value: legacy}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SEEDS, value: "198.51.100.1:7946"}

  - it: refuses a grid without a site name
    template: templates/gridnetwork.yaml
    set:
      grid.id: lab
    asserts:
      - failedTemplate:
          errorPattern: grid.id needs site.name

  - it: renders keyed providers with the grid-site defaults
    template: templates/inferenceprovider.yaml
    set:
      site.name: east
      grid.id: lab
      grid.providers:
        qwen3:
          model: Qwen3-Coder-30B-A3B
          endpoint: http://qwen3.llm-d.svc:80
          clusterName: east
    asserts:
      - equal:
          path: metadata.name
          value: qwen3
      - equal:
          path: spec
          value:
            gridNetworkRef: grid
            providerKind: vllm
            backendKind: local_model
            endpoint: http://qwen3.llm-d.svc:80
            clusterName: east
            models:
              - name: Qwen3-Coder-30B-A3B
                capabilities: [text_generation]

  - it: translates legacy provider values to current CRD fields
    template: templates/inferenceprovider.yaml
    set:
      site.name: east
      grid.id: lab
      grid.providers:
        qwen3:
          model: Qwen3-Coder-30B-A3B
          endpoint: http://qwen3.llm-d.svc:80
          routingClusterRef: east
          gatewayRef: provider-gateway
          metricsConfig:
            metricsEndpoint: http://metrics.example.com:9090
          auth:
            manual: true
    asserts:
      - equal:
          path: spec.clusterName
          value: east
      - equal:
          path: spec.providerGateway
          value: provider-gateway
      - equal:
          path: spec.metricsConfig.endpoint
          value: http://metrics.example.com:9090
      - equal:
          path: spec.auth.credentialsManagedExternally
          value: true
      - notExists:
          path: spec.routingClusterRef
      - notExists:
          path: spec.gatewayRef

  - it: drops an empty legacy provider value beside its current field
    template: templates/inferenceprovider.yaml
    set:
      site.name: east
      grid.id: lab
      grid.providers:
        qwen3:
          endpoint: http://qwen3.llm-d.svc:80
          auth:
            manual: false
            credentialsManagedExternally: true
    asserts:
      - equal:
          path: spec.auth.credentialsManagedExternally
          value: true
      - notExists:
          path: spec.auth.manual

  - it: keeps YAML-ambiguous names strings
    templates:
      - templates/gridnetwork.yaml
      - templates/gridsite.yaml
      - templates/inferenceprovider.yaml
    set:
      site.name: "true"
      grid.id: lab
      grid.network: "yes"
      grid.providers:
        "null":
          endpoint: http://m.llm-d.svc:80
    asserts:
      - isKind:
          of: GridNetwork
        template: templates/gridnetwork.yaml
      - equal:
          path: metadata.name
          value: "yes"
        template: templates/gridnetwork.yaml
      - equal:
          path: metadata.name
          value: "true"
        template: templates/gridsite.yaml
      - equal:
          path: spec.gridNetworkRef
          value: "yes"
        template: templates/gridsite.yaml
      - equal:
          path: metadata.name
          value: "null"
        template: templates/inferenceprovider.yaml
      - equal:
          path: spec.gridNetworkRef
          value: "yes"
        template: templates/inferenceprovider.yaml

  - it: gives a bare seed the SWIM port in the GridNetwork and the operator alike
    set:
      site.name: east
      grid.id: lab
      grid.seeds: ["swim-a.example.com", "192.0.2.10"]
    asserts:
      - template: templates/gridnetwork.yaml
        equal:
          path: spec.seeds
          value: ["swim-a.example.com:7946", "192.0.2.10:7946"]
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SEEDS, value: "swim-a.example.com:7946,192.0.2.10:7946"}

  - it: gives a bracketed IPv6 seed the configured SWIM port and preserves an explicit port
    set:
      site.name: east
      grid.id: lab
      swim.service.port: 7947
      grid.seeds: ["[2001:db8::1]", "[2001:db8::2]:7948"]
    asserts:
      - template: templates/gridnetwork.yaml
        equal:
          path: spec.seeds
          value: ["[2001:db8::1]:7947", "[2001:db8::2]:7948"]
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_SWIM_SEEDS, value: "[2001:db8::1]:7947,[2001:db8::2]:7948"}

  - it: leaves the records to the chart when grid.id renders them
    template: templates/deployment.yaml
    set:
      site.name: east
      grid.id: lab
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_CREATE_LOCAL_RECORDS, value: "false"}

  - it: leaves the records to an enrolling release from its first install, before grid.id
    template: templates/deployment.yaml
    set:
      site.name: east
      enrollment.enabled: true
      enrollment.url: https://enroll.example.com
      enrollment.caBundle.secret: grid-ca
      enrollment.tokenSecretRef.name: grid-invite
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_CREATE_LOCAL_RECORDS, value: "false"}

  - it: lets the operator create the records when the chart renders none
    template: templates/deployment.yaml
    set:
      site.name: east
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_CREATE_LOCAL_RECORDS, value: "false"}

  - it: names the GridNetwork the operator creates after grid.network
    template: templates/deployment.yaml
    set:
      site.name: east
      grid.network: lab-net
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRID_NETWORK, value: lab-net}
