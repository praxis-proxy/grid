suite: network policy
templates:
  - templates/networkpolicy.yaml
release:
  name: gop
  namespace: grid
tests:
  - it: is off outside OpenShift by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is on by default on OpenShift
    capabilities:
      apiVersions: [security.openshift.io/v1]
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: grid-operator
            app.kubernetes.io/instance: gop

  - it: keeps SWIM and signals open to every peer
    capabilities:
      apiVersions: [security.openshift.io/v1]
    set:
      signals.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0]
          value:
            ports:
              - { port: swim-udp, protocol: UDP }
              - { port: signals, protocol: TCP }

  - it: keeps signals open on an enrolled poll site, whose metrics port serves TLS
    capabilities:
      apiVersions: [security.openshift.io/v1]
    set:
      swim.siteName: hub
      enrollment.enabled: true
      grid.signals: poll
      signals.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0]
          value:
            ports:
              - { port: swim-udp, protocol: UDP }
              - { port: signals, protocol: TCP }

  - it: opens no signals port when signals are off
    capabilities:
      apiVersions: [security.openshift.io/v1]
    asserts:
      - equal:
          path: spec.ingress[0]
          value:
            ports:
              - { port: swim-udp, protocol: UDP }

  - it: admits only the monitoring namespaces to the metrics port
    capabilities:
      apiVersions: [security.openshift.io/v1]
    asserts:
      - equal:
          path: spec.ingress[1].ports
          value:
            - { port: metrics, protocol: TCP }
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openshift-user-workload-monitoring } }
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openshift-monitoring } }
            - podSelector: { matchLabels: { app.kubernetes.io/instance: gop, app.kubernetes.io/component: helm-test } }

  - it: takes a custom monitoring selector
    set:
      networkPolicy.enabled: true
      networkPolicy.metricsFrom:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
            - podSelector: { matchLabels: { app.kubernetes.io/instance: gop, app.kubernetes.io/component: helm-test } }

  - it: an explicit false stays off on OpenShift
    capabilities:
      apiVersions: [security.openshift.io/v1]
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses an empty peer list, which would admit every pod
    set:
      networkPolicy.enabled: true
      networkPolicy.metricsFrom: []
    asserts:
      - failedTemplate: {}
