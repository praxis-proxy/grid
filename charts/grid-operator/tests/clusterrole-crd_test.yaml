suite: ClusterRole CRD template
templates:
  - templates/clusterrole-crd.yaml
tests:
  - it: omits agenttoagentproviders from the default ClusterRole
    asserts:
      - notContains:
          path: rules[0].resources
          content: agenttoagentproviders

  - it: omits agenttoagentproviders when the experimental profile is null
    set:
      experimental: null
    asserts:
      - notContains:
          path: rules[0].resources
          content: agenttoagentproviders

  - it: grants A2A verbs only in the experimental profile
    set:
      experimental.a2a.enabled: true
    asserts:
      - contains:
          path: rules[0].resources
          content: agenttoagentproviders
      - equal:
          path: rules[0].verbs
          value: ["get", "list", "watch", "patch"]
      - contains:
          path: rules[2].resources
          content: agenttoagentproviders/status
      - equal:
          path: rules[2].verbs
          value: ["get", "patch"]

  - it: grants agenttoolproviders the same verbs as gridnetworks and inferenceproviders
    asserts:
      - contains:
          path: rules[0].resources
          content: agenttoolproviders
      - equal:
          path: rules[0].verbs
          value: ["get", "list", "watch", "patch"]

  - it: grants agenttoolproviders/status get and patch, mirroring the other status subresources
    asserts:
      - contains:
          path: rules[2].resources
          content: agenttoolproviders/status
      - equal:
          path: rules[2].verbs
          value: ["get", "patch"]

  - it: grants gridsites delete for collecting departed auto-discovered sites
    asserts:
      - contains:
          path: rules[1].resources
          content: gridsites
      - equal:
          path: rules[1].verbs
          value: ["get", "list", "watch", "patch", "create", "update", "delete"]

  - it: grants gridnetworks create, so the operator can create its own grid
    asserts:
      - contains:
          path: rules[3].resources
          content: gridnetworks
      - equal:
          path: rules[3].verbs
          value: ["create"]

  - it: renders nothing when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
