suite: operator enrollment through the operator config
templates:
  - templates/configmap-operator-config.yaml
  - templates/deployment.yaml
set:
  enrollment.url: https://enroll.example.com
  enrollment.siteName: site-d
  enrollment.caBundle.configMap: grid-ca
  enrollment.tokenSecretRef.name: grid-invite-site-d
tests:
  - it: renders the site, its signer and its invite into the operator config
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: grid-operator-config
      - equal:
          path: data["config.yaml"]
          value: |
            site:
              name: "site-d"
              signerEndpoint:
                url: "https://enroll.example.com"
                caBundleRef:
                  kind: ConfigMap
                  name: "grid-ca"
                  key: "ca.crt"
                rotation: "Disabled"
              inviteSecretRef:
                name: "grid-invite-site-d"
                key: "token"

  - it: names the ConfigMap on the operator, and renders no enrollment env
    template: templates/deployment.yaml
    set:
      enrollment.enabled: true
      operatorConfig.name: site-d-operator
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_OPERATOR_CONFIG, value: site-d-operator }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_ENROLL_ENABLED, value: "true" }
      - notExists:
          path: spec.template.spec.volumes

  - it: renders the ConfigMap under the configured name
    template: templates/configmap-operator-config.yaml
    set:
      operatorConfig.name: site-d-operator
    asserts:
      - equal:
          path: metadata.name
          value: site-d-operator

  - it: leaves the ConfigMap to the admin when told to
    template: templates/configmap-operator-config.yaml
    set:
      operatorConfig.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: pins the signer from a Secret with a custom key
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.caBundle.configMap: ""
      enrollment.caBundle.secret: grid-ca-bundle
      enrollment.caBundle.key: bundle.pem
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'caBundleRef:\n +kind: Secret\n +name: "grid-ca-bundle"\n +key: "bundle.pem"'

  - it: reads the token from a custom key
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.tokenSecretRef.key: site-token
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'inviteSecretRef:\n +name: "grid-invite-site-d"\n +key: "site-token"'

  - it: anchors the returned CA to gridCaBundle when set
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.gridCaBundle.secret: grid-ca-anchor
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'gridCaBundleRef:\n +kind: Secret\n +name: "grid-ca-anchor"\n +key: "ca.crt"'

  - it: anchors to the TLS pin by default
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: gridCaBundleRef

  - it: a hub whose identity bootstrap issued renews with only the URL, pinned to its grid CA
    template: templates/configmap-operator-config.yaml
    set:
      swim.siteName: hub
      enrollment.siteName: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            site:
              name: "hub"
              signerEndpoint:
                url: "https://enroll.example.com"
                rotation: "Disabled"

  - it: renders an empty document without enrollment or a URL
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.url: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
    asserts:
      - equal:
          path: data["config.yaml"]
          value: ""

  - it: defaults the URL to the in-cluster grid-enrollment Service
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.url: ""
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'url: "https://grid-enrollment.grid-enrollment.svc:8443"'

  - it: refuses a grid CA from both a ConfigMap and a Secret
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.gridCaBundle.secret: a
      enrollment.gridCaBundle.configMap: b
    asserts:
      - failedTemplate:
          errorPattern: "enrollment[./]gridCaBundle"

  - it: refuses a pin from both a ConfigMap and a Secret
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.caBundle.secret: a
    asserts:
      - failedTemplate:
          errorPattern: "enrollment[./]caBundle"

  - it: refuses a site name too long for its invite Secret
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.siteName: a23456789-123456789-123456789-123456789-123456789-12
    asserts:
      - failedTemplate:
          errorPattern: "enrollment[./]siteName"

  - it: refuses a plaintext URL
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.url: http://enroll.example.com
    asserts:
      - failedTemplate:
          errorPattern: "enrollment[./]url"

  - it: requires a site name
    template: templates/deployment.yaml
    set:
      enrollment.enabled: true
      enrollment.siteName: ""
      enrollment.url: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
    asserts:
      - failedTemplate:
          errorPattern: enrollment.siteName is required

  - it: refuses a signer URL with no site to name
    template: templates/deployment.yaml
    set:
      enrollment.siteName: ""
      swim.siteName: ""
    asserts:
      - failedTemplate:
          errorPattern: "needs a site name"

  - it: refuses a renamed identity Secret no rendered GridNetwork names
    template: templates/deployment.yaml
    set:
      enrollment.enabled: true
      enrollment.url: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
      enrollment.identitySecretName: east-identity
    asserts:
      - failedTemplate:
          errorPattern: "set grid.id, or keep grid-site-identity and grid-ca"

  - it: keeps an explicit rotation under spiffe peer trust
    template: templates/configmap-operator-config.yaml
    set:
      grid.peerTrust: spiffe
      enrollment.enabled: true
      enrollment.rotation: Disabled
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rotation: "Disabled"'

  - it: renders rotation Disabled under pin peer trust, the default
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rotation: "Disabled"'

  - it: leaves rotation to the operator default under spiffe peer trust
    template: templates/configmap-operator-config.yaml
    set:
      grid.peerTrust: spiffe
      enrollment.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: rotation

  - it: refuses rotation with no signer to carry it
    template: templates/deployment.yaml
    set:
      enrollment.enabled: false
      enrollment.url: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
      enrollment.rotation: Disabled
    asserts:
      - failedTemplate:
          errorPattern: "sits under signerEndpoint"

  - it: refuses the old rotation switch
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.rotation.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "rotation"

  - it: defaults the token Secret to grid-invite-<siteName>
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.tokenSecretRef.name: ""
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'inviteSecretRef:\n +name: "grid-invite-site-d"'

  - it: defaults the pinned bundle to the grid-ca-bundle Secret
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.caBundle.configMap: ""
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'caBundleRef:\n +kind: Secret\n +name: "grid-ca-bundle"'

  - it: defaults both refs when they are nulled
    template: templates/configmap-operator-config.yaml
    set:
      enrollment.enabled: true
      enrollment.caBundle: null
      enrollment.tokenSecretRef: null
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "grid-invite-site-d"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: "grid-ca-bundle"'

  - it: names the SWIM site after the enrolling site
    template: templates/deployment.yaml
    set:
      enrollment.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SWIM_SITE_NAME
            value: site-d

  - it: keeps an explicit SWIM site name
    template: templates/deployment.yaml
    set:
      enrollment.enabled: true
      swim.siteName: other
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SWIM_SITE_NAME
            value: other

  - it: sets no SWIM site name from a disabled enrollment
    template: templates/deployment.yaml
    set:
      enrollment.url: ""
      enrollment.caBundle.configMap: ""
      enrollment.tokenSecretRef.name: ""
      site.name: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SWIM_SITE_NAME
            value: site-d
