suite: enrolled site defaults
templates:
  - templates/deployment.yaml
  - templates/configmap-operator-config.yaml
  - templates/service-swim.yaml
  - templates/rolebindings-resources.yaml
release:
  name: grid-operator
  namespace: grid
tests:
  - it: a hub needs only its site name and enrollment on
    template: templates/deployment.yaml
    set:
      swim.siteName: hub
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_SWIM_SITE_NAME, value: hub }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_GATEWAY_SERVICE_NAME, value: grid-gateway }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_ENROLL_URL, value: "https://grid-enrollment.grid-enrollment.svc:8443" }

  - it: a hub's operator config enrolls through the in-cluster signer, rotation Disabled under pin
    template: templates/configmap-operator-config.yaml
    set:
      swim.siteName: hub
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            site:
              name: "hub"
              signerEndpoint:
                url: "https://grid-enrollment.grid-enrollment.svc:8443"
                caBundleRef:
                  kind: Secret
                  name: "grid-ca-bundle"
                  key: "ca.crt"
                rotation: "Disabled"
              inviteSecretRef:
                name: "grid-invite-hub"
                key: "token"

  - it: a hub whose bootstrap issued its identity names its signer with enrollment off
    template: templates/configmap-operator-config.yaml
    set:
      swim.siteName: hub
      enrollment.hub: true
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            site:
              name: "hub"
              signerEndpoint:
                url: "https://grid-enrollment.grid-enrollment.svc:8443"
                rotation: "Disabled"

  - it: a hub with enrollment off allows its in-cluster signer host and guards its namespace
    templates:
      - templates/deployment.yaml
      - templates/rolebindings-resources.yaml
    set:
      swim.siteName: hub
      enrollment.hub: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_SIGNER_HOSTS, value: "grid-enrollment.grid-enrollment.svc:8443" }
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: GRID_CREATE_LOCAL_RECORDS, value: "false" }
        template: templates/deployment.yaml

  - it: a hub with enrollment off and its own hubPort names that port
    template: templates/configmap-operator-config.yaml
    set:
      swim.siteName: hub
      enrollment.hub: true
      enrollment.hubPort: 9443
      rbac.enrollmentNamespace: signer
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'url: "https://grid-enrollment\.signer\.svc:9443"'

  - it: a hub under spiffe leaves rotation to the operator default, Enabled
    template: templates/configmap-operator-config.yaml
    set:
      swim.siteName: hub
      grid.peerTrust: spiffe
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: rotation

  - it: enrollment brings a LoadBalancer SWIM Service
    template: templates/service-swim.yaml
    set:
      swim.siteName: hub
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: an explicit SWIM Service setting wins over the enrollment default
    template: templates/service-swim.yaml
    set:
      swim.siteName: hub
      enrollment.enabled: true
      enrollment.hub: true
      swim.service.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: without enrollment there is no SWIM Service, as before
    template: templates/service-swim.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: an explicit SWIM Service stays ClusterIP without a type, as before
    template: templates/service-swim.yaml
    set:
      swim.service.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: enrollment guards the grid-enrollment namespace by default
    template: templates/rolebindings-resources.yaml
    release:
      namespace: grid-enrollment
    set:
      swim.siteName: hub
      enrollment.enabled: true
      enrollment.hub: true
    asserts:
      - failedTemplate:
          errorPattern: must not get operator Secret access
