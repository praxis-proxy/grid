suite: signals endpoint
templates:
  - templates/deployment.yaml
  - templates/service-swim.yaml
  - templates/service-signals.yaml
release:
  name: grid
  namespace: grid-system
tests:
  - it: is off by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: signals
            containerPort: 9091
            protocol: TCP

  - it: serves signals on their own Service, with gossip left UDP only
    set:
      signals.enabled: true
      swim.service.enabled: true
      swim.service.type: LoadBalancer
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_LOCAL_ADDR
            value: grid-grid-operator-signals.grid-system.svc:9091
      - template: templates/deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_ADDR
          any: true
      - template: templates/service-signals.yaml
        contains:
          path: spec.ports
          content:
            name: signals
            port: 9091
            targetPort: signals
            protocol: TCP
      # A mixed-protocol Service is refused outright by some providers, AWS among them,
      # so gossip must stay the only port on the SWIM Service.
      - template: templates/service-swim.yaml
        lengthEqual:
          path: spec.ports
          count: 1
      - template: templates/service-swim.yaml
        contains:
          path: spec.ports
          content:
            name: swim-udp
            port: 7946
            targetPort: swim-udp
            protocol: UDP

  - it: maps the Service port to the binary's default listener
    set:
      signals.enabled: true
      signals.port: 19091
      swim.service.enabled: true
      swim.service.type: LoadBalancer
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: signals
            containerPort: 9091
            protocol: TCP
      - template: templates/service-signals.yaml
        contains:
          path: spec.ports
          content:
            name: signals
            port: 19091
            targetPort: signals
            protocol: TCP
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_LOCAL_ADDR
            value: grid-grid-operator-signals.grid-system.svc:19091

  - it: renders the signals advertise override
    template: templates/deployment.yaml
    set:
      signals.enabled: true
      signals.advertiseAddress: signals.example.com:9091
      swim.service.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_ADVERTISE_ADDR
            value: signals.example.com:9091

  - it: refuses Cluster traffic policy on a signals LoadBalancer
    template: templates/deployment.yaml
    set:
      signals.enabled: true
      swim.service.enabled: true
      swim.service.type: LoadBalancer
      swim.service.externalTrafficPolicy: Cluster
    asserts:
      - failedTemplate:
          errorPattern: "externalTrafficPolicy Local"

  - it: needs the SWIM Service
    template: templates/deployment.yaml
    set:
      signals.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "signals.enabled needs swim.service.enabled"

  - it: limits LoadBalancer sources for SWIM and signals together
    template: templates/service-swim.yaml
    set:
      signals.enabled: true
      swim.service.enabled: true
      swim.service.type: LoadBalancer
      swim.service.loadBalancerSourceRanges: ["203.0.113.0/24"]
    asserts:
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["203.0.113.0/24"]

  - it: starts the operator in the declared modes, so its GridNetwork appearing restarts nothing
    set:
      grid.id: grid-1
      grid.signals: poll
      grid.peerTrust: pin
      signals.enabled: true
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNAL_TRANSPORT
            value: poll
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_PEER_TRUST
            value: pin

  - it: leaves the startup modes to the operator default when the install declares none
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNAL_TRANSPORT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_PEER_TRUST
          any: true

  - it: takes peers as one flag, feeding the seeds and both source ranges
    set:
      platform: aws
      signals.enabled: true
      swim.service.enabled: true
      swim.service.type: LoadBalancer
      peers: "54.244.133.77 32.188.215.118, peer-a.example.com"
    asserts:
      # A name cannot become a host route, so it seeds but contributes no range.
      - template: templates/service-swim.yaml
        equal:
          path: spec.loadBalancerSourceRanges
          value: ["54.244.133.77/32", "32.188.215.118/32"]
      - template: templates/service-signals.yaml
        equal:
          path: spec.loadBalancerSourceRanges
          value: ["54.244.133.77/32", "32.188.215.118/32"]
      - template: templates/service-signals.yaml
        equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SWIM_SEEDS
            value: "54.244.133.77:7946,32.188.215.118:7946,peer-a.example.com:7946"

  - it: lets explicit seeds and ranges override peers
    set:
      signals.enabled: true
      swim.service.enabled: true
      swim.service.type: LoadBalancer
      peers: "10.0.0.1 10.0.0.2"
      swim.seeds: "seed-a:7946"
      swim.service.loadBalancerSourceRanges: ["192.0.2.0/24"]
    asserts:
      - template: templates/service-swim.yaml
        equal:
          path: spec.loadBalancerSourceRanges
          value: ["192.0.2.0/24"]
      - template: templates/service-signals.yaml
        equal:
          path: spec.loadBalancerSourceRanges
          value: ["192.0.2.0/24"]
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SWIM_SEEDS
            value: "seed-a:7946"

  - it: sets the peer poll interval only when asked
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_PEER_INTERVAL_SECS
            value: "5"

  - it: leaves the interval to the operator when unset
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_PEER_INTERVAL_SECS
          any: true

  - it: refuses an interval the operator would exit on
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: -5
    asserts:
      - failedTemplate: {}

  - it: refuses a non-numeric interval
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: often
    asserts:
      - failedTemplate: {}

  - it: refuses zero, which Helm would drop for the default without saying so
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: 0
    asserts:
      - failedTemplate: {}

  - it: takes one second, the floor
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_PEER_INTERVAL_SECS
            value: "1"

  - it: refuses an interval past what the operator can parse
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: "18446744073709551616"
    asserts:
      - failedTemplate: {}

  - it: refuses an interval past the ceiling
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: 100000
    asserts:
      - failedTemplate: {}

  - it: takes the ceiling
    template: templates/deployment.yaml
    set:
      grid.id: aws
      site.name: east
      signals.enabled: true
      swim.service.enabled: true
      signals.peerIntervalSeconds: 99999
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRID_SIGNALS_PEER_INTERVAL_SECS
            value: "99999"
