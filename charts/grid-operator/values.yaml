# -- This site. name defaults swim.siteName, and through it enrollment.siteName.
site:
  # -- Site name, a DNS label.
  name: ""
  # -- Deployment region.
  region: ""
  # -- Availability zone.
  zone: ""

# -- The grid this site joins. Setting id renders the GridNetwork and this site's
# GridSite, with site discovery on. They need the grid CRDs first, so plain Helm sets id
# on an upgrade after the first install; Argo CD orders them by sync wave.
grid:
  # -- GridNetwork name.
  network: grid
  # -- Grid identifier. Empty renders no GridNetwork or GridSite.
  id: ""
  # -- Peer trust, pin or spiffe. Empty keeps the GridNetwork default, pin. The operator
  # also starts in it before any GridNetwork exists, so set it to match the grid.
  peerTrust: ""
  # -- Signal transport, gossip or poll. poll also serves signals on the SWIM Service.
  # Empty keeps the GridNetwork default, gossip. The operator also starts in it before any
  # GridNetwork exists, so a poll install never restarts once its network appears.
  signals: ""
  # -- SWIM seed endpoints (ip:port, [ipv6]:port, or hostname:port). Defaults swim.seeds.
  seeds: []
  # -- Secret holding the grid's SWIM key (key, 32 bytes). Empty runs SWIM without one.
  swimKeySecretName: grid-swim-key
  # -- InferenceProviders this site serves, keyed by name, as in the grid-site chart.
  # model defaults to the name, providerKind to vllm, and backendKind to local_model.
  providers: {}
  #   qwen3:
  #     model: Qwen3-Coder-30B-A3B
  #     endpoint: http://qwen3-epp-service.llm-d.svc:80
  #     routingClusterRef: site-d

# -- Grid CRDs.
crds:
  # -- Install and upgrade the CRDs. Set false when the platform owns them, or for a second release in the cluster.
  enabled: true
  # -- Keep the CRDs on helm uninstall and an Argo CD delete or prune.
  keep: true

# -- Number of operator replicas. Must be 1 until multi-replica operation
# is qualified.
replicaCount: 1

# -- Operator container image settings.
image:
  # -- Image repository.
  repository: ghcr.io/praxis-proxy/grid-operator
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Immutable image digest (sha256:<64 hex>). When set, tag is ignored.
  digest: ""
  # -- Image pull policy.
  pullPolicy: "IfNotPresent"

# -- Pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""
# -- Labels added to all chart-managed resources.
commonLabels: {}
# -- Labels added to the operator pod template.
podLabels: {}
# -- Annotations added to the operator pod template.
podAnnotations: {}

# -- ServiceAccount configuration.
serviceAccount:
  # -- Create a ServiceAccount for the operator.
  create: true
  # -- ServiceAccount name. When create is true, defaults to the release
  # fullname. When create is false, defaults to "default".
  name: ""
  # -- Annotations on the ServiceAccount (e.g. for IAM role binding).
  annotations: {}

# -- RBAC configuration.
rbac:
  # -- Create ClusterRoles, ClusterRoleBindings, and RoleBindings.
  create: true
  # -- The grid-enrollment namespace. The render fails if the operator would get Secret
  # access there. Defaults to grid-enrollment with enrollment on.
  enrollmentNamespace: ""
  # -- Create the metrics scraper ServiceAccount, allowed only GET on the nonResourceURL
  # /metrics, and let the operator mint short-lived tokens for it. An llm-d EPP serving
  # bearer-authenticated metrics (the default) admits a scrape with that token
  # (metricsConfig.auth type serviceAccountToken). The operator never sends its own token.
  metricsScraper: true

# -- Additional namespaces where the operator needs Secret, ConfigMap,
# Event, and Service access. The release namespace is always included.
resourceNamespaces: []

# -- Logging, rendered as RUST_LOG.
log:
  # -- Level for every module: error, warn, info, debug, or trace. A full RUST_LOG
  # directive still works here, as before; prefer filter for one.
  level: "info"
  # -- Full RUST_LOG directive, such as "info,operator=debug". When set, it replaces level.
  filter: ""

# Signal propagation mode is grid-wide configuration, set on the GridNetwork
# via the grid-site chart's signalTransport value, not on the operator.

# -- Metrics and health server configuration.
metrics:
  # -- Metrics server bind address (host:port).
  bindAddress: "0.0.0.0:9090"
  # -- Metrics ClusterIP Service.
  service:
    # -- Create a ClusterIP Service for the metrics port.
    enabled: true
    # -- Service port number.
    port: 9090
    # -- Service annotations.
    annotations: {}
  # -- TLS on the metrics and health port.
  tls:
    # -- false serves plaintext. auto and true serve TLS from source.
    enabled: auto
    # -- auto picks existingSecret when set, else serviceCA on OpenShift, else siteIdentity
    # when grid.id or enrollment.enabled is set. An install with none of these, which
    # is no grid site, serves plaintext.
    # siteIdentity serves the enrolled grid-site-identity, read once enrollment writes it.
    source: auto
    # -- Secret holding tls.crt and tls.key for source existingSecret.
    existingSecret: ""
    # -- Mount path for the certificate and key.
    mountPath: "/etc/grid/metrics-tls"

# -- NetworkPolicy for the operator pod. SWIM and signals stay open, and the
# metrics and health port admits only metricsFrom. Kubelet probes are unaffected on OpenShift.
networkPolicy:
  # -- auto: on where OpenShift runs. true or false forces it.
  enabled: auto
  # -- NetworkPolicyPeer entries allowed to reach the metrics port. Must not be empty.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring

# -- SWIM protocol configuration.
swim:
  # -- SWIM bind address (host:port).
  bindAddress: "0.0.0.0:7946"
  # -- SWIM advertise endpoint (ip:port, [ipv6]:port, or hostname:port). Defaults to the LoadBalancer SWIM Service address, else the Pod IP.
  advertiseAddress: ""
  # -- Hold SWIM traffic until the GridNetwork key loads or the network declares none. false opts out.
  requireKey: true
  # -- Bootstrap SWIM site name. Defaults to enrollment.siteName when enrollment is on.
  siteName: ""
  # -- Bootstrap SWIM seed endpoints (comma-separated ip:port, [ipv6]:port, or hostname:port).
  seeds: ""
  # -- SWIM Service.
  service:
    # -- Create a Service for the SWIM port. Unset, it is on with enrollment, else off.
    # enabled: true
    # -- Service type: ClusterIP, LoadBalancer, or NodePort. Unset, LoadBalancer when
    # enrollment turns the Service on, else ClusterIP.
    # type: LoadBalancer
    # -- Service port number.
    port: 7946
    # -- Service annotations.
    annotations: {}
    # -- Static LoadBalancer IP. Deprecated in Kubernetes, so prefer a metallb.io/loadBalancerIPs annotation.
    loadBalancerIP: ""
    # -- External traffic policy. Defaults to Local for LoadBalancer, omitted
    # for ClusterIP and NodePort.
    externalTrafficPolicy: ""
    # -- Optional CIDRs allowed to reach the SWIM and signals LoadBalancer, where it enforces them.
    loadBalancerSourceRanges: []

# -- mTLS signals endpoint, for a GridNetwork with signalTransport poll.
# -- Cloud the grid runs on. `aws` asks for an NLB, since the default carries no UDP.
platform: ""

# -- The grid's other sites, separated by spaces or commas. Each becomes a SWIM seed and,
# if a bare IPv4 address, a host route in both Services. swim.seeds and either Service's
# loadBalancerSourceRanges override it.
peers: ""

signals:
  # -- Serve this site's signals endpoint for peers to poll.
  enabled: false
  # -- Signals TCP port, gossiped to peers with this Service's address.
  port: 9091
  service:
    # -- Render the signals Service.
    enabled: true
    # -- Service type. Empty follows swim.service.type, so one knob covers both.
    type: ""
    # -- Address to request, where the environment assigns them.
    loadBalancerIP: ""
    # -- Annotations, an NLB class among them.
    annotations: {}
    # -- Source ranges allowed to poll signals. Empty inherits swim.service's.
    loadBalancerSourceRanges: []
    # -- Empty keeps Local for a LoadBalancer.
    externalTrafficPolicy: ""
  # -- Signals endpoint gossiped to peers (ip:port, [ipv6]:port, or dns-name:port). Set it when swim.advertiseAddress is set or the Service is not a LoadBalancer.
  advertiseAddress: ""

  # -- Seconds between peer signal polls. Every site polls every other alive site, so
  # a grid of N sites makes N*(N-1) polls each interval. Empty keeps the operator's 30s.
  peerIntervalSeconds: ""
# -- Advertised site gateway address configuration.
gateway:
  # -- Discover and advertise a LoadBalancer address for the site gateway.
  discoveryEnabled: true
  # -- Reachable site gateway host:port override. Set this for ClusterIP or
  # NodePort Services; otherwise the operator discovers a LoadBalancer address.
  address: ""
  # -- Site gateway Kubernetes Service name for the operator to discover. Defaults
  # to grid-gateway with enrollment enabled or grid.id set; it also names the
  # gateway in GridNetwork spec.gatewayRefs. Maps to GRID_GATEWAY_SERVICE_NAME.
  serviceName: ""
  # -- Namespace of the site gateway Service. Empty uses the release
  # namespace. Maps to GRID_GATEWAY_NAMESPACE.
  namespace: ""
  # -- Allow gateway.namespace to be default, kube-*, or openshift-*.
  allowSystemNamespace: false
  # -- Site gateway Service port advertised to remote sites. Empty uses the
  # Service's declared port; if several are present, the first spec.ports entry
  # is used. Maps to GRID_GATEWAY_PORT.
  port: ""

# -- Probe timing configuration.
health:
  # -- Liveness probe settings.
  liveness:
    # -- Initial delay before the first liveness probe.
    initialDelaySeconds: 5
    # -- Period between liveness probes.
    periodSeconds: 10
  # -- Startup probe for source siteIdentity, which listens only once enrollment finishes.
  startup:
    # -- Period between startup probes.
    periodSeconds: 10
    # -- Failures allowed before restart. Keep the window past the operator's
    # 15 minute enrollment deadline, so a restart never lands mid-enrollment.
    failureThreshold: 96
  # -- Readiness probe settings.
  readiness:
    # -- Initial delay before the first readiness probe.
    initialDelaySeconds: 5
    # -- Period between readiness probes.
    periodSeconds: 10

# -- Prometheus ServiceMonitor (requires the Prometheus Operator CRD).
serviceMonitor:
  # -- Create a ServiceMonitor resource.
  enabled: false
  # -- Additional labels on the ServiceMonitor.
  labels: {}
  # -- ServiceMonitor namespace override.
  namespace: ""
  # -- Prometheus scrape interval.
  interval: "30s"
  # -- Prometheus scrape timeout.
  scrapeTimeout: "10s"
  # -- Scrape TLS settings when metrics.tls is on. Empty: the service CA for serviceCA, the grid CA Secret for siteIdentity, and a render error for existingSecret, which needs it set.
  tlsConfig: {}

# -- Container resource requests and limits.
resources: {}
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Pod affinity rules.
affinity: {}
# -- Pod tolerations.
tolerations: []
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class for the operator pod.
priorityClassName: ""

# -- Site auto-enroll on startup.
enrollment:
  # -- Enroll when the site identity Secret is absent.
  enabled: false
  # -- Enrollment service https base URL. Defaults to the in-cluster grid-enrollment
  # Service in rbac.enrollmentNamespace, the hub's own.
  url: ""
  # -- Site name the token pins, at most 51 characters. Defaults to swim.siteName.
  siteName: ""
  # -- CA pinning the enrollment server, and the grid CA by default. With neither set, Secret grid-ca-bundle.
  caBundle:
    # -- ConfigMap holding the bundle. Set this or secret.
    configMap: ""
    # -- Secret holding the bundle.
    secret: ""
    # -- Key holding the PEM bundle.
    key: ca.crt
  # -- Grid CA anchor, when it differs from caBundle.
  gridCaBundle:
    # -- ConfigMap holding the grid CA. Set this or secret.
    configMap: ""
    # -- Secret holding the grid CA.
    secret: ""
    # -- Key holding the PEM bundle.
    key: ca.crt
  # -- Secret the site identity is written to when no GridNetwork names one.
  identitySecretName: grid-site-identity
  # -- Secret the grid CA is written to when no GridNetwork names one.
  caSecretName: grid-ca
  rotation:
    # -- Rotate the site identity before it expires, presenting the current one. Needs an
    # enrollment URL: the default with enabled, or url set, as on a hub whose identity
    # bootstrap issued. Without caBundle the grid CA in caSecretName pins the service.
    # Off under pin peer trust whatever this says: a pinned peer refuses a rotated leaf.
    enabled: true
  # -- Secret holding the one-time site token.
  tokenSecretRef:
    # -- Secret name. Defaults to grid-invite-<siteName>.
    name: ""
    # -- Key holding the token.
    key: token
