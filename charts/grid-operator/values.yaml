# -- This site. name defaults swim.siteName, and through it enrollment.siteName.
site:
  # -- Site name, a DNS label.
  name: ""
  # -- Deployment region.
  region: ""
  # -- Availability zone.
  zone: ""

# -- The grid this site joins. Setting id renders the GridNetwork and this site's
# GridSite, with site discovery on. They need the grid CRDs first, so plain Helm sets id
# on an upgrade after the first install; Argo CD orders them by sync wave.
grid:
  # -- GridNetwork name.
  network: grid
  # -- Grid identifier. Empty renders no GridNetwork or GridSite.
  id: ""
  membership:
    # -- Where this site learns its members: Swim, from SWIM gossip, or Local, where this
    # site's configuration lists its peers as GridSites and their signals are polled at the
    # endpoint derived from each gateway. Local assumes something outside the grid delivers
    # every site's GridSite records, the same set to every member, and discovers no peers. Local runs no SWIM: no SWIM Service, port or
    # seeds, poll signals on the signals Service, and every contradicting value fails the
    # render. An unset grid.signals renders poll under Local. Also writes GridNetwork.spec.membership.mode when grid.id is set.
    source: Swim
  # -- Peer trust, pin or spiffe. Empty keeps the GridNetwork default, pin. The operator
  # also starts in it before any GridNetwork exists, so set it to match the grid.
  peerTrust: ""
  # -- Signed state, off or enforce. Applies to the rendered GridNetwork when grid.id is
  # set. Empty keeps its default, off. Set enforce at every site together; an enforcing
  # site refuses unsigned peers.
  signedState: ""
  # -- Signal transport, gossip or poll. poll also serves signals on the SWIM Service.
  # Empty keeps the GridNetwork default, gossip. The operator also starts in it before any
  # GridNetwork exists, so a poll install never restarts once its network appears.
  signals: ""
  # -- SWIM seed endpoints, where each peer's SWIM Service listens: a list, or one string
  # separated by spaces or commas. A bare host or address gets swim.service.port, and
  # host:port or [ipv6]:port is taken as given. Defaults swim.seeds.
  seeds: []
  # -- Secret holding the grid's SWIM key (key, 32 bytes). Empty runs SWIM without one.
  swimKeySecretName: grid-swim-key
  # -- InferenceProviders this site serves, keyed by name, as in the grid-site chart.
  # model defaults to the name, providerKind to vllm, and backendKind to local_model.
  providers: {}
  #   qwen3:
  #     model: Qwen3-Coder-30B-A3B
  #     endpoint: http://qwen3-epp-service.llm-d.svc:80
  #     clusterName: site-d

# -- Grid CRDs.
crds:
  # -- Install and upgrade the CRDs. Set false when the platform owns them, or for a second release in the cluster.
  enabled: true
  # -- Keep the CRDs on helm uninstall and an Argo CD delete or prune.
  keep: true

# -- Number of operator replicas. Every replica is ready and elects: one holds the operator
# lease and runs everything that writes, and the signals and SWIM Services route to it alone
# through an EndpointSlice it writes. An in-place upgrade from a release before leader
# election, where that release supports one (see the README), keeps the same replicaCount,
# then scales.
replicaCount: 1

# -- PodDisruptionBudget for the operator pods. The render fails for a budget that would
# block every node drain.
podDisruptionBudget:
  # -- auto renders one when replicaCount is above 1; true or false forces it.
  enabled: auto
  # -- Pods that must stay up, a count or a percentage. Set this or maxUnavailable.
  minAvailable: 1
  # -- Pods that may be down at once, a count or a percentage. Set this or minAvailable:
  # to use it, set minAvailable to null.
  maxUnavailable: ""

# -- Seconds the pod keeps serving after it is asked to stop, so a selector Service drops its
# endpoint before the operator stands down. Runs the image's sleep as a preStop hook. Empty
# or 0: none. Above one replica the holder withdraws its own signals and SWIM endpoints, so
# only the metrics Service follows readiness and may miss one scrape per restart.
shutdownDelaySeconds: null

# -- Seconds Kubernetes gives a terminating pod before killing it. Empty: 30 plus
# shutdownDelaySeconds when there is a delay, else the Kubernetes default. Must cover 20 plus
# shutdownDelaySeconds, the longest stand-down.
terminationGracePeriodSeconds: null

# -- Operator container image settings.
image:
  # -- Image repository.
  repository: ghcr.io/praxis-proxy/grid-operator
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Immutable image digest (sha256:<64 hex>). When set, tag is ignored.
  digest: ""
  # -- Image pull policy.
  pullPolicy: "IfNotPresent"

# -- Pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""
# -- Labels added to all chart-managed resources.
commonLabels: {}
# -- Labels added to the operator pod template.
podLabels: {}
# -- Annotations added to the operator pod template.
podAnnotations: {}

# -- ServiceAccount configuration.
serviceAccount:
  # -- Create a ServiceAccount for the operator.
  create: true
  # -- ServiceAccount name. When create is true, defaults to the release
  # fullname. When create is false, defaults to "default".
  name: ""
  # -- Annotations on the ServiceAccount (e.g. for IAM role binding).
  annotations: {}

# -- RBAC configuration.
rbac:
  # -- Create ClusterRoles, ClusterRoleBindings, and RoleBindings.
  create: true
  # -- The grid-enrollment namespace. The render fails if the operator would get Secret
  # access there. Defaults to grid-enrollment with enrollment on.
  enrollmentNamespace: ""
  # -- Create the metrics scraper ServiceAccount, allowed only GET on the nonResourceURL
  # /metrics, and let the operator mint short-lived tokens for it. An llm-d EPP serving
  # bearer-authenticated metrics (the default) admits a scrape with that token
  # (metricsConfig.auth type serviceAccountToken). The operator never sends its own token.
  metricsScraper: true

# -- Additional namespaces where the operator needs Secret, ConfigMap,
# Event, and Service access. The release namespace is always included.
resourceNamespaces: []

# -- Logging, rendered as RUST_LOG.
log:
  # -- Level for every module: error, warn, info, debug, or trace. A full RUST_LOG
  # directive still works here, as before; prefer filter for one.
  level: "info"
  # -- Full RUST_LOG directive, such as "info,operator=debug". When set, it replaces level.
  filter: ""

# Signal propagation mode is grid-wide configuration, set on the GridNetwork
# via the grid-site chart's signalTransport value, not on the operator.

# -- Metrics and health server configuration.
metrics:
  # -- Metrics server bind address (host:port).
  bindAddress: "0.0.0.0:9090"
  # -- Metrics ClusterIP Service.
  service:
    # -- Create a ClusterIP Service for the metrics port.
    enabled: true
    # -- Service port number.
    port: 9090
    # -- Service annotations.
    annotations: {}
  # -- TLS on the metrics and health port.
  tls:
    # -- false serves plaintext. auto and true serve TLS from source.
    enabled: auto
    # -- auto picks existingSecret when set, else serviceCA on OpenShift, else siteIdentity
    # when grid.id or enrollment.enabled is set. An install with none of these, which
    # is no grid site, serves plaintext.
    # siteIdentity serves the enrolled grid-site-identity, read once enrollment writes it.
    source: auto
    # -- Secret holding tls.crt and tls.key for source existingSecret.
    existingSecret: ""
    # -- Mount path for the certificate and key.
    mountPath: "/etc/grid/metrics-tls"

# -- NetworkPolicy for the operator pod. SWIM and signals stay open, and the
# metrics and health port admits only metricsFrom. Kubelet probes are unaffected on OpenShift.
networkPolicy:
  # -- auto: on where OpenShift runs. true or false forces it.
  enabled: auto
  # -- NetworkPolicyPeer entries allowed to reach the metrics port. Must not be empty.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring

# -- SWIM protocol configuration.
swim:
  # -- SWIM bind address (host:port).
  bindAddress: "0.0.0.0:7946"
  # -- SWIM advertise endpoint (ip:port, [ipv6]:port, or hostname:port). Defaults to the LoadBalancer SWIM Service address, else the Pod IP.
  advertiseAddress: ""
  # -- Hold SWIM traffic until the GridNetwork key loads or the network declares none. false opts out.
  requireKey: true
  # -- Bootstrap SWIM site name. Defaults to enrollment.siteName when enrollment is on.
  siteName: ""
  # -- Bootstrap SWIM seed endpoints, separated by spaces or commas, as grid.seeds.
  seeds: ""
  # -- SWIM Service.
  service:
    # -- Create a Service for the SWIM port. Unset, it is on with enrollment, else off.
    # enabled: true
    # -- Service type: ClusterIP, LoadBalancer, or NodePort. Unset, LoadBalancer when
    # enrollment turns the Service on, else ClusterIP.
    # type: LoadBalancer
    # -- Service port number.
    port: 7946
    # -- Service annotations.
    annotations: {}
    # -- Static LoadBalancer IP. Deprecated in Kubernetes, so prefer a metallb.io/loadBalancerIPs annotation.
    loadBalancerIP: ""
    # -- External traffic policy. Defaults to Local for LoadBalancer, omitted
    # for ClusterIP and NodePort.
    externalTrafficPolicy: ""
    # -- Optional CIDRs allowed to reach the SWIM and signals LoadBalancer, where it enforces them.
    loadBalancerSourceRanges: []

# -- Cloud whose load balancer settings LoadBalancer Services get: `aws` (an NLB, since the
# default carries no UDP), `azure`, `gcp`, or `any` for all three. Each cloud reads only its
# own keys, so `any` suits a render that runs on every cloud.
platform: ""

# -- Reach of the SWIM and signals load balancers on a cloud platform. `internal` keeps them
# on the cluster's private network, so sites need private connectivity between them.
# `external` makes them internet-facing. AWS sets the scope only when a load balancer is
# created: changing it means recreating the Service.
loadBalancerScope: internal

# -- The grid's other sites, separated by spaces or commas. Each becomes a SWIM seed and,
# if a bare IPv4 address, a host route in both Services. That fits a peer that listens on
# the address it egresses from. Where they differ, as on AWS with internet-facing load
# balancers (NAT address out, SWIM Service hostname in), list the NAT addresses here and the
# SWIM hostnames in grid.seeds. Internal load balancers see peers' private addresses: leave
# this empty and set swim.service.loadBalancerSourceRanges to their machine networks. Either
# seed key overrides the seeds, and either Service's loadBalancerSourceRanges the routes.
peers: ""

# -- mTLS signals endpoint, for a GridNetwork with signalTransport poll.
signals:
  # -- Serve this site's signals endpoint for peers to poll.
  enabled: false
  # -- Signals TCP port, gossiped to peers with this Service's address.
  port: 9091
  service:
    # -- Render the signals Service.
    enabled: true
    # -- Service type. Empty follows swim.service.type, so one knob covers both.
    type: ""
    # -- Address to request, where the environment assigns them.
    loadBalancerIP: ""
    # -- Annotations, an NLB class among them.
    annotations: {}
    # -- Source ranges allowed to poll signals. Empty inherits swim.service's.
    loadBalancerSourceRanges: []
    # -- Empty keeps Local for a LoadBalancer.
    externalTrafficPolicy: ""
  # -- Signals endpoint gossiped to peers (ip:port, [ipv6]:port, or dns-name:port). Set it when swim.advertiseAddress is set or the Service is not a LoadBalancer.
  advertiseAddress: ""
  # -- An OpenShift Route in front of the signals Service, so peers reach this site through
  # the cluster's router rather than a load balancer of its own. Required when signals are
  # exposed through a Route: without the rate limits below, the listener is open to anyone
  # who can reach the router.
  route:
    # -- auto renders the Route where the cluster serves route.openshift.io/v1; true or
    # false forces it. An offline render without --api-versions renders auto as off.
    enabled: auto
    # -- External hostname peers dial, the name the router matches the SNI against. The
    # convention is <site>-signals.<domain>. Required when a Route renders.
    host: ""
    # -- Extra Route annotations. They override rateLimit's on a key clash.
    annotations: {}
    # -- Per-source-IP connection limits in the router. The router sees each peer's own
    # address, so these count one peer at a time; the operator's own
    # signals.maxHandshakesPerSource sees them all as the router.
    rateLimit:
      enabled: true
      # -- Concurrent TCP connections per source IP.
      concurrentTcp: 10
      # -- TCP connection rate per source IP, in the router's rate window.
      rateTcp: 20


  # -- Concurrent handshakes one source address may hold. Behind an OpenShift Route or a
  # load balancer that does not keep the client address every peer arrives from one
  # source, so set it to the number of peers. Empty keeps the operator's 8.
  maxHandshakesPerSource: ""

  # -- Port each peer serves signals on, under Local membership, at its gateway endpoint's host, for a
  # grid whose sites each put the gateway and signals on one load balancer. Empty dials
  # the gateway's own port with server name <site>-signals.grid.internal, for a grid whose
  # sites each put both behind one router.
  peerEndpointPort: ""

  # -- Seconds between peer signal polls. Every site polls every other alive site, so
  # a grid of N sites makes N*(N-1) polls each interval. Empty keeps the operator's 5s.
  peerIntervalSeconds: ""

  # -- Seconds between scrapes of this site's own EPPs. Local and unicast, so it costs
  # one request per provider per interval. Empty keeps the operator's 1s.
  scrapeIntervalSeconds: ""
# -- Advertised site gateway address configuration.
gateway:
  # -- Discover and advertise a LoadBalancer address for the site gateway.
  discoveryEnabled: true
  # -- GridNetwork consumerGateways[].praxisConfig for the site gateway, as the CRD
  # takes it. Empty renders no block.
  praxisConfig: {}
  # -- Reachable site gateway host:port override. Set this for ClusterIP or
  # NodePort Services; otherwise the operator discovers a LoadBalancer address.
  address: ""
  # -- Site gateway Kubernetes Service name for the operator to discover. Defaults
  # to grid-gateway with enrollment enabled or grid.id set; it also names the
  # gateway in GridNetwork spec.consumerGateways. Maps to GRID_GATEWAY_SERVICE_NAME.
  serviceName: ""
  # -- Namespace of the site gateway Service. Empty uses the release
  # namespace. Maps to GRID_GATEWAY_NAMESPACE.
  namespace: ""
  # -- Allow gateway.namespace to be default, kube-*, or openshift-*.
  allowSystemNamespace: false
  # -- Site gateway Service port advertised to remote sites. Empty uses the
  # Service's declared port; if several are present, the first spec.ports entry
  # is used. Maps to GRID_GATEWAY_PORT.
  port: ""

# -- Probe timing configuration.
health:
  # -- Liveness probe settings.
  liveness:
    # -- Initial delay before the first liveness probe.
    initialDelaySeconds: 5
    # -- Period between liveness probes.
    periodSeconds: 10
  # -- Startup probe for source siteIdentity, which listens only once enrollment finishes.
  startup:
    # -- Period between startup probes.
    periodSeconds: 10
    # -- Failures allowed before restart. Enrollment has no retry deadline; this
    # probe restarts a siteIdentity pod still enrolling after about 16 minutes.
    failureThreshold: 96
  # -- Readiness probe settings.
  readiness:
    # -- Initial delay before the first readiness probe.
    initialDelaySeconds: 5
    # -- Period between readiness probes.
    periodSeconds: 10

# -- Prometheus ServiceMonitor (requires the Prometheus Operator CRD).
serviceMonitor:
  # -- Create a ServiceMonitor resource.
  enabled: false
  # -- Additional labels on the ServiceMonitor.
  labels: {}
  # -- ServiceMonitor namespace override.
  namespace: ""
  # -- Prometheus scrape interval.
  interval: "30s"
  # -- Prometheus scrape timeout.
  scrapeTimeout: "10s"
  # -- Scrape TLS settings when metrics.tls is on. Empty: the service CA for serviceCA, the grid CA Secret for siteIdentity, and a render error for existingSecret, which needs it set.
  tlsConfig: {}

# -- Container resource requests and limits.
resources: {}
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Pod affinity rules.
affinity: {}
# -- Pod tolerations.
tolerations: []
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class for the operator pod.
priorityClassName: ""

# -- This operator's own settings: a ConfigMap in the release namespace, watched, so an edit
# applies without a restart. The enrollment values render its site section.
operatorConfig:
  # -- Render the ConfigMap. Set false to manage it yourself under name.
  create: true
  # -- ConfigMap name.
  name: grid-operator-config

# -- How this cluster's own site enrolls and renews its identity, rendered as the operator
# config's site section.
enrollment:
  # -- Name the signer and the invite, so the operator enrolls the site while it has no
  # identity, then renews through the same signer.
  enabled: false
  # -- Signer https base URL, the config's site.signerEndpoint.url. Required unless hub is
  # set, which defaults it to the in-cluster grid-enrollment Service in
  # rbac.enrollmentNamespace.
  url: ""
  # -- The grid-enrollment release runs on this cluster, so url defaults to its Service.
  hub: false
  # -- With hub set and no url, the grid-enrollment release's full name: its Service, and
  # the in-cluster name its serving certificate carries. Must match that release.
  hubService: grid-enrollment
  # -- With hub set and no url, the grid-enrollment Service's port. Must match that release,
  # whose Service port derives from its listenAddr.
  hubPort: 8443
  # -- Site name the token pins, at most 51 characters, and the GridSite's name: the config's
  # site.name. Defaults to swim.siteName.
  siteName: ""
  # -- Signer hosts the operator config may name, each host or host:port, as the operator's
  # GRID_SIGNER_HOSTS. Set where the operator is installed, so an edit to its config cannot
  # point enrollment elsewhere. Empty defaults to the host and port of url when one renders.
  signerHosts: []
  # -- CA pinning the signer to enroll, and the grid CA by default:
  # site.signerEndpoint.caBundleRef. A Secret only, since anyone who can edit a ConfigMap
  # could pin a signer of their own. Unset, Secret grid-ca-bundle when enabled. Renewal
  # trusts the grid CA the site holds together with this bundle. Pin the issuing intermediate or
  # the signer's serving certificate, never a public root.
  caBundle:
    # -- Secret holding the bundle.
    secret: ""
    # -- Key holding the PEM bundle.
    key: ca.crt
  # -- Grid CA anchor, when it differs from caBundle: site.signerEndpoint.gridCaBundleRef.
  gridCaBundle:
    # -- Secret holding the grid CA.
    secret: ""
    # -- Key holding the PEM bundle.
    key: ca.crt
  # -- Identity Secret the rendered GridNetwork names. Without grid.id it must stay the
  # operator's default, grid-site-identity.
  identitySecretName: grid-site-identity
  # -- Grid CA Secret the rendered GridNetwork names. Without grid.id it must stay the
  # operator's default, grid-ca.
  caSecretName: grid-ca
  # -- Secret holding the one-time site token: site.inviteSecretRef.
  tokenSecretRef:
    # -- Secret name. Defaults to grid-invite-<siteName>.
    name: ""
    # -- Key holding the token.
    key: token
  # -- Whether the operator renews the site identity through the signer,
  # site.signerEndpoint.rotation: Enabled or Disabled. Empty renders Disabled unless
  # grid.peerTrust is spiffe, since pin peer trust refuses a renewed leaf. Under spiffe it is
  # left out, and the operator's default is Enabled.
  rotation: ""
