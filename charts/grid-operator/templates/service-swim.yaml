{{- include "grid-operator.normalize" . }}
{{- if .Values.swim.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grid-operator.fullname" . }}-swim
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
  {{- $ann := include "grid-operator.serviceAnnotations" (dict "root" . "own" .Values.swim.service.annotations) }}
  {{- if $ann }}
  annotations:
    {{- $ann | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.swim.service.type | quote }}
  {{- if and (eq .Values.swim.service.type "LoadBalancer") .Values.swim.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.swim.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if eq .Values.swim.service.type "LoadBalancer" }}
  {{- $ranges := include "grid-operator.peerSourceRanges" (dict "root" . "own" .Values.swim.service.loadBalancerSourceRanges) }}
  {{- if $ranges }}
  loadBalancerSourceRanges:
    {{- $ranges | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- /* The API server refuses an external traffic policy on a ClusterIP Service. */}}
  {{- if and (ne .Values.swim.service.type "ClusterIP") .Values.swim.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.swim.service.externalTrafficPolicy | quote }}
  {{- else if eq .Values.swim.service.type "LoadBalancer" }}
  externalTrafficPolicy: "Local"
  {{- end }}
  {{- if eq .Values.swim.service.type "LoadBalancer" }}
  {{- /* Some LBs publish an address only once an endpoint exists. */}}
  publishNotReadyAddresses: true
  {{- end }}
  ports:
    - name: swim-udp
      port: {{ .Values.swim.service.port }}
      targetPort: swim-udp
      protocol: UDP
  {{- /* Every replica is ready, so no selector: the lease holder writes this Service's EndpointSlice. */}}
{{- end }}
