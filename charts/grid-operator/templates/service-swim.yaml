{{- if .Values.swim.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grid-operator.fullname" . }}-swim
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
  {{- with .Values.swim.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.swim.service.type | quote }}
  {{- if and (eq .Values.swim.service.type "LoadBalancer") .Values.swim.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.swim.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if .Values.swim.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.swim.service.externalTrafficPolicy | quote }}
  {{- else if eq .Values.swim.service.type "LoadBalancer" }}
  externalTrafficPolicy: "Local"
  {{- end }}
  ports:
    - name: swim-udp
      port: {{ .Values.swim.service.port }}
      targetPort: swim-udp
      protocol: UDP
    # Poll-mode peers use the same externally advertised operator address for
    # the mTLS signals endpoint. This listener is bound only when poll mode is
    # selected and fails closed without its GridNetwork TLS identity.
    - name: signals-tcp
      port: 9091
      targetPort: signals-tcp
      protocol: TCP
  selector:
    {{- include "grid-operator.selectorLabels" . | nindent 4 }}
{{- end }}
