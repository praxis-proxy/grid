{{- include "grid-operator.normalize" . }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "grid-operator.fullname" . }}-resources
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    # Both Services unconditionally: the operator reads whichever one carries its
    # signals address, and gating the grant on a value that can disagree with the
    # Deployment's env is how it goes missing.
    resourceNames:
      - {{ .Values.gateway.serviceName | default "provider-gateway" | quote }}
      - {{ printf "%s-swim" (include "grid-operator.fullname" .) | quote }}
      - {{ printf "%s-signals" (include "grid-operator.fullname" .) | quote }}
    verbs: ["get"]
{{- if include "grid-operator.enrollment.rotates" . }}
  # A rotation rolls the gateway, which loads its upstream client certificate only at start.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.gateway.serviceName | default "provider-gateway" | quote }}]
    verbs: ["get", "patch"]
{{- end }}
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
{{- end }}
