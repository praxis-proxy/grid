{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "grid-operator.fullname" . }}-test
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
    {{- if include "grid-operator.networkPolicy.enabled" . }}
    app.kubernetes.io/component: helm-test
    {{- end }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readiness-check
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          {{- if include "grid-operator.metricsTls.enabled" . }}
          # Checks readiness. The ServiceMonitor verifies the certificate.
          wget -qO- --timeout=5 --no-check-certificate \
            https://{{ include "grid-operator.fullname" . }}-metrics:{{ .Values.metrics.service.port }}/readyz
          {{- else }}
          wget -qO- --timeout=5 \
            http://{{ include "grid-operator.fullname" . }}-metrics:{{ .Values.metrics.service.port }}/readyz
          {{- end }}
{{- end }}
