{{- include "grid-operator.normalize" . }}
{{- if (.Values.operatorConfig | default dict).create }}
{{- with include "grid-operator.enrollment.site" . | trim }}
{{- /* With no site section the operator runs on defaults, and another writer may own the ConfigMap. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grid-operator.operatorConfig.name" $ | quote }}
  labels:
    {{- include "grid-operator.labels" $ | nindent 4 }}
data:
  config.yaml: |
    {{- . | nindent 4 }}
{{- end }}
{{- end }}
