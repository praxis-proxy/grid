{{- include "grid-operator.normalize" . }}
{{- $experimental := .Values.experimental | default dict }}
{{- $a2aEnabled := dig "a2a" "enabled" false $experimental }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "grid-operator.fullname" . }}-crd
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources:
      {{- if $a2aEnabled }}
      - agenttoagentproviders
      {{- end }}
      - agenttoolproviders
      - gridnetworks
      - inferenceproviders
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - gridsites
    verbs: ["get", "list", "watch", "patch", "create", "update", "delete"]
  - apiGroups: ["grid.praxis.fast"]
    resources:
      {{- if $a2aEnabled }}
      - agenttoagentproviders/status
      {{- end }}
      - agenttoolproviders/status
      - gridnetworks/status
      - gridsites/status
      - inferenceproviders/status
    verbs: ["get", "patch"]
  # The operator creates its own GridNetwork once its identity exists.
  - apiGroups: ["grid.praxis.fast"]
    resources:
      - gridnetworks
    verbs: ["create"]
{{- end }}
