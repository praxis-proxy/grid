{{- include "grid-operator.normalize" . }}
{{- include "grid-operator.validateDigest" . }}
{{- include "grid-operator.enrollment.validate" . }}
{{- include "grid-operator.validateSignals" . }}
{{- include "grid-operator.metricsTls.validate" . }}
{{- include "grid-operator.pdb.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grid-operator.fullname" . }}
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /* Only the lease holder writes or gossips, and every replica is ready, so a surge pod
  waits as a candidate while the old one hands over. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "grid-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels := include "grid-operator.selectorLabels" . | fromYaml }}
        {{- $podLabels := mustMergeOverwrite (dict "app.kubernetes.io/component" "operator") (.Values.podLabels | default dict) $selectorLabels }}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $delay := int (include "grid-operator.shutdownDelaySeconds" .) }}
      {{- $grace := .Values.terminationGracePeriodSeconds }}
      {{- if not (kindIs "invalid" $grace) }}
      {{- if lt (int $grace) (add 20 $delay) }}
      {{- fail (printf "terminationGracePeriodSeconds must be at least %d: the operator stands down for up to 20 seconds after the %d second shutdownDelaySeconds" (add 20 $delay) $delay) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $grace }}
      {{- else if $delay }}
      {{- /* The preStop delay comes out of the grace period, so add it on top of the stand-down. */}}
      terminationGracePeriodSeconds: {{ add 30 $delay }}
      {{- end }}
      serviceAccountName: {{ include "grid-operator.serviceAccountName" . }}
      # Service link env vars (a grid-gateway Service injects GRID_GATEWAY_PORT)
      # would collide with the operator's GRID_* settings.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "grid-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- /* Namespace-bearing values expand this at start, so a kustomize consumer can move the install. */}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GRID_LEADER_LEASE
              value: {{ include "grid-operator.fullname" . | quote }}
            - name: GRID_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GRID_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- /* A pod this matches without GRID_LEADER_LEASE runs unelected, so no candidate contends beside it. */}}
            - name: GRID_LEADER_REPLICA_SELECTOR
              value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s" (include "grid-operator.name" .) .Release.Name | quote }}
            {{- with include "grid-operator.holderSignalsServices" . }}
            - name: GRID_LEADER_SIGNALS_SERVICES
              value: {{ . | quote }}
            {{- end }}
            {{- with include "grid-operator.holderSwimServices" . }}
            - name: GRID_LEADER_SWIM_SERVICES
              value: {{ . | quote }}
            {{- end }}
            - name: GRID_SWIM_BIND_ADDR
              value: {{ .Values.swim.bindAddress | quote }}
            {{- if eq (toString .Values.swim.requireKey) "false" }}
            - name: GRID_SWIM_REQUIRE_KEY
              value: "false"
            {{- end }}
            {{- $podAdvertise := printf "$(POD_IP):%s" (splitList ":" .Values.swim.bindAddress | last) }}
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: {{ .Values.swim.advertiseAddress | default $podAdvertise | quote }}
            {{- if not .Values.swim.advertiseAddress }}
            {{- /* Equal values mark the chart's Pod IP default. */}}
            - name: GRID_SWIM_ADVERTISE_FALLBACK
              value: {{ $podAdvertise | quote }}
            {{- if and .Values.swim.service.enabled (eq .Values.swim.service.type "LoadBalancer") }}
            - name: GRID_SWIM_SERVICE_NAME
              value: {{ printf "%s-swim" (include "grid-operator.fullname" .) | quote }}
            {{- end }}
            {{- end }}
            - name: GRID_NETWORK
              value: {{ .Values.grid.network | quote }}
            {{- /* The chart renders the records with grid.id, and an enrolling release may set it later. */}}
            {{- if or .Values.grid.id .Values.enrollment.enabled }}
            - name: GRID_CREATE_LOCAL_RECORDS
              value: "false"
            {{- end }}
            {{- with .Values.swim.siteName | default (and .Values.enrollment.enabled .Values.enrollment.siteName) }}
            - name: GRID_SWIM_SITE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- $seeds := include "grid-operator.swimSeeds" . }}
            {{- if $seeds }}
            - name: GRID_SWIM_SEEDS
              value: {{ $seeds | quote }}
            {{- end }}
            {{- if .Values.gateway.address }}
            - name: GRID_GATEWAY_ADDRESS
              value: {{ .Values.gateway.address | quote }}
            {{- end }}
            {{- if .Values.gateway.serviceName }}
            - name: GRID_GATEWAY_SERVICE_NAME
              value: {{ .Values.gateway.serviceName | quote }}
            {{- end }}
            - name: GRID_GATEWAY_NAMESPACE
              value: {{ .Values.gateway.namespace | default "$(POD_NAMESPACE)" | quote }}
            {{- with .Values.gateway.port }}
            - name: GRID_GATEWAY_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: GRID_GATEWAY_DISCOVERY_ENABLED
              value: {{ (ne (toString .Values.gateway.discoveryEnabled) "false") | quote }}
            {{- /* Start in the modes the install declares, so its GridNetwork appearing restarts nothing. */}}
            {{- with (.Values.grid).signals }}
            - name: GRID_SIGNAL_TRANSPORT
              value: {{ . | quote }}
            {{- end }}
            {{- with (.Values.grid).peerTrust }}
            - name: GRID_PEER_TRUST
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.rbac.create .Values.rbac.metricsScraper }}
            - name: GRID_METRICS_SCRAPER_SERVICE_ACCOUNT
              value: {{ printf "%s-metrics-scraper" (include "grid-operator.fullname" .) | quote }}
            - name: GRID_METRICS_SCRAPER_NAMESPACE
              value: "$(POD_NAMESPACE)"
            {{- end }}
            {{- if (.Values.signals).enabled }}
            - name: GRID_SIGNALS_LOCAL_ADDR
              {{- /* Follows whichever Service carries the port: the signals one when rendered, else SWIM. */}}
              value: {{ printf "%s-%s.$(POD_NAMESPACE).svc:%v" (include "grid-operator.fullname" .) (ternary "signals" "swim" .Values.signals.service.enabled) .Values.signals.port | quote }}
            {{- if .Values.signals.service.enabled }}
            - name: GRID_SIGNALS_SERVICE_NAME
              value: {{ printf "%s-signals" (include "grid-operator.fullname" .) | quote }}
            {{- end }}
            {{- with .Values.signals.advertiseAddress }}
            - name: GRID_SIGNALS_ADVERTISE_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.signals.peerIntervalSeconds }}
            - name: GRID_SIGNALS_PEER_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.signals.scrapeIntervalSeconds }}
            - name: GRID_SIGNALS_SCRAPE_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: GRID_METRICS_ADDR
              value: {{ .Values.metrics.bindAddress | quote }}
            {{- with include "grid-operator.metricsTls.env" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: RUST_LOG
              value: {{ include "grid-operator.rustLog" . | quote }}
            {{- with include "grid-operator.enrollment.env" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- $mounts := list (include "grid-operator.enrollment.volumeMounts" . | trim) (include "grid-operator.metricsTls.volumeMount" . | trim) | compact }}
          {{- with $mounts }}
          volumeMounts:
            {{- join "\n" . | nindent 12 }}
          {{- end }}
          ports:
            - name: swim-udp
              containerPort: {{ splitList ":" .Values.swim.bindAddress | last }}
              protocol: UDP
            - name: metrics
              containerPort: {{ splitList ":" .Values.metrics.bindAddress | last }}
              protocol: TCP
            {{- if (.Values.signals).enabled }}
            {{- /* The binary's default listener, [::]:9091 with an IPv4 fallback. */}}
            - name: signals
              containerPort: 9091
              protocol: TCP
            {{- end }}
          {{- if eq (include "grid-operator.metricsTls.source" .) "siteIdentity" }}
          {{- /* Nothing listens until enrollment writes the identity. */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTPS
            periodSeconds: {{ .Values.health.startup.periodSeconds }}
            failureThreshold: {{ .Values.health.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              {{- if include "grid-operator.metricsTls.enabled" . }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.health.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              {{- if include "grid-operator.metricsTls.enabled" . }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.health.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.readiness.periodSeconds }}
          {{- with int (include "grid-operator.shutdownDelaySeconds" .) }}
          {{- /* Covers the time between /readyz turning 503 and the endpoint leaving every Service. */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ . | quote }}]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $volumes := list (include "grid-operator.enrollment.volumes" . | trim) (include "grid-operator.metricsTls.volume" . | trim) | compact }}
      {{- with $volumes }}
      volumes:
        {{- join "\n" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
