{{- include "grid-operator.normalize" . }}
{{- if include "grid-operator.networkPolicy.enabled" . }}
{{- $metricsFrom := .Values.networkPolicy.metricsFrom }}
{{- /* Only OpenShift has known monitoring namespaces to default to. */}}
{{- if and (not $metricsFrom) (.Capabilities.APIVersions.Has "security.openshift.io/v1") }}
{{- $metricsFrom = list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "openshift-user-workload-monitoring"))) (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "openshift-monitoring"))) }}
{{- end }}
{{- if not $metricsFrom }}
{{- fail "networkPolicy.metricsFrom must name the Prometheus namespace off OpenShift: an empty list would admit every pod, and there is no default to guess" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grid-operator.fullname" . }}
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grid-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Peer sites reach SWIM and signals as without the policy.
    - ports:
        {{- if ne (dig "membership" "source" "Swim" .Values.grid) "Local" }}
        - port: swim-udp
          protocol: UDP
        {{- end }}
        {{- if (.Values.signals).enabled }}
        - port: signals
          protocol: TCP
        {{- end }}
    - from:
        {{- toYaml $metricsFrom | nindent 8 }}
        # This release's helm test checks /readyz.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
