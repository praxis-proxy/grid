{{- include "grid-operator.normalize" . }}
{{- if include "grid-operator.networkPolicy.enabled" . }}
{{- $metricsFrom := .Values.networkPolicy.metricsFrom | default (include "grid-operator.networkPolicy.openshiftMonitoring" . | fromYamlArray) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grid-operator.fullname" . }}
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grid-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Peer sites reach SWIM and signals as without the policy.
    - ports:
        {{- if ne (dig "membership" "source" "Swim" .Values.grid) "Local" }}
        - port: swim-udp
          protocol: UDP
        {{- end }}
        {{- if (.Values.signals).enabled }}
        - port: signals
          protocol: TCP
        {{- end }}
    - from:
        {{- toYaml $metricsFrom | nindent 8 }}
        # This release's helm test checks /readyz.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
