{{- include "grid-operator.normalize" . }}
{{- if and .Values.rbac.create .Values.rbac.metricsScraper }}
{{- $fullname := include "grid-operator.fullname" . }}
{{- $scraper := printf "%s-metrics-scraper" $fullname }}
{{- $labels := include "grid-operator.labels" . }}
# Sends no credential of its own: the operator mints short-lived tokens for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $scraper }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $scraper }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $scraper }}
  labels:
    {{- $labels | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $scraper }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $scraper }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $scraper }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $scraper | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $scraper }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grid-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $scraper }}-token
  apiGroup: rbac.authorization.k8s.io
{{- end }}
