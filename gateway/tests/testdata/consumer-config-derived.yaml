listeners:
  - name: public
    address: "0.0.0.0:8080"
    filter_chains: [consumer-chain]
filter_chains:
  - name: consumer-chain
    filters:
      - filter: json_body_field
        field: model
        header: X-Model
      - filter: intelligent_route
        local_site: "site-a"
        model_header: X-Model
        overlay_file: /etc/praxis/routing/routing-overlay.json
        expected_overlay_scope:
          network: "net"
          gateway: "inference-gw"
          namespace: "praxis-system"
          local_site: "site-a"
        reload:
          enabled: true

      - filter: load_balancer
        clusters:
          - name: "prov-a"
            tls:
              ca:
                ca_path: "/run/secrets/grid-backend-ca/models-ca/ca.crt"
              sni: "model-a.models.svc"
              verify: true
            endpoints:
              - "model-a.models.svc:8443"
          - name: "prov-b"
            tls:
              ca:
                ca_path: "/run/secrets/grid-backend-ca/models-ca/ca.crt"
              sni: "model-b.models.svc"
              verify: true
            endpoints:
              - "model-b.models.svc:8443"
admin:
  address: "127.0.0.1:9901"
shutdown_timeout_secs: 5
