<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title description">
  <title id="title">Soft and hard learned ceilings</title>
  <desc id="description">The soft ceiling records the largest queue-free concurrency. The hard ceiling records the least concurrency at a qualified limit. The effective ceiling is the smaller available bound, with a floor. Growth retires the hard bound, sustained unit shrink retires both, and the proposed pool UID change isolates both bounds and old observations. These are estimates, not physical-capacity guarantees.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #142337; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #526175; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.3px; }
      .formula { font-family: 'DejaVu Sans Mono', monospace; font-size: 23px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="830" rx="24" fill="#f4f7fb"/>
  <text x="40" y="49" class="label muted">LEARNED CAPACITY</text>
  <text x="40" y="92" class="title">two ceilings, different evidence</text>
  <text x="40" y="121" class="body muted">current algorithm: 3359afdc. proposed: pool identity isolation.</text>

  <rect x="40" y="153" width="500" height="275" rx="18" fill="#ffffff" stroke="#c9d8f5"/>
  <rect x="40" y="153" width="7" height="275" rx="3" fill="#3564db"/>
  <text x="68" y="193" class="heading" style="fill:#2855c4">soft ceiling</text>
  <text x="68" y="224" class="body">largest count seen without observed waiting</text>
  <path d="M72 313 H144 V292 H218 V271 H292 V249 H365" fill="none" stroke="#3564db" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="365" cy="249" r="5" fill="#3564db"/>
  <text x="385" y="266" class="small" style="fill:#2855c4">new peak</text>
  <text x="68" y="354" class="body">rises with queue-free evidence</text>
  <text x="68" y="383" class="body muted">idle time alone does not erase it</text>
  <text x="68" y="410" class="small muted">an observation without a capacity guarantee</text>

  <rect x="580" y="153" width="500" height="275" rx="18" fill="#ffffff" stroke="#e9d3aa"/>
  <rect x="580" y="153" width="7" height="275" rx="3" fill="#b97910"/>
  <text x="608" y="193" class="heading" style="fill:#94600b">hard ceiling</text>
  <text x="608" y="224" class="body">least count observed at a qualified limit</text>
  <path d="M612 249 H686 V271 H760 V292 H834 V313 H905" fill="none" stroke="#b97910" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="905" cy="313" r="5" fill="#b97910"/>
  <text x="925" y="305" class="small" style="fill:#94600b">tighter</text>
  <text x="608" y="354" class="body">pressure or a qualifying sustained backlog</text>
  <text x="608" y="383" class="body muted">retires when queue-free evidence reaches it</text>
  <text x="608" y="410" class="small muted">a transient queue alone is insufficient</text>

  <path d="M290 428 V449 H477 V470" class="flow"/>
  <path d="M830 428 V449 H643 V470" class="flow"/>
  <rect x="165" y="478" width="790" height="106" rx="18" fill="#172b45"/>
  <text x="560" y="510" text-anchor="middle" class="label" style="fill:#b8cce6">EFFECTIVE CEILING</text>
  <text x="560" y="544" text-anchor="middle" class="formula" style="fill:#ffffff">max(floor, min(available bounds))</text>
  <text x="560" y="570" text-anchor="middle" class="small" style="fill:#d7e2ef">one bound: use it. no bounds: start at the floor.</text>

  <rect x="40" y="614" width="330" height="122" rx="15" fill="#e7eef8"/>
  <text x="62" y="644" class="label muted">SERVING UNITS GROW</text>
  <text x="62" y="677" class="body">retire the hard ceiling</text>
  <text x="62" y="705" class="body muted">keep the soft history</text>

  <rect x="395" y="614" width="330" height="122" rx="15" fill="#e7eef8"/>
  <text x="417" y="644" class="label muted">SUSTAINED UNIT SHRINK</text>
  <text x="417" y="677" class="body">retire both ceilings</text>
  <text x="417" y="705" class="body muted">relearn the changed pool</text>

  <rect x="750" y="614" width="330" height="122" rx="15" fill="#f0eafb" stroke="#9c7ad3" stroke-dasharray="5 4"/>
  <text x="772" y="644" class="label" style="fill:#6c499e">POOL UID CHANGE / PROPOSED</text>
  <text x="772" y="677" class="body">discard predecessor state</text>
  <text x="772" y="705" class="body muted">reject old-UID observations</text>

  <text x="40" y="772" class="small muted">these estimates guide routing. they are not admission limits or physical bounds.</text>
  <text x="40" y="799" class="small muted">uid isolation requires producer-bound observations. relabelling an old cache does not qualify.</text>
</svg>
