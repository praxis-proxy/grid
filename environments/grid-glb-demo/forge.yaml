apiVersion: forge.praxis.dev/v1alpha1
kind: Environment

metadata:
  name: grid-glb-demo

spec:
  runtime:
    provider: docker
    clusterPrefix: grid-glb

  network:
    crossCluster: true
    dnsZone: grid-glb.test

  clusters:
    - name: east-provider
      stacks: [metallb, swim-lb, grid-operator, east-provider-operator, east-provider-site, inference-sim]
      properties:
        region: east
        role: provider
        gatewayImage: "praxis-ai:glb-demo"
        operatorImage: "grid-operator:glb-demo"
        mockProviderImage: "grid-mock-providers:glb-demo"
        imagePullPolicy: Never

    - name: west-provider
      stacks: [metallb, swim-lb, grid-operator, west-provider-operator, west-provider-site, inference-sim]
      properties:
        region: west
        role: provider
        gatewayImage: "praxis-ai:glb-demo"
        operatorImage: "grid-operator:glb-demo"
        mockProviderImage: "grid-mock-providers:glb-demo"
        imagePullPolicy: Never

    - name: east-edge
      stacks: [metallb, swim-lb, grid-operator, east-edge-operator, east-edge-site, edge-gateway]
      properties:
        region: east
        role: edge
        gatewayImage: "praxis-ai:glb-demo"
        operatorImage: "grid-operator:glb-demo"
        mockProviderImage: "grid-mock-providers:glb-demo"
        imagePullPolicy: Never

    - name: west-edge
      stacks: [metallb, swim-lb, grid-operator, west-edge-operator, west-edge-site, edge-gateway]
      properties:
        region: west
        role: edge
        gatewayImage: "praxis-ai:glb-demo"
        operatorImage: "grid-operator:glb-demo"
        mockProviderImage: "grid-mock-providers:glb-demo"
        imagePullPolicy: Never

    - name: gtm-emulator
      stacks: [metallb, gtm-emulator]
      properties:
        region: global
        role: gtm-emulator
        gatewayImage: "praxis-ai:glb-demo"
        operatorImage: "grid-operator:glb-demo"
        mockProviderImage: "grid-mock-providers:glb-demo"
        imagePullPolicy: Never

  stacks:
    metallb:
      description: MetalLB load balancer with auto-configured address pool
      steps:
        - type: url
          url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
          sha256: 951065e85692aa106f1bb5d5a487d9306154923a794ab1d82122881cbaf588e4
        - type: wait
          resource: deployment/controller
          namespace: metallb-system
          condition: available
          timeout: "120s"
        - type: metallb-auto-pool
          name: forge-pool

    grid-operator:
      description: Grid CRDs and operator
      steps:
        - type: kustomize
          path: resources/grid-operator
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-{{ cluster.name }}
            - -n
            - grid-system
            - set
            - image
            - deployment/grid-operator
            - operator={{ cluster.properties.operatorImage }}
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-{{ cluster.name }}
            - -n
            - grid-system
            - patch
            - deployment/grid-operator
            - --type=json
            - -p
            - '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"{{ cluster.properties.imagePullPolicy }}"}]'
        - type: wait
          resource: deployment/grid-operator
          namespace: grid-system
          condition: available
          timeout: "120s"

    swim-lb:
      description: SWIM membership LoadBalancer Service for cross-cluster discovery
      steps:
        - type: manifest
          path: resources/operator-swim-service.yaml
        - type: capture
          resource: svc/operator-swim-lb
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: swim-lb-ip
          timeout: "60s"
          interval: "2s"

    east-provider-operator:
      description: East provider Grid operator identity and SWIM peers
      steps:
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-east-provider
            - -n
            - grid-system
            - set
            - env
            - deployment/grid-operator
            - GRID_SWIM_BIND_ADDR=0.0.0.0:7946
            - GRID_SWIM_ADVERTISE_ADDR={{ captures.east-provider.swim-lb-ip }}:7946
            - GRID_SWIM_SITE_NAME=east-provider
            - GRID_SWIM_SEEDS={{ captures.east-edge.swim-lb-ip }}:7946,{{ captures.west-edge.swim-lb-ip }}:7946,{{ captures.west-provider.swim-lb-ip }}:7946
            - GRID_GATEWAY_PORT=8443
            - RUST_LOG=info
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-east-provider
            - -n
            - grid-system
            - rollout
            - status
            - deployment/grid-operator
            - --timeout=120s

    west-provider-operator:
      description: West provider Grid operator identity and SWIM peers
      steps:
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-west-provider
            - -n
            - grid-system
            - set
            - env
            - deployment/grid-operator
            - GRID_SWIM_BIND_ADDR=0.0.0.0:7946
            - GRID_SWIM_ADVERTISE_ADDR={{ captures.west-provider.swim-lb-ip }}:7946
            - GRID_SWIM_SITE_NAME=west-provider
            - GRID_SWIM_SEEDS={{ captures.east-edge.swim-lb-ip }}:7946,{{ captures.east-provider.swim-lb-ip }}:7946,{{ captures.west-edge.swim-lb-ip }}:7946
            - GRID_GATEWAY_PORT=8443
            - RUST_LOG=info
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-west-provider
            - -n
            - grid-system
            - rollout
            - status
            - deployment/grid-operator
            - --timeout=120s

    east-edge-operator:
      description: East edge Grid operator identity and SWIM peers
      steps:
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-east-edge
            - -n
            - grid-system
            - set
            - env
            - deployment/grid-operator
            - GRID_SWIM_BIND_ADDR=0.0.0.0:7946
            - GRID_SWIM_ADVERTISE_ADDR={{ captures.east-edge.swim-lb-ip }}:7946
            - GRID_SWIM_SITE_NAME=east-edge
            - GRID_SWIM_SEEDS={{ captures.east-provider.swim-lb-ip }}:7946,{{ captures.west-edge.swim-lb-ip }}:7946,{{ captures.west-provider.swim-lb-ip }}:7946
            - GRID_GATEWAY_SERVICE_NAME=edge-gateway
            - GRID_GATEWAY_PORT=8080
            - RUST_LOG=info
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-east-edge
            - -n
            - grid-system
            - rollout
            - status
            - deployment/grid-operator
            - --timeout=120s

    west-edge-operator:
      description: West edge Grid operator identity and SWIM peers
      steps:
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-west-edge
            - -n
            - grid-system
            - set
            - env
            - deployment/grid-operator
            - GRID_SWIM_BIND_ADDR=0.0.0.0:7946
            - GRID_SWIM_ADVERTISE_ADDR={{ captures.west-edge.swim-lb-ip }}:7946
            - GRID_SWIM_SITE_NAME=west-edge
            - GRID_SWIM_SEEDS={{ captures.east-edge.swim-lb-ip }}:7946,{{ captures.east-provider.swim-lb-ip }}:7946,{{ captures.west-provider.swim-lb-ip }}:7946
            - GRID_GATEWAY_SERVICE_NAME=edge-gateway
            - GRID_GATEWAY_PORT=8080
            - RUST_LOG=info
        - type: exec
          command:
            - kubectl
            - --context
            - kind-grid-glb-west-edge
            - -n
            - grid-system
            - rollout
            - status
            - deployment/grid-operator
            - --timeout=120s

    east-provider-site:
      description: East provider site and inference capacity
      steps:
        - type: manifest
          path: resources/site-east-provider.yaml
        - type: manifest
          path: resources/inference-east-provider.yaml
        - type: template-manifest
          path: resources/gridnetwork-east-provider.yaml

    west-provider-site:
      description: West provider site and inference capacity
      steps:
        - type: manifest
          path: resources/site-west-provider.yaml
        - type: manifest
          path: resources/inference-west-provider.yaml
        - type: template-manifest
          path: resources/gridnetwork-west-provider.yaml

    east-edge-site:
      description: East edge site and operator-rendered routing overlay
      steps:
        - type: manifest
          path: resources/operator-role-binding-grid-system.yaml
        - type: manifest
          path: resources/site-east-edge.yaml
        - type: manifest
          path: policies/provider-access.yaml
        - type: template-manifest
          path: resources/gridnetwork-east-edge.yaml

    west-edge-site:
      description: West edge site and operator-rendered routing overlay
      steps:
        - type: manifest
          path: resources/operator-role-binding-grid-system.yaml
        - type: manifest
          path: resources/site-west-edge.yaml
        - type: manifest
          path: policies/provider-access.yaml
        - type: template-manifest
          path: resources/gridnetwork-west-edge.yaml

    inference-sim:
      description: Private inference backend behind an mTLS Praxis provider gateway
      steps:
        - type: template-manifest
          path: resources/provider-workloads.yaml
        - type: exec
          command:
            - bash
            - -c
            - >-
              kubectl --context kind-grid-glb-{{ cluster.name }} -n grid-system
              create configmap provider-gateway-config
              --from-file=praxis.yaml=.forge/runtime/glb-tls/provider-configs/{{ cluster.name }}/praxis.yaml
              --dry-run=client -o yaml |
              kubectl --context kind-grid-glb-{{ cluster.name }} apply -f -
        - type: template-manifest
          path: resources/provider-gateway-deployment.yaml
        - type: manifest
          path: resources/backend-network-policy.yaml
        - type: manifest
          path: resources/provider-gateway.yaml
        - type: wait
          resource: deployment/mock-inference
          namespace: grid-system
          condition: available
          timeout: "120s"
        - type: wait
          resource: deployment/provider-gateway
          namespace: grid-system
          condition: available
          timeout: "120s"
        - type: capture
          resource: svc/provider-gateway
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: provider-gateway-ip
          timeout: "60s"
          interval: "2s"

    edge-gateway:
      description: Kubernetes-native Praxis edge with a projected Grid overlay
      steps:
        - type: template-file
          source: configs/edge/praxis.yaml
          target: .forge/runtime/{{ cluster.name }}/edge/praxis.yaml
        - type: exec
          command:
            - bash
            - -c
            - >-
              kubectl --context kind-grid-glb-{{ cluster.name }} -n grid-system
              create configmap edge-gateway-config
              --from-file=praxis.yaml=.forge/runtime/{{ cluster.name }}/edge/praxis.yaml
              --dry-run=client -o yaml |
              kubectl --context kind-grid-glb-{{ cluster.name }} apply -f -
        - type: template-manifest
          path: resources/edge-gateway-deployment.yaml
        - type: manifest
          path: resources/edge-gateway-service.yaml
        - type: wait
          resource: deployment/edge-gateway
          namespace: grid-system
          condition: available
          timeout: "120s"
        - type: capture
          resource: svc/edge-gateway
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: edge-gateway-ip
          timeout: "60s"
          interval: "2s"

    gtm-emulator:
      description: Local Praxis emulator for a managed GTM or global load-balancing service
      steps:
        - type: manifest
          path: resources/grid-system-namespace.yaml
        - type: template-file
          source: configs/gtm-emulator/praxis.yaml
          target: .forge/runtime/gtm-emulator/praxis.yaml
        - type: exec
          command:
            - bash
            - -c
            - >-
              kubectl --context kind-grid-glb-gtm-emulator -n grid-system
              create configmap gtm-emulator-config
              --from-file=praxis.yaml=.forge/runtime/gtm-emulator/praxis.yaml
              --dry-run=client -o yaml |
              kubectl --context kind-grid-glb-gtm-emulator apply -f -
        - type: template-manifest
          path: resources/gtm-emulator-deployment.yaml
        - type: manifest
          path: resources/gtm-emulator-service.yaml
        - type: wait
          resource: deployment/gtm-emulator
          namespace: grid-system
          condition: available
          timeout: "120s"
        - type: capture
          resource: svc/gtm-emulator
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: gtm-emulator-ip
          timeout: "60s"
          interval: "2s"
