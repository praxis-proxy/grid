apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: grid-system
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/component: public-edge
    app.kubernetes.io/part-of: grid-glb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/component: public-edge
        app.kubernetes.io/part-of: grid-glb-demo
        grid.praxis-proxy.io/edge-site: "{{ cluster.name }}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis-ai
          image: "{{ cluster.properties.gatewayImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          args:
            - "--config"
            - /etc/praxis/praxis.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: overlay
              mountPath: /etc/grid
              readOnly: true
            - name: edge-tls
              mountPath: /etc/praxis/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge-gateway-config
        - name: overlay
          configMap:
            name: grid-overlay-glb-demo-edge-gateway
            items:
              - key: grid-config.json
                path: grid-config.json
        - name: edge-tls
          secret:
            secretName: edge-gateway-tls
