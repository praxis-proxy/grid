apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtm-emulator
  namespace: grid-system
  labels:
    app.kubernetes.io/name: gtm-emulator
    app.kubernetes.io/component: local-global-ingress-emulator
    app.kubernetes.io/part-of: grid-glb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gtm-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtm-emulator
        app.kubernetes.io/component: local-global-ingress-emulator
        app.kubernetes.io/part-of: grid-glb-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: "{{ cluster.properties.gatewayImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          args:
            - "--config"
            - /etc/praxis/praxis.yaml
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: tls
              mountPath: /etc/praxis/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gtm-emulator-config
        - name: tls
          secret:
            secretName: gtm-emulator-tls
