apiVersion: grid.praxis-proxy.io/v1alpha1
kind: GridNetwork
metadata:
  name: glb-demo
  labels:
    grid.praxis-proxy.io/auto-discover-sites: "true"
spec:
  gridId: grid-glb-demo-v1
  region: west
  zone: west-provider-1
  seeds:
    - "{{ captures.east-edge.swim-lb-ip }}:7946"
    - "{{ captures.east-provider.swim-lb-ip }}:7946"
    - "{{ captures.west-edge.swim-lb-ip }}:7946"
  swim:
    probeInterval: "5s"
    suspicionTimeout: "15s"
    gossipNodes: 3
  tls:
    caSecretRef: null
    siteSecretRef:
      name: provider-gateway-tls
      namespace: grid-system
    swimKeyRef: null
