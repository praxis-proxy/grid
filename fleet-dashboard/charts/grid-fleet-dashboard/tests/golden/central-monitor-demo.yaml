data:
  config.yaml: |
    thresholds:
      gpuUtilWarn: 90
      latencyWarnMs: 5000
      queueWarn: 50
      redAfterFailures: 2
    hub:
      lat: 39.04
      lng: -77.49
      name: aigrid-ds-hub
      region: us-east-1
    queries:
      gpuTotal: sum(kube_node_status_allocatable{resource="nvidia_com_gpu"})
      gpuUtil: avg(vllm:gpu_cache_usage_perc)*100
      models: count by (model_name) (vllm:num_requests_running)
      p50LatencyMs: histogram_quantile(0.5, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))
        * 1000
      queueDepth: sum(vllm:num_requests_waiting)
      readyEndpoints: max(llm_d_epp_ready_endpoints)
      replicasDown: sum(kube_deployment_spec_replicas{deployment=~".*vllm.*"}) - sum(kube_deployment_status_replicas_available{deployment=~".*vllm.*"})
      rps: sum(rate(vllm:request_success_total[1m]))
      tenants: ""
      tokensPerSec: sum(rate(vllm:generation_tokens_total[1m]))
