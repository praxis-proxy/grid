# Source: grid-fleet-dashboard/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-fleet-dashboard
  namespace: aigrid-fleet
  labels:
    helm.sh/chart: grid-fleet-dashboard-0.1.4
    app.kubernetes.io/name: grid-fleet-dashboard
    app.kubernetes.io/instance: grid-fleet-dashboard
    app.kubernetes.io/version: "v0.1.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-fleet-dashboard
      app.kubernetes.io/instance: grid-fleet-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-fleet-dashboard
        app.kubernetes.io/instance: grid-fleet-dashboard
      annotations:
        checksum/config: 6bf00f662c9bc86befaf7a4df99d7092b3a7b07b7aacea45b2333c9514904dde
    spec:
      serviceAccountName: grid-fleet-dashboard
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "ghcr.io/praxis-proxy/grid-fleet-dashboard:v0.1.4"
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --registry-configmap=epp-clusters
            - --registry-key=clusters.yaml
            - --metrics-mode=central
            - --central-url=https://observatorium-api.example.com/api/metrics/v1/default
            - --cluster-label=cluster_name
            - --poll-interval=15s
            - --site-timeout=8s
            - --config=/etc/fleet/config.yaml
            - --central-ca-file=/etc/fleet-ca/ca.crt
            - --demo
          env:
            - name: FLEET_CENTRAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: central-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/fleet
              readOnly: true
            - name: central-ca
              mountPath: /etc/fleet-ca
              readOnly: true
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.17
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://localhost:8080
            - --openshift-service-account=grid-fleet-dashboard
            - '--openshift-sar={"namespace":"aigrid-fleet","resource":"configmaps","verb":"get"}'
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fleet-config
        - name: central-ca
          configMap:
            name: central-ca
        - name: proxy-tls
          secret:
            secretName: grid-fleet-dashboard-tls
        - name: proxy-cookie
          secret:
            secretName: grid-fleet-dashboard-cookie
