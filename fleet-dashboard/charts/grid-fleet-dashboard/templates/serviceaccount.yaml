apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleet-dashboard.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-dashboard.labels" . | nindent 4 }}
  {{- if and .Values.auth.oauthProxy.enabled .Values.route.enabled }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "fleet-dashboard.fullname" . }}"}}'
  {{- end }}
