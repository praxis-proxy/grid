apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fleet-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fleet-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fleet-dashboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fleet-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
