{{- if .Values.auth.oauthProxy.enabled }}
{{- $name := include "fleet-dashboard.cookieSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if .Values.auth.oauthProxy.cookieSecret }}
{{- $value = .Values.auth.oauthProxy.cookieSecret | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "session_secret") }}
{{- $value = index $existing.data "session_secret" }}
{{- else }}
{{- $value = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ $value }}
{{- end }}
